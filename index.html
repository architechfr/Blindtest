      Object.keys(state.players).forEach(function (id) {
        var t = state.players[id].team;
        if (typeof t === 'number' && t < state.teams && id !== pl.id) counts[t]++;
      });
      var min = 0; for (var j = 1; j < state.teams; j++) if (counts[j] < counts[min]) min = j;
      pl.team = min;
    }
    function reassignTeams() {
      var ids = leaderboardArr(state.players).map(function (p) { return p.id; });
      ids.forEach(function (id, i) { state.players[id].team = state.teams ? (i % state.teams) : null; });
    }
    function ensurePlayer(id, name) {
      if (!state.players[id]) {
        // ord = ordre d'arrivée, FIXE. Sert aux rotations (DJ, fredonneur) :
        // on ne doit JAMAIS se baser sur le classement, qui bouge à chaque point.
        var maxOrd = -1;
        Object.keys(state.players).forEach(function (k) { if (typeof state.players[k].ord === 'number' && state.players[k].ord > maxOrd) maxOrd = state.players[k].ord; });
        // played = manches où le joueur POUVAIT marquer (il n'était ni DJ ni fredonneur).
        // djTurns = nombre de titres passés aux commandes. Sert à l'équité du classement.
        // streak = bonnes réponses d'affilée (combo) ; jx2 / jsh = jokers restants.
        // jct = 🚫 Contre : le seul joker offensif (barre le meneur sur un titre).
        state.players[id] = { id: id, name: name || 'Joueur', score: 0, team: null, ord: maxOrd + 1,
                              played: 0, djTurns: 0, streak: 0, best: 0,
                              jx2: state.jokers ? 1 : 0, jsh: state.jokers ? 1 : 0,
                              jct: state.jokers ? 1 : 0 };
        if (state.teams) assignTeam(state.players[id]);
      }
      /* On ne réécrit PLUS le pseudo ici. Chaque intention (buzz, passe, réponse…)
         porte le nom stocké sur le téléphone du joueur : le réappliquer à chaque
         fois annulait silencieusement le renommage fait par l'hôte, à la première
         action du joueur. Le nom ne se fixe qu'à l'arrivée (action 'join'). */
      return state.players[id];
    }
    /* Ordre STABLE (arrivée) pour les rotations — à ne pas confondre avec le classement. */
    function rotationArr() {
      return Object.keys(state.players)
        .map(function (k) { return state.players[k]; })
        .sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
    }

    /* Réception des intentions joueurs */
    function onIntent(p) {
      if (!p || !p.id) return;
      if (p.action === 'join') {
        var connu = !!state.players[p.id];
        var jp = ensurePlayer(p.id, p.name);
        /* Le pseudo du téléphone ne compte QU'À LA PREMIÈRE ARRIVÉE. Un joueur qui
           revient garde son nom : sinon il lui suffisait de se reconnecter pour se
           rebaptiser en pleine partie (et brouiller le classement). Seul l'hôte
           renomme, et sa correction fait autorité. */
        if (p.name && !connu && !jp.renamedByHost) jp.name = p.name;
        beep(880, 0.08, 'sine');
        publish();
      } else if (p.action === 'buzz') {
        // Premier buzz reçu pendant la phase "buzzing" gagne — sauf si un contre le
        // retient encore (ralenti, second couteau). Ceinture ET bretelles : l'écran
        // désactive déjà le bouton, mais la règle ne doit pas dépendre de l'affichage.
        if (state.phase === 'buzzing' && !state.buzzer && canBuzz(p.id) && !contreEmpeche(p.id)) {
          var pl = ensurePlayer(p.id, p.name);
          state.buzzer = { id: pl.id, name: pl.name };
          state.phase = 'answering';
          dzPause(); // coupe l'extrait dès le buzz
          beep(180, 0.35, 'square'); vibrate([0, 120, 60, 120]);
          publish();
        }
      } else if (p.action === 'pass') {
        /* « Je ne sais pas » : on renonce à cette manche. Quand plus personne ne peut
           buzzer, l'app révèle le titre et clôt — au lieu de laisser tourner un extrait
           que personne ne reconnaît. */
        if (state.phase === 'buzzing' && !state.buzzer && canBuzz(p.id)) {
          var pp = ensurePlayer(p.id, p.name);
          state.tried = (state.tried || []).concat([p.id]);
          /* L'animateur DOIT le voir : un simple compteur discret ne suffisait pas,
             il ne savait ni que quelqu'un passait, ni qui. */
          beep(300, 0.08, 'sine'); vibrate(30);
          toast('🤷 ' + pp.name + ' passe son tour', 'info');
          if (!eligibleBuzzers().length) { noOneKnows(); return; }
          publish();
        }
      } else if (p.action === 'answer') {
        if (state.phase === 'answering' && state.buzzer && state.buzzer.id === p.id) {
          state.answer = String(p.text || '').slice(0, 120);
          // Chrono : temps entre l'ouverture du buzz et la réponse envoyée (info pour le DJ).
          if (state.buzzOpenAt) state.buzzMs = Date.now() - state.buzzOpenAt;
          state.suggest = (state.mode !== 'fredonne') ? fuzzyHit(state.answer, roundTrack, modeReponse(state.buzzer.id)) : null;
          beep(520, 0.12, 'sine');
          /* À l'aveugle, personne ne peut juger (personne ne connaît le titre) :
             l'app tranche seule, tout de suite. Idéal à deux joueurs.
             « À moitié » compte comme une RÉUSSITE partielle (moitié des points) :
             passé en `correct = false`, il appliquait le malus complet — l'écran
             annonçait « Raté ! −2 (à moitié) », ce qui ne veut rien dire. */
          if (appCorrige()) {
            if (roundTrack) { validate(state.suggest === 'ok' || state.suggest === 'half', state.suggest === 'half'); return; }
            manchePerdue(); return;   // sans référence, on n'envoie personne juger à l'aveugle
          }
          state.phase = (state.mode === 'fredonne') ? 'judging' : 'voting';
          state.voteAt = Date.now(); // départ du temps de vote des autres joueurs
          publish();
        }
      } else if (p.action === 'joker') {
        // Un joker s'active AVANT de connaître le résultat, et une seule fois par manche.
        var jp = state.players[p.id];
        if (!jp || !state.jokers) return;
        if ((state.jok || {})[p.id]) return;                       // déjà un joker sur cette manche
        if (state.phase === 'reveal' || state.phase === 'ended' ||
            state.phase === 'turbo_reveal' || state.phase === 'year_reveal' || state.phase === 'lobby') return;
        if (p.kind === 'x2' && jp.jx2 > 0) { jp.jx2--; state.jok[p.id] = 'x2'; }
        else if (p.kind === 'sh' && jp.jsh > 0) { jp.jsh--; state.jok[p.id] = 'sh'; }
        else return;
        beep(920, 0.12, 'sine');
        publish();
      } else if (p.action === 'contre') {
        /* 🚫 CONTRE — le seul joker qui vise QUELQU'UN D'AUTRE. On barre le meneur
           sur ce titre : il ne peut plus buzzer, donc plus marquer. Réservé à ceux
           qui ne mènent pas (sinon le meneur se protège lui-même), un seul par
           manche pour toute la table, et jamais une fois le buzz parti — sinon on
           annulerait une réponse déjà donnée.
           Réutilise `tried` / `canBuzz` : la mécanique de verrouillage existe déjà. */
        var cp = state.players[p.id];
        if (!cp || !state.jokers || (cp.jct || 0) <= 0) return;
        if (state.contre) return;                                   // un seul contre par manche
        if (state.phase !== 'armed' && state.phase !== 'buzzing') return;
        if (state.buzzer) return;
        var meneur = leaderId();
        if (!meneur || meneur === p.id) return;                     // on ne se contre pas soi-même
        if (!canBuzz(meneur)) return;                               // déjà hors course
        cp.jct--;
        /* L'effet vient du réglage « Effet du contre ». « 🎲 Au hasard » tire à
           chaque fois : personne ne peut s'y préparer, et c'est le réglage qui
           demande le moins de décisions à celui qui monte la partie. */
        var eff = state.contreMode || 'ice';
        if (eff === 'rand' || !CONTRE_EFFETS[eff]) {
          eff = CONTRE_ORDRE[(Math.random() * CONTRE_ORDRE.length) | 0];
        }
        // Seul « barré sec » sort le meneur de la manche ; les autres le gênent.
        if (eff === 'block') state.tried = (state.tried || []).concat([meneur]);
        state.contre = { by: cp.name, target: (state.players[meneur] || {}).name || '',
                         targetId: meneur, eff: eff, ice: eff === 'ice' ? 1 : 0,
                         // « ralenti » : instant à partir duquel son buzz s'ouvre.
                         openAt: eff === 'slow' ? Date.now() + CONTRE_DELAI : 0 };
        var inf = CONTRE_EFFETS[eff];
        beep(160, 0.3, 'sawtooth'); vibrate([0, 80, 40, 80]);
        toast(inf.icon + ' ' + state.contre.by + ' ' + inf.verbe + ' ' + state.contre.target + ' !', 'info');
        if (!eligibleBuzzers().length) { noOneKnows(); return; }
        publish();
      } else if (p.action === 'race') {
        // Mode Turbo : chacun envoie sa réponse, on horodate pour le barème vitesse.
        if (state.phase === 'racing' && !state.answers[p.id] && !(state.dj && state.dj.id === p.id)) {
          var rp = ensurePlayer(p.id, p.name);
          state.answers[p.id] = { name: rp.name, text: String(p.text || '').slice(0, 120), ms: Date.now() - (state.buzzOpenAt || Date.now()) };
          beep(660, 0.06, 'sine');
          // IMPORTANT : pas de publish() ici. Renvoyer tout l'état reconstruirait l'écran
          // des joueurs en train d'écrire et effacerait leur saisie. On met à jour l'hôte
          // localement et on envoie juste un accusé léger (utile au DJ + à l'auteur).
          persist(); renderHost();
          if (chan) chan.sendProgress({ count: Object.keys(state.answers).length, total: Object.keys(state.players).length, from: p.id, ms: state.answers[p.id].ms, name: rp.name });
        }
      } else if (p.action === 'vote') {
        /* Qui a déjà tenté sa chance sur ce titre NE VOTE PLUS. Sans ça, celui qui
           venait de répondre faux (−2) rebuzzait mentalement en votant sur la
           réponse suivante et récupérait +2 aussitôt : sa mauvaise réponse ne lui
           coûtait plus rien. On a raté, on regarde. */
        if (state.phase === 'voting' && state.buzzer && state.buzzer.id !== p.id
            && (state.tried || []).indexOf(p.id) < 0) {
          state.votes[p.id] = p.value === 1 ? 1 : -1;
          // L'hôte a répondu et personne d'autre ne peut juger : dès que tout le
          // monde a voté, le verdict tombe sans que l'hôte ait à toucher à rien.
          if (hostIsAnswering() && !otherJudge() && voteComplete()) { resolveByVote(); return; }
          publish();
        }
      } else if (p.action === 'judge') {
        // Le fredonneur (mode Fredonne) OU le DJ de la série tranche depuis son téléphone.
        var isSource = state.source && state.source.id === p.id;
        var isDJ = state.dj && state.dj.id === p.id;
        if (state.buzzer && state.buzzer.id === p.id) return;   // jamais son propre verdict
        if ((state.phase === 'judging' || state.phase === 'voting') && (isSource || isDJ)) {
          // Le DJ joint la fiche de SON morceau : on l'utilise pour la révélation.
          if (p.reveal && p.reveal.title) roundTrack = p.reveal;
          validate(p.correct === true, p.partial === true);
        }
      } else if (p.action === 'grade') {
        // Mode Turbo : le DJ corrige une réponse depuis son téléphone — sauf la sienne.
        if (state.phase === 'grading' && state.dj && state.dj.id === p.id && p.target
            && p.target !== state._autoGraded) {
          state.grades[p.target] = p.g;
          publish();
        }
      } else if (p.action === 'forceJudge') {
        // Réponse donnée à l'oral : le DJ passe directement au jugement.
        if (state.dj && state.dj.id === p.id && state.phase === 'answering') {
          state.answer = null; state.suggest = null;
          state.phase = (state.mode === 'fredonne') ? 'judging' : 'voting';
          state.voteAt = Date.now();
          publish();
        }
      } else if (p.action === 'nextRound') {
        // Le DJ de la série enchaîne lui-même sur le titre suivant.
        if (state.dj && state.dj.id === p.id && (state.phase === 'reveal' || state.phase === 'turbo_reveal' || state.phase === 'year_reveal')) {
          if (p.reveal && p.reveal.title) roundTrack = p.reveal;
          launchRound();
        }
      } else if (p.action === 'endGame') {
        // Le DJ de la série clôt la partie depuis son téléphone. Le téléphone de l'hôte
        // reste le serveur : il se contente d'exécuter l'intention, comme pour 'nextRound'.
        // Limité aux phases de révélation pour ne jamais tuer une manche en cours.
        if (state.dj && state.dj.id === p.id &&
            (state.phase === 'reveal' || state.phase === 'turbo_reveal' || state.phase === 'year_reveal')) {
          endGame();
        }
      } else if (p.action === 'closeRace') {
        if (state.phase === 'racing' && state.dj && state.dj.id === p.id) closeRacing();
      } else if (p.action === 'applyTurbo') {
        if (state.phase === 'grading' && state.dj && state.dj.id === p.id) {
          if (p.reveal && p.reveal.title) roundTrack = p.reveal;
          applyTurbo();
        }
      } else if (p.action === 'guess') {
        // Devine l'année : un joueur propose une année.
        if (state.phase === 'year_guess') {
          var gy = parseInt(p.year, 10);
          if (!isNaN(gy)) { ensurePlayer(p.id, p.name); state.guesses[p.id] = gy; beep(660, 0.06, 'sine'); publish(); }
        }
      } else if (p.action === 'leave') {
        // On garde le score (reconnexion possible) mais on peut nettoyer le lobby.
        publish();
      }
    }

    /* Le créateur est un joueur à part entière (réglage « Je joue aussi », activé
       par défaut) : il apparaît donc dans le salon dès la création de la partie.
       Il ne marque simplement pas de points sur les titres qu'il choisit lui-même. */
    if (state.hostPlays !== 0) ensurePlayer(ME, state.hostName);

    var chan = openChannel(code, { id: ME, name: state.hostName, role: 'host' }, {
      onIntent: onIntent,
      onReady: function () { publish(); },
      onPresence: function (st) {
        // Marque présents / absents pour l'affichage hôte (scores conservés).
        var present = {};
        Object.keys(st).forEach(function (k) { (st[k] || []).forEach(function (m) { present[m.id] = true; }); });
        state._present = present;
        renderHost();
      }
    });

    /* Actions hôte (machine à états) */
    function resetRound() {
      state.buzzer = null; state.answer = null; state.votes = {}; state.result = null; state.guesses = {}; state.year = null;
      state.reveal = null; state.suggest = null;
      state.buzzOpenAt = 0; state.buzzMs = null; state.voteAt = 0; state.tried = [];
      state.answers = {}; state.grades = {}; state.turboScores = null; state.jok = {};
      state.bonusMsg = null; state._autoGraded = null; state.contre = null;
    }
    function armBuzz() {
      state.phase = 'armed';
      state.buzzAt = Date.now() + BUZZ_LOCK_MS;
      publish();
      setTimeout(function () {
        if (state.phase === 'armed') {
          state.phase = 'buzzing'; state.buzzOpenAt = Date.now(); beep(740, 0.12, 'sine');
          if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview);
          publish();
        }
      }, BUZZ_LOCK_MS);
    }
    /* ---------------------------------------------------------------
       ⚡ TAC O TAC — la finale obligatoire du mode Dingo.
       Atteindre l'objectif n'arrête pas la partie : les écarts sont
       ÉCRASÉS (l'ordre du classement est conservé — la partie jouée
       compte encore — mais il ne reste qu'un pas fixe entre chacun),
       puis on enchaîne des manches à l'aveugle qui valent double.
       Le dernier peut donc repasser devant quoi qu'il ait fait avant :
       c'est la promesse du mode, et elle doit tenir par le CALCUL, pas
       par la chance. Pendant le tac o tac, plus aucun handicap : à ce
       moment-là tout le monde est à armes égales.
       --------------------------------------------------------------- */
    var TAC_MULT = 2;
    function nivelle() {
      var arr = leaderboardArr(state.players);          // du meilleur au dernier
      if (arr.length < 2) return;
      var pas = Math.abs((state.config && state.config.pointsBuzz) || 5) || 5;
      var bas = arr[arr.length - 1].score;
      /* Les ex aequo doivent le RESTER : sans ce calcul de rang, deux joueurs à
         égalité se retrouvaient séparés d'un pas par le seul hasard du tri. */
      var rang = 0, rangs = [];
      arr.forEach(function (p, i) {
        if (i > 0 && p.score !== arr[i - 1].score) rang++;
        rangs.push(rang);
      });
      arr.forEach(function (p, i) { p.score = bas + (rang - rangs[i]) * pas; });
    }
    function startTac() {
      state.tac = 1;
      // Assez de manches pour que le dernier puisse remonter tout le monde.
      state.tacTotal = Math.max(3, Math.min(7, Object.keys(state.players).length + 1));
      state.tacLeft = state.tacTotal;
      nivelle();
      state.mode = 'classic';                 // au buzz : le duel se joue de vitesse
      state.wheel = 0; state.challenge = null; state.mult = 1;
      confetti(200); beep(880, 0.35, 'sine');
      toast('⚡ TAC O TAC — écarts écrasés, tout le monde peut gagner', 'ok');
    }

    /* ---------------------------------------------------------------
       À L'AVEUGLE, L'APP EST LE SEUL JUGE POSSIBLE : celui qui répond ne
       valide pas sa propre réponse, et les autres ne connaissent pas le
       titre. Sans morceau de référence, plus personne ne peut trancher —
       à deux joueurs, la table reste bloquée sur une réponse en suspens
       (bug rencontré en soirée). On attend donc le morceau AVANT d'ouvrir
       le buzz, au lieu de lancer une manche que rien ne pourra clore.
       --------------------------------------------------------------- */
    var attenteMorceau = false;

    function launchRound() {
      syncBlindAudio();
      /* On ne teste QUE state.blind : `blindRound` porte encore la valeur de la manche
         précédente à cet instant (il est recalculé plus bas). Les manches à l'aveugle
         de fin de tour passent, elles, par le filet de manchePerdue(). */
      if (state.blind && !roundTrack && canPlayInApp()) {
        if (!plActive() && !fActive()) { autoPls = ['p80']; savePls(); }
        /* Les filtres survivent d'une partie à l'autre : un croisement qui ne
           correspond à aucun artiste (hérité d'une soirée précédente) arrêtait la
           partie net — et à l'aveugle, l'hôte n'a aucun écran pour les corriger.
           On répare tout seul plutôt que de laisser la soirée en panne. */
        var dispo = currentArtists();
        if (!dispo || !dispo.length) {
          autoF = { d: [], g: [], l: [] }; store.set('autoFilters', autoF);
          autoPls = ['p80']; savePls();
          toast('Aucun artiste ne correspondait aux filtres — retour aux Années 80', 'info');
        }
        attenteMorceau = true;
        prefetchAuto();                       // la recherche est asynchrone…
        if (!roundTrack) {                    // …donc on rend la main et on reviendra ici
          /* Sauf si AUCUNE recherche n'a pu démarrer (croisement de filtres qui ne
             correspond à aucun artiste) : là, personne ne rappellera launchRound et
             l'hôte ne pourrait plus jamais lancer de manche. Une attente sans fin est
             pire que le bug qu'on répare — on rend la main en disant pourquoi. */
          if (!autoLoading) {
            attenteMorceau = false;
            toast('Aucun morceau disponible — élargis la playlist ou les filtres', 'err');
            renderHost(); return;
          }
          toast('🔎 Recherche du morceau…', 'info');
          renderHost(); return;
        }
        attenteMorceau = false;
      }
      /* Objectif atteint en Dingo : on n'arrête pas, on ouvre le tac o tac. */
      if (state.dingo && !state.tac && goalReached(state)) startTac();
      if (state.tac) {
        if ((state.tacLeft || 0) <= 0) { endGame(); return; }
        state.tacLeft = state.tacLeft - 1;
      }
      state.round += 1;
      resetRound();
      /* ROUE DES DÉFIS : on tire le défi de la manche et on l'applique. */
      if (state.wheel) {
        var prev = state.challenge ? state.challenge.id : null;
        var c = pickChallenge(prev);
        state.challenge = { id: c.id, icon: c.icon, name: c.name, desc: c.desc, risky: !!c.risky };
        state.mode = c.mode;
        if (c.ans) state.answerMode = c.ans;
        state.mult = c.mult || 1;
        beep(880, 0.14, 'sine'); confetti(60);
      } else { state.challenge = null; state.mult = 1; }
      /* Rotation du DJ : tous les N titres, un joueur différent prend les commandes.
         Le DJ choisit le morceau → il connaît la réponse → il ne marque pas ce tour-ci. */
      /* FINALE À L'AVEUGLE : à la fin de chaque série de DJ, une manche où
         personne n'est aux commandes — l'app choisit, joue et corrige, et le
         DJ sortant joue enfin lui aussi. */
      state.blindRound = 0;
      /* TAC O TAC : manches à l'aveugle, personne aux commandes, l'app corrige —
         la seule configuration où le classement ne peut être arrangé par personne. */
      if (state.tac) { state.blindRound = 1; state.dj = null; state.source = null; }
      var nbDj = rotationArr().length;
      var tourComplet = nbDj > 0 && ((state._djIdx + 1) % nbDj === 0); // tous les DJ sont passés
      var nFinal = (state.finalN != null ? state.finalN : (state.blindFinal ? 1 : 0));
      if (!state.tac && state.djRotate && nFinal > 0 && state.djCount > 0
          && (state._djLeft || 0) <= 0              // le DJ courant a fini sa série
          && tourComplet
          && (state._blindDone || 0) < nFinal) {     // série de manches à l'aveugle
        state.blindRound = 1;
        state.dj = null;              // aucun DJ sur ces manches
        state.source = null;
        state._blindDone = (state._blindDone || 0) + 1;
        // Le tour complet + ses manches à l'aveugle = fin de la partie.
        if (state._blindDone >= nFinal) state._finTour = 1;
      }
      if (state.djRotate && !state.blindRound) {
        var dids = rotationArr().map(function (p) { return p.id; }); // ordre d'arrivée, stable
        if (dids.length) {
          /* On compte les titres restants au DJ courant plutôt que de faire un
             modulo sur le total : c'est le seul moyen de gérer une série dont la
             longueur est tirée au sort (djEvery = -1 → entre 1 et 5 titres). */
          if (!state.dj || (state._djLeft || 0) <= 0) {
            state._djIdx = state._djIdx + 1;
            state._djSpan = (state.djEvery === -1) ? (1 + ((Math.random() * 5) | 0)) : (state.djEvery || 5);
            state._djLeft = state._djSpan;
          }
          var did = dids[state._djIdx % dids.length];
          state.dj = { id: did, name: state.players[did].name };
          state._djLeft = (state._djLeft || 1) - 1;
          state.djCount = (state.djCount || 0) + 1;
        }
      } else if (!state.djRotate) { state.dj = null; }

      // La finale à l'aveugle a besoin d'un morceau choisi par l'app : si aucune
      // playlist n'est active, on en met une par défaut, sinon rien ne peut démarrer.
      if (state.blindRound) {
        syncBlindAudio();
        dzPause(); roundTrack = null;                 // le morceau du DJ précédent ne vaut plus
        if (!plActive() && !fActive()) { autoPls = ['p80']; savePls(); }
        prefetchAuto();
      }

      if (state.mode === 'fredonne') {
        var ids = rotationArr().map(function (p) { return p.id; }); // ordre d'arrivée, stable
        if (!ids.length) { toast('Aucun joueur pour fredonner', 'err'); state.round -= 1; state.phase = 'lobby'; publish(); return; }
        var every = state.fredEvery || 10;
        // On change de fredonneur seulement tous les "every" morceaux.
        if (!state.source || (state.fredCount % every === 0)) state._srcIdx = state._srcIdx + 1;
        var sid = ids[state._srcIdx % ids.length];
        state.source = { id: sid, name: state.players[sid].name };
        state.fredCount = (state.fredCount || 0) + 1;
      } else {
        state.source = null;
      }

      /* ÉQUITÉ : on comptabilise, pour chaque joueur, s'il pouvait marquer sur ce titre.
         Celui qui est aux commandes (DJ ou fredonneur) ne peut pas → il ne doit pas être
         pénalisé au classement final (voir fairScore()). */
      Object.keys(state.players).forEach(function (pid) {
        var atControls = (state.dj && state.dj.id === pid) || (state.source && state.source.id === pid);
        var pl = state.players[pid];
        if (atControls) pl.djTurns = (pl.djTurns || 0) + 1;
        else pl.played = (pl.played || 0) + 1;
      });

      syncAsk();   // le thème peut changer la question posée (film / série / dessin animé)

      if (state.mode === 'year') { state.phase = 'year_guess'; if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview); publish(); return; }
      if (state.mode === 'turbo') {
        // Tout le monde répond en même temps : le chrono démarre pour tous.
        state.phase = 'racing'; state.buzzOpenAt = Date.now();
        if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview);
        beep(740, 0.12, 'sine'); publish(); return;
      }
      armBuzz();
    }
    /* L'hôte peut jouer chaque fois qu'il NE CONNAÎT PAS la réponse :
       - mode Fredonne (quand ce n'est pas lui qui fredonne)
       - partie ou manche à l'aveugle (c'est l'app qui a choisi le morceau)
       - rotation DJ quand un autre joueur est aux commandes */
    function hostCanPlay() {
      if (state.hostPlays === 0) return false;            // il a choisi de ne pas jouer
      if (state.mode === 'fredonne') return !state.source || state.source.id !== ME;
      if (state.blind || state.blindRound) return true;
      if (state.djRotate && state.dj && state.dj.id !== ME) return true;
      return false;
    }

    /* ---------------------------------------------------------------
       VERROU ANTI-TRICHE — personne ne juge sa propre réponse.
       Celui qui crée la partie tient le serveur, mais ça ne lui donne
       aucun pouvoir sur les points : dès qu'il répond lui-même, il perd
       la main sur le verdict, dans TOUS les modes.
         · manche à l'aveugle → l'app tranche (elle connaît le titre)
         · un autre juge existe (DJ, fredonneur) → c'est lui qui tranche
         · sinon → la majorité des votes des autres joueurs tranche
       --------------------------------------------------------------- */
    function hostIsAnswering() { return !!(state.buzzer && state.buzzer.id === ME); }

    /* Qui peut ENCORE buzzer sur cette manche. Une seule définition, utilisée par le
       buzz joueur, le buzz hôte, le « je passe » et le calcul du rebond : quand cette
       règle existait en trois exemplaires, l'hôte y échappait (il pouvait rebuzzer
       juste après avoir perdu) et le DJ comptait à tort comme rebondisseur possible. */
    function eligibleBuzzers() {
      return Object.keys(state.players).filter(function (id) {
        if ((state.tried || []).indexOf(id) >= 0) return false;             // a déjà tenté ou passé
        if (state.mode === 'fredonne' && state.source && state.source.id === id) return false;
        if (state.dj && state.dj.id === id) return false;                    // le DJ connaît la réponse
        return true;
      });
    }
    function canBuzz(id) { return eligibleBuzzers().indexOf(id) >= 0; }
    /* Gêne TEMPORAIRE d'un contre, au moment précis du buzz. Volontairement séparé
       de canBuzz/eligibleBuzzers : le visé reste « quelqu'un qui peut encore
       répondre » — l'en retirer aurait clos la manche toute seule en le croyant
       hors jeu, alors qu'il va pouvoir jouer dans quelques secondes.
       Renvoie la clé de l'effet qui bloque, ou null. */
    function contreEmpeche(id) {
      var c = state.contre;
      if (!c || c.targetId !== id) return null;
      if (c.eff === 'slow' && Date.now() < (c.openAt || 0)) return 'slow';
      if (c.eff === 'second' && !(state.tried || []).length) return 'second';
      return null;
    }
    /* Ce que CE joueur doit trouver sur ce titre : l'« exigence » lui demande les
       deux quand les autres n'ont qu'une des deux à donner.
       Sur une manche « à œuvre » (film / série / dessin animé), la question du
       thème l'emporte sur TOUT le reste, exigence comprise : demander l'artiste
       d'une chanson Disney française, c'est poser une question sans réponse. */
    function modeReponse(id) {
      if (state.ask === 'oeuvre') return 'oeuvre';
      var c = state.contre;
      if (c && c.eff === 'exig' && c.targetId === id) return 'both';
      return state.answerMode;
    }
    /* La question posée par la manche en cours. Le morceau la porte (il vient d'un
       thème « à œuvre »), donc on la recalcule à chaque fois qu'il change — y
       compris quand la recherche le livre APRÈS le lancement de la manche.
       Un défi « titre seul » reste jouable tel quel : on ne l'écrase pas. */
    function syncAsk() {
      var oeu = roundTrack && roundTrack.oeuvre;
      if (oeu && state.answerMode !== 'title') {
        state.ask = 'oeuvre';
        state.askLabel = roundTrack.oeuLabel || 'L\'œuvre';
      } else { state.ask = null; state.askLabel = null; }
    }
    /* Le meneur au moment présent — cible du 🚫 Contre. En cas d'égalité en tête,
       personne ne mène : on ne barre pas quelqu'un au hasard. */
    function leaderId() {
      var arr = Object.keys(state.players).map(function (k) { return state.players[k]; });
      if (arr.length < 2) return null;
      arr.sort(function (a, b) { return b.score - a.score; });
      if (arr[0].score === arr[1].score) return null;
      return arr[0].id;
    }

    /* Personne ne trouve : on révèle le titre et on clôt la manche, au lieu de laisser
       le morceau tourner en boucle sans que personne sache quoi répondre. */
    function noOneKnows() {
      dzPause();
      state.buzzer = null; state.answer = null; state.votes = {}; state.suggest = null;
      if (roundTrack) { state.reveal = { title: roundTrack.title, artist: roundTrack.artist, cover: roundTrack.cover, year: roundTrack.year, oeuvre: roundTrack.oeuvre || null, oeuLabel: roundTrack.oeuLabel || null }; roundTrack = null; }
      state.result = { correct: false, gain: 0, none: true, streak: 0 };
      state.phase = 'reveal';
      state.history.push({ round: state.round, none: true });
      beep(200, 0.25, 'sawtooth');
      publish();
    }
    function otherJudge() {
      if (state.mode === 'fredonne' && state.source && state.source.id !== ME) return true;
      if (state.dj && state.dj.id !== ME) return true;
      return false;
    }
    /* Verdict rendu par les autres. Égalité ou aucun vote : l'app tranche si elle
       connaît le titre ; sinon la réponse est comptée fausse — on n'accorde jamais
       le bénéfice du doute à celui qui tient la partie. */
    function resolveByVote() {
      if (state.phase !== 'voting' || !state.buzzer) return;
      var t = tallyVotes();
      if (t.up > t.down) { validate(true, false); return; }
      if (t.down > t.up) { validate(false, false); return; }
      if (state.suggest) { validate(state.suggest === 'ok' || state.suggest === 'half', state.suggest === 'half'); return; }
      validate(false, false);
    }
    /* Le vote des autres est-il complet ? (tout le monde sauf celui qui a répondu) */
    function voteComplete() {
      var t = tallyVotes();
      // Même règle que l'affichage : ceux qui ont déjà tenté ce titre ne votent plus.
      var expected = Object.keys(state.players).filter(function (id) {
        return !(state.buzzer && state.buzzer.id === id) && (state.tried || []).indexOf(id) < 0;
      }).length;
      return expected > 0 && (t.up + t.down) >= expected;
    }

    function hostBuzz() {
      // canBuzz : l'hôte a longtemps échappé au filtre « déjà tenté » qui, lui,
      // n'existait que côté joueur — il pouvait donc rebuzzer juste après avoir raté.
      if (state.phase === 'buzzing' && !state.buzzer && hostCanPlay() && canBuzz(ME) && !contreEmpeche(ME)) {
        var pl = ensurePlayer(ME, state.hostName);
        state.buzzer = { id: pl.id, name: pl.name };
        state.phase = 'answering';
        beep(180, 0.35, 'square'); vibrate([0, 120, 60, 120]);
        publish();
      }
    }
    /* L'hôte renonce comme n'importe quel joueur (il joue aussi, en duel notamment). */
    function hostPass() {
      if (state.phase !== 'buzzing' || state.buzzer || !canBuzz(ME)) return;
      ensurePlayer(ME, state.hostName);
      state.tried = (state.tried || []).concat([ME]);
      beep(300, 0.08, 'sine');
      if (!eligibleBuzzers().length) { noOneKnows(); return; }
      publish();
    }
    /* L'hôte répond aussi en mode « tout le monde répond ». */
    function hostRace(text) {
      if (state.phase !== 'racing' || (state.answers && state.answers[ME])) return;
      var rp = ensurePlayer(ME, state.hostName);
      state.answers[ME] = { name: rp.name, text: String(text || '').slice(0, 120), ms: Date.now() - (state.buzzOpenAt || Date.now()) };
      beep(660, 0.06, 'sine');
      persist(); renderHost();
      if (chan) chan.sendProgress({ count: Object.keys(state.answers).length, total: Object.keys(state.players).length, from: ME, ms: state.answers[ME].ms, name: rp.name });
    }
    function hostAnswer(text) {
      if (state.phase === 'answering' && state.buzzer && state.buzzer.id === ME) {
        state.answer = String(text || '').slice(0, 120);
        if (state.buzzOpenAt) state.buzzMs = Date.now() - state.buzzOpenAt;
        /* Exactement le même traitement que pour un joueur — c'était le trou :
           l'hôte n'avait ni suggestion ni validation automatique, il arrivait donc
           toujours sur l'écran de verdict… qu'il pouvait trancher lui-même. */
        state.suggest = (state.mode !== 'fredonne') ? fuzzyHit(state.answer, roundTrack, modeReponse(state.buzzer.id)) : null;
        if (appCorrige()) {
          if (roundTrack) { validate(state.suggest === 'ok' || state.suggest === 'half', state.suggest === 'half'); return; }
          manchePerdue(); return;   // même filet que pour les joueurs
        }
        state.phase = (state.mode === 'fredonne') ? 'judging' : 'voting';
        state.voteAt = Date.now();
        publish();
      }
    }
    function revealYear(yr) {
      yr = parseInt(yr, 10);
      if (isNaN(yr) && roundTrack && roundTrack.year) yr = roundTrack.year;
      /* L'hôte a proposé une année lui aussi : il ne choisit pas celle qui le
         ferait gagner — l'année du morceau s'impose. */
      if (roundTrack && roundTrack.year && state.guesses[ME] != null) yr = roundTrack.year;
      if (isNaN(yr)) { toast('Entre une année (ou choisis un morceau Deezer)', 'err'); return; }
      dzPause();
      if (roundTrack) { state.reveal = { title: roundTrack.title, artist: roundTrack.artist, cover: roundTrack.cover, year: roundTrack.year, oeuvre: roundTrack.oeuvre || null, oeuLabel: roundTrack.oeuLabel || null }; roundTrack = null; }
      state.year = yr;
      var best = Infinity;
      Object.keys(state.guesses).forEach(function (id) { var d = Math.abs(state.guesses[id] - yr); if (d < best) best = d; });
      var winners = [];
      Object.keys(state.guesses).forEach(function (id) {
        if (Math.abs(state.guesses[id] - yr) === best) {
          winners.push(id);
          var wp = state.players[id];
          if (wp) {
            var g = state.config.pointsBuzz * (state.mult || 1);
            if ((state.jok || {})[id] === 'x2') g *= 2;
            wp.streak = (wp.streak || 0) + 1;
            if (wp.streak > (wp.best || 0)) wp.best = wp.streak;
            if (state.combos && wp.streak >= 2) g += Math.min(wp.streak - 1, 3);
            wp.score += g;
          }
        }
      });
      grantBonuses();
      state.result = { year: yr, winners: winners, best: best };
      state.phase = 'year_reveal';
      state.history.push({ round: state.round, year: yr });
      confetti(150); beep(880, 0.3, 'sine');
      publish();
    }
    /* ---------------------------------------------------------------
       BONUS QUI REVIENNENT — un joker consommé était perdu pour toute la
       partie, et la fin devenait plate. Deux robinets, volontairement
       opposés, appelés après chaque attribution de points :
         · la SÉRIE récompense les forts — 3 bonnes réponses d'affilée = 🃏 ×2
         · le RETARD fait revenir les autres — distancé par le leader = 🛡️
       Plafonné, pour qu'on les joue au lieu de les accumuler.
       --------------------------------------------------------------- */
    var JOKER_MAX = 3;
    function grantBonuses() {
      if (!state.jokers) return;
      var arr = Object.keys(state.players).map(function (k) { return state.players[k]; });
      if (!arr.length) return;
      var top = -Infinity;
      arr.forEach(function (p) { if (p.score > top) top = p.score; });
      // Le barème Turbo est sur 100, pas sur 5 : le seuil de « retard » suit le mode.
      var unite = (state.mode === 'turbo') ? 80 : Math.abs((state.config && state.config.pointsBuzz) || 5);
      var seuil = unite * 3;
      var msgs = [];
      arr.forEach(function (p) {
        if ((p.streak || 0) >= 3 && (p.streak % 3) === 0 && p._giftAt !== p.streak) {
          p._giftAt = p.streak;
          if ((p.jx2 || 0) < JOKER_MAX) {
            p.jx2 = (p.jx2 || 0) + 1;
            msgs.push('🔥 ' + p.name + ' · ' + p.streak + ' d\'affilée → 🃏 ×2');
          }
        }
        /* On ne réarme qu'un joueur qui n'a plus rien en main. Distancé, on donne
           d'abord le 🚫 Contre : barrer le meneur fait revenir bien plus qu'un
           bouclier, qui ne fait que limiter la casse. */
        if ((top - p.score) >= seuil && ((p.jx2 || 0) + (p.jsh || 0) + (p.jct || 0)) < 1) {
          if ((p.jct || 0) < 1) { p.jct = 1; msgs.push('🫱 ' + p.name + ' · distancé → 🚫 contre'); }
          else { p.jsh = (p.jsh || 0) + 1; msgs.push('🫱 ' + p.name + ' · distancé → 🛡️ bouclier'); }
        }
      });
      state.bonusMsg = msgs.length ? msgs : null;
    }

    /* FILET — à l'aveugle sans morceau de référence (recherche échouée, téléphone de
       l'hôte rechargé en pleine manche), l'app ne peut plus juger. Il ne faut SURTOUT
       pas renvoyer la décision à la table : celui qui a répondu n'a pas le droit de se
       valider, et les autres ne connaissent pas le titre — à deux, plus personne ne
       peut rien faire et la partie s'arrête net. On annule la manche, personne ne
       marque, on enchaîne : une manche blanche vaut mieux qu'une partie bloquée. */
    function manchePerdue() {
      dzPause();
      roundTrack = null;
      state.reveal = null;
      state.result = { none: true, lost: true };
      state.phase = 'reveal';
      beep(200, 0.2, 'sawtooth');
      toast('Morceau introuvable — manche annulée, on enchaîne', 'err');
      publish();
    }
    /* Vrai pour toute manche où c'est l'app qui corrige (partie ou manche à l'aveugle). */
    function appCorrige() { return !!(state.blind || state.blindRound) && state.mode !== 'fredonne'; }

    function validate(correct, partial) {
      if (!state.buzzer) return;
      var b = state.players[state.buzzer.id];
      // partial = mode « Titre + Artiste » avec une seule des deux trouvée → points réduits.
      var gain = correct ? (partial ? Math.ceil(state.config.pointsBuzz / 2) : state.config.pointsBuzz) : state.config.pointsWrong;
      var combo = 0, jokerLbl = '', dingoLbl = '';
      if (b) {
        // COMBO : bonnes réponses d'affilée → bonus croissant (+1, +2, +3 max)
        if (correct) {
          b.streak = (b.streak || 0) + 1;
          if (b.streak > (b.best || 0)) b.best = b.streak;
          if (state.combos && b.streak >= 2) { combo = Math.min(b.streak - 1, 3); gain += combo; }
        } else { b.streak = 0; }
        // JOKERS : ×2 double le gain, 🛡️ annule le malus
        // Défi « double points » / « mort subite » : le multiplicateur de la manche.
        var mlt = state.mult || 1;
        if (mlt > 1) {
          // En mort subite, le malus est doublé aussi ; sinon on ne double que les gains.
          if (correct || (state.challenge && state.challenge.risky)) gain *= mlt;
        }
        /* 💸 Quitte ou double : le contre ne bride pas le meneur, il double sa mise
           dans les deux sens. C'est le seul effet qui peut lui profiter — c'est
           voulu : celui qui le pose parie sur son assurance. */
        if (state.contre && state.contre.eff === 'dbl' && state.contre.targetId === b.id) {
          gain *= 2; jokerLbl = '💸 quitte ou double';
        }
        var jk = (state.jok || {})[b.id];
        if (jk === 'x2' && correct) { gain *= 2; jokerLbl = '🃏 ×2'; }
        else if (jk === 'sh' && !correct) { gain = 0; jokerLbl = '🛡️ protégé'; }
        /* DINGO : le handicap s'applique EN DERNIER, sur le total (combo et joker
           compris). Appliqué avant, un meneur bien lancé y échappait en empilant
           combo × joker ×2 — soit exactement la situation que le mode existe pour
           corriger. Le 🛡️ bouclier, lui, a déjà mis le gain à 0 : rien à faire. */
        var dg = dingoNiveau(state, b.id);
        if (dg) {
          if (gain > 0) {
            // k négatif : la bonne réponse coûte, à hauteur d'un titre — pas plus,
            // sinon un gros combo se transformait en punition démesurée.
            gain = (dg.k < 0) ? -Math.abs(Math.round(dg.unite)) : Math.round(gain * dg.k);
          } else if (gain < 0) gain = Math.round(gain * dg.m);
          // On n'annonce le handicap que s'il a changé quelque chose : au palier
          // neutre, « handicap dingo » sur un score inchangé n'est que du bruit.
          if (dg.k !== 1 || dg.m !== 1) dingoLbl = '🤪 ' + dg.icon;
        }
        // ⚡ TAC O TAC : plus de handicap, mais chaque manche vaut double.
        if (state.tac) gain *= TAC_MULT;
        b.score += gain;
      }
      // Le vote est un pari : bien juger rapporte, mal juger coûte.
      Object.keys(state.votes).forEach(function (vid) {
        var agreed = (state.votes[vid] === 1) === correct;
        if (!state.players[vid]) return;
        var vg = agreed ? state.config.pointsVote : (state.config.pointsVoteWrong || 0);
        /* Le handicap vaut AUSSI sur les votes : sans ça, le meneur bridé sur les
           buzz se refaisait tranquillement en jugeant les réponses des autres. */
        var dv = dingoNiveau(state, vid);
        if (dv && vg > 0) vg = Math.round(vg * Math.max(0, dv.k));
        state.players[vid].score += vg;
      });
      grantBonuses();
      state.result = { correct: correct, partial: !!partial, gain: gain, combo: combo, joker: jokerLbl, dingo: dingoLbl, streak: b ? b.streak : 0 };
      dzPause();
      /* Reste-t-il quelqu'un qui pourrait rebondir ? On inscrit d'abord celui qui vient
         de tenter dans `tried` : il ne rebondit pas sur sa propre erreur, et la liste
         reste juste même si l'hôte enchaîne sans passer par « Rebond ». */
      if (state.buzzer && (state.tried || []).indexOf(state.buzzer.id) < 0) {
        state.tried = (state.tried || []).concat([state.buzzer.id]);
      }
      var canRebound = !correct && eligibleBuzzers().length > 0;
      if (roundTrack && !canRebound) { state.reveal = { title: roundTrack.title, artist: roundTrack.artist, cover: roundTrack.cover, year: roundTrack.year, oeuvre: roundTrack.oeuvre || null, oeuLabel: roundTrack.oeuLabel || null }; roundTrack = null; }
      state.phase = 'reveal';
      state.history.push({
        round: state.round, buzzer: state.buzzer, answer: state.answer,
        correct: correct, votes: tallyVotes()
      });
      beep(correct ? 880 : 160, 0.3, correct ? 'sine' : 'sawtooth');
      if (correct) confetti(150);
      publish();
    }
    /* Rebond : après une mauvaise réponse, on rouvre le buzz aux AUTRES joueurs
       (celui qui vient de se tromper ne peut pas retenter). Le 1er à répondre juste marque. */
    function reopenBuzz() {
      var prev = (state.buzzer && state.buzzer.id) || null;
      var tried = state.tried || [];
      if (prev && tried.indexOf(prev) < 0) tried.push(prev);
      state.tried = tried;
      state.buzzer = null; state.answer = null; state.votes = {}; state.result = null;
      state.suggest = null; state.buzzMs = null; state.voteAt = 0;
      state.phase = 'buzzing'; state.buzzOpenAt = Date.now();
      if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview);
      beep(740, 0.12, 'sine');
      publish();
    }
    /* ---- MODE TURBO : tout le monde répond, points sur 100 selon la vitesse ----
       Barème pensé pour garder tout le monde en jeu :
         • bonne réponse  = 60 pts garantis + jusqu'à 40 pts de bonus vitesse (max 100)
         • à moitié       = la moitié du total obtenu
         • faux / absent  = 0 (aucun malus : on reste motivé jusqu'au bout)
         • le tout 1er à répondre juste gagne +10 « éclair » (plafonné à 100) */
    function closeRacing() {
      dzPause();
      /* Même filet qu'au buzz : sans morceau de référence, fuzzyHit note tout le monde
         « faux » et la manche punit des joueurs qui n'y sont pour rien. */
      if (appCorrige() && !roundTrack) { manchePerdue(); return; }
      state.grades = {};
      Object.keys(state.answers).forEach(function (id) {
        var g = fuzzyHit(state.answers[id].text, roundTrack, modeReponse(id));   // « exigence » : le contré doit donner les deux
        state.grades[id] = g || 'ko'; // pré-notation auto, l'hôte peut corriger
      });
      // Partie à l'aveugle : personne ne connaît la réponse, donc personne ne
      // corrige — l'app tranche seule et enchaîne directement sur les résultats.
      if (state.blind || state.blindRound) { applyTurbo(); return; }
      /* Le correcteur (DJ de la série, sinon l'hôte) a peut-être répondu lui aussi :
         sa note à lui est celle de l'app, définitive, et son bouton est verrouillé. */
      state._autoGraded = null;
      var correcteur = (state.dj && state.dj.id) ? state.dj.id : ME;
      if (state.answers[correcteur]) state._autoGraded = correcteur;
      state.phase = 'grading';
      publish();
    }
    function turboPoints() {
      var T = (state.turboSecs || 30) * 1000;
      var ids = Object.keys(state.answers);
      var goodSorted = ids.filter(function (id) { return state.grades[id] === 'ok' || state.grades[id] === 'half'; })
        .sort(function (a, b) { return state.answers[a].ms - state.answers[b].ms; });
      var first = goodSorted[0];
      var out = {};
      ids.forEach(function (id) {
        var g = state.grades[id], a = state.answers[id], pl = state.players[id];
        var jk = (state.jok || {})[id];
        if (g !== 'ok' && g !== 'half') {
          if (pl) pl.streak = 0;
          out[id] = { pts: 0, name: a.name, ms: a.ms, grade: g, joker: jk === 'sh' ? '🛡️' : '' };
          return;
        }
        var speed = Math.max(0, 1 - (a.ms / T));           // 1 = instantané, 0 = fin de fenêtre
        var pts = 60 + Math.round(40 * speed);              // 60 → 100
        if (id === first) pts = Math.min(100, pts + 10);    // bonus éclair au 1er juste
        if (g === 'half') pts = Math.round(pts / 2);        // une seule des deux trouvée
        // COMBO : +5 pts par cran de série (max +15), à l'échelle du barème /100
        var cb = 0;
        if (pl) {
          pl.streak = (pl.streak || 0) + 1;
          if (pl.streak > (pl.best || 0)) pl.best = pl.streak;
          if (state.combos && pl.streak >= 2) { cb = Math.min(pl.streak - 1, 3) * 5; pts += cb; }
        }
        if ((state.mult || 1) > 1) pts *= state.mult;   // défi « Turbo doublé »
        var jlbl = '';
        if (jk === 'x2') { pts *= 2; jlbl = '🃏×2'; }
        out[id] = { pts: pts, name: a.name, ms: a.ms, grade: g, first: id === first,
                    combo: cb, streak: pl ? pl.streak : 0, joker: jlbl };
      });
      return out;
    }
    function applyTurbo() {
      var res = turboPoints();
      /* Le Turbo distribue ses points par un chemin à lui : le handicap Dingo doit
         y être appliqué aussi, sinon changer de mode en cours de partie suffisait
         à l'annuler. On corrige la valeur affichée, pas seulement le score, pour
         que chacun voie ce qu'il a réellement pris. */
      Object.keys(res).forEach(function (id) {
        if (!state.players[id]) return;
        var dt = dingoNiveau(state, id);
        if (dt && res[id].pts > 0) {
          res[id].pts = (dt.k < 0) ? -Math.abs(Math.round(dt.unite)) : Math.round(res[id].pts * dt.k);
          res[id].dingo = dt.icon;
        }
        if (state.tac) res[id].pts *= TAC_MULT;
        state.players[id].score += res[id].pts;
      });
      grantBonuses();
      state.turboScores = res;
      if (roundTrack) { state.reveal = { title: roundTrack.title, artist: roundTrack.artist, cover: roundTrack.cover, year: roundTrack.year, oeuvre: roundTrack.oeuvre || null, oeuLabel: roundTrack.oeuLabel || null }; roundTrack = null; }
      state.phase = 'turbo_reveal';
      state.history.push({ round: state.round, turbo: res });
      confetti(180); beep(880, 0.3, 'sine');
      publish();
    }
    function endGame() { dzPause(); state.phase = 'ended'; confetti(240); archiveGame(state, state.code, state.hostName); publish(); }
    function replay() {
      Object.keys(state.players).forEach(function (id) {
        var p = state.players[id];
        p.score = 0; p.played = 0; p.djTurns = 0; p.streak = 0; p.best = 0; p._giftAt = 0;
        p.jx2 = state.jokers ? 1 : 0; p.jsh = state.jokers ? 1 : 0; p.jct = state.jokers ? 1 : 0;
      });
      state.round = 0; state.phase = 'lobby'; state._srcIdx = -1; state.fredCount = 0; state.source = null;
      state._djIdx = -1; state.djCount = 0; state.dj = null; state._djLeft = 0; state._djSpan = 0;
      // Sans ça, la partie suivante repartait directement en tac o tac.
      state.tac = 0; state.tacLeft = 0; state.tacTotal = 0; state._blindDone = 0; state._finTour = 0;
      dzPause(); roundTrack = null;
      resetRound(); state.history = [];
      publish();
    }
    function tallyVotes() {
      var up = 0, down = 0;
      Object.keys(state.votes).forEach(function (k) { state.votes[k] === 1 ? up++ : down++; });
      return { up: up, down: down };
    }

    /* Sélecteur de morceau Deezer (overlay) */
    var pickerEl = document.getElementById('picker');
    function closePicker() { if (pickerEl) { pickerEl.classList.add('hidden'); pickerEl.innerHTML = ''; } dzPause(); }
    function openMusicPicker() {

      var lastResults = [];
      function render(results, q, loading) {

              + (canPlayInApp()

              + '<button class="dzPick px-3 py-2 rounded-lg bg-neon-lime text-black font-bold text-sm" data-i="' + i + '">' + (canPlayInApp() ? 'Choisir' : 'Valider') + '</button>'
              + '</div>';

        } else if (results) list = '<p class="text-white/40 text-center py-6">Aucun résultat.</p>';
        pickerEl.innerHTML = [
          '<div class="set-panel p-5 animate-slidein">',

          (canPlayInApp() ? '' : '  <p class="text-white/50 text-xs mb-2">Cherche le titre que tu vas lancer sur ' + esc(platform().name) + ' : il restera caché et servira à la révélation + correction auto.</p>'),
          '  <div class="flex gap-2 mb-3"><input id="dzq" value="' + esc(q || '') + '" placeholder="Titre ou artiste…" class="flex-1 bg-black/40 rounded-xl px-4 py-3 outline-none focus:ring-2 ring-neon-cyan" /><button id="dzgo" class="px-4 rounded-xl bg-neon-cyan text-black font-extrabold">🔎</button></div>',

        ].join('');

        var go = function () { var q2 = ($('#dzq') || {}).value || ''; render(null, q2, true); musicSearch(q2, function (res) { lastResults = (res && res.length) ? res : (res === null ? null : []); render(lastResults, q2, false); }); };
        bind('#dzgo', go);
        var qi = $('#dzq'); if (qi) qi.onkeydown = function (e) { if (e.key === 'Enter') go(); };
        Array.prototype.forEach.call(pickerEl.querySelectorAll('.dzPrev'), function (b) { b.onclick = function () { var t = lastResults[+b.getAttribute('data-i')]; if (t) dzPlay(t.preview); }; });
        // Ouvre le morceau dans la plateforme du DJ (Spotify, YT Music…) pour qu'il le lance sur l'enceinte.
        Array.prototype.forEach.call(pickerEl.querySelectorAll('.dzOpen'), function (b) {

            window.open(p.url(t.title + ' ' + (t.artist ? t.artist.name : '')), '_blank', 'noopener');
          };
        });
        Array.prototype.forEach.call(pickerEl.querySelectorAll('.dzPick'), function (b) {
          b.onclick = function () {
            var t = lastResults[+b.getAttribute('data-i')]; if (!t) return;

            roundTrack = { title: t.title, artist: t.artist ? t.artist.name : '', cover: (t.album && t.album.cover_medium) || '', preview: t.preview, year: null, oeuvre: t._oeuvre || null, oeuLabel: t._oeuLabel || null };
            fillYear(t, roundTrack, renderHost);

          };
        });
        if (qi && !q) qi.focus();
      }
      var initQ = state.theme || '';
      render([], initQ, false);
      if (initQ) { render(null, initQ, true); musicSearch(initQ, function (res) { lastResults = res || []; render(lastResults, initQ, false); }); }
    }

    /* Panneau « Inviter / faire revenir un joueur » — accessible à TOUT MOMENT.

    // Rafraîchit l'écran hôte chaque seconde pendant le vote (compte à rebours vivant).
    // Décompte du vote : on met à jour UNIQUEMENT le chiffre affiché.
    // (Reconstruire tout l'écran chaque seconde était inutilement coûteux.)
    var voteTick = setInterval(function () {
      if (document.hidden) return;
      if (state.phase === 'voting') {
        var secs = (state.config && state.config.voteSecs) || 10;
        var left = state.voteAt ? Math.max(0, Math.ceil((state.voteAt + secs * 1000 - Date.now()) / 1000)) : 0;
        var el = document.getElementById('voteLeft');
        if (left > 0) { if (el && el.textContent !== String(left)) el.textContent = left; return; }

           peut juger, le vote des autres tranche tout seul — l'hôte n'a aucun
           bouton à presser, donc rien à truquer. Ce test doit passer même quand
           le décompte n'est plus affiché : d'où l'absence de sortie anticipée. */
        if (hostIsAnswering() && !otherJudge()) { resolveByVote(); return; }
        if (el) renderHost(); // sinon on débloque une seule fois les boutons du juge
      } else if (state.phase === 'racing' && state.buzzOpenAt) {
        // Turbo : la fenêtre de réponse est celle qui sert au calcul des points.
        var T = (state.turboSecs || 30) * 1000;
        var rl = Math.max(0, Math.ceil((state.buzzOpenAt + T - Date.now()) / 1000));
        var rel = document.getElementById('raceLeft');
        if (rel && rel.textContent !== String(rl)) rel.textContent = rl;
        if (rl === 0) closeRacing(); // temps écoulé → on passe à la correction
      }

        var l = $('#launch'); if (l) l.onclick = function () {

      });

      // Filtres combinables : chaque étiquette s'ajoute ou se retire
      var toggleF = function (arr, v) { var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };

      if ((plActive() || fActive()) && !roundTrack && prepPhase) prefetchAuto();
      if (roundTrack && canPlayInApp() && (!s.dj || s.dj.id === ME)) bindPlayer(roundTrack, renderHost);
      bind('#plyChange', function () { dzPause(); roundTrack = null; if (plActive() || fActive()) prefetchAuto(); renderHost(); });
      bind('#plySearch', function () { dzPause(); openMusicPicker(); });
      bind('#audioToggle', function () {

      bind('#abortRound', function () {

        // roundTrack DOIT être vidé : sans ça le MÊME morceau repartait au lancement
        // suivant — d'où l'impression qu'un titre « revient tout le temps ».
        dzPause();

    renderHost();

  function renderJoin(code) {
    var lastName = store.get('playerName', '');
    app.innerHTML = [
      '<div class="flex-1 flex flex-col items-center justify-center px-6 py-10 max-w-md mx-auto w-full">',
      '  <div class="text-6xl mb-3 animate-float">🎤</div>',

      '  <div class="text-4xl font-extrabold tracking-[0.3em] text-neon-cyan my-3">' + esc(code) + '</div>',
      '  <label class="block text-sm text-white/60 mb-2 mt-6 font-bold uppercase self-start">Ton pseudo</label>',
      '  <input id="pname" maxlength="20" value="' + esc(lastName) + '" placeholder="Ton prénom"',
      '    class="w-full bg-black/40 rounded-xl px-4 py-4 text-lg text-center outline-none focus:ring-2 ring-neon-cyan mb-6" />',
      '  <button id="enter" class="w-full py-5 rounded-2xl text-xl font-extrabold bg-gradient-to-r from-neon-cyan to-neon-lime text-black active:animate-pop">Entrer 🎉</button>',
      '  <button id="back" class="mt-5 text-white/40 text-sm">← Annuler</button>',
      '</div>'
    ].join('');
    $('#back').onclick = function () { location.hash = ''; };
    function enter() {
      var name = $('#pname').value.trim();
      if (!name) { toast('Choisis un pseudo', 'err'); vibrate(80); return; }
      store.set('playerName', name);
      store.set('lastJoin', { code: code, name: name, at: Date.now() }); // permet de revenir en 1 clic
      beep(660, 0.1, 'sine'); // débloque l'audio iOS via interaction
      startPlayer(code, name);
    }
    $('#enter').onclick = enter;
    $('#pname').onkeydown = function (e) { if (e.key === 'Enter') enter(); };
  }

  function startPlayer(code, name) {

      } else if (s.phase === 'armed') {
