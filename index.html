        else center = buzzButton(true, '⏳', 'Prépare-toi…');
      } else if (s.phase === 'buzzing') {
        if (s.mode === 'fredonne' && isSource) center = '<div class="text-center animate-slidein"><div class="text-6xl mb-3 animate-pulse">🎶</div><p class="text-2xl font-extrabold text-neon-lime">FREDONNE !</p><p class="text-white/55 mt-1">Les autres essaient de deviner</p></div>';
        else {
          /* Qui a déjà renoncé : chacun voit s'il reste quelqu'un, ou s'il est le
             dernier à décider — sinon on attend sans savoir quoi. */
          var passesP = (s.tried || []).filter(function (id) { return !(s.contre && s.contre.targetId === id); })
            .map(function (id) { return s.players[id] ? s.players[id].name : null; }).filter(Boolean);
          var infoC = s.contre ? contreInfo(s.contre) : null;
          var bandeauP = (s.contre
              ? '<p class="mt-4 text-rose-300 text-sm font-bold">' + infoC.icon + ' ' + esc(s.contre.by)
                + ' ' + infoC.verbe + ' ' + esc(s.contre.target) + '</p>'
              : '')
            + (passesP.length
              ? '<p class="mt-3 text-neon-gold text-sm font-bold">🤷 ' + esc(passesP.join(', ')) + ' ' + (passesP.length > 1 ? 'passent' : 'passe') + ' ce titre</p>'
              : '');
          var passeBtn = '<button id="pass" class="mt-4 mx-auto block px-5 py-2.5 rounded-xl glass text-white/70 font-bold text-sm">🤷 Je ne sais pas</button>';
          var ciblé = s.contre && s.contre.targetId === ME;
          var effC = ciblé ? (s.contre.eff || (s.contre.ice ? 'ice' : 'block')) : null;
          if (ciblé && effC === 'ice')
            // Gelé : on PEUT encore jouer, une fois l'écran dégagé — on ne l'élimine pas.
            center = (iceVisible()
              ? buzzButton(true, '🧊', 'Écran gelé par ' + s.contre.by + ' — frotte pour te dégager')
              : buzzButton(false, 'BUZZ', 'Dégelé ! Rattrape-les 🔥') + passeBtn)
              + bandeauP;
          else if (ciblé && effC === 'slow') {
            /* Ralenti : le bouton se rouvre tout seul à la fin du décompte — d'où le
               minuteur plus bas. Sans lui, l'écran restait bloqué jusqu'au prochain
               message de l'hôte, et le joueur croyait avoir été éliminé. */
            var reste = Math.ceil(Math.max(0, (s.contre.openAt || 0) - Date.now()) / 1000);
            center = (reste > 0
              ? buzzButton(true, '🐢', 'Ralenti par ' + s.contre.by + ' — ton buzz s\'ouvre dans ' + reste + ' s')
              : buzzButton(false, 'BUZZ', 'C\'est ouvert ! Rattrape-les 🔥') + passeBtn)
              + bandeauP;
          } else if (ciblé && effC === 'second') {
            var libre = (s.tried || []).length > 0;
            center = (libre
              ? buzzButton(false, 'BUZZ', 'À toi maintenant 🔥') + passeBtn
              : buzzButton(true, '🥈', 'Second couteau — tu joues après la première tentative'))
              + bandeauP;
          } else if (ciblé && effC === 'exig')
            center = buzzButton(false, 'BUZZ', '🎯 Corsé : il te faudra le titre ET l\'artiste') + passeBtn + bandeauP;
          else if (ciblé && effC === 'dbl')
            center = buzzButton(false, 'BUZZ', '💸 Quitte ou double : tes points comptent double') + passeBtn + bandeauP;
          else if (ciblé)
            center = buzzButton(true, '🚫', 'Contré par ' + s.contre.by + ' — tu ne joues pas ce titre') + bandeauP;
          else if ((s.tried || []).indexOf(ME) >= 0)
            center = buzzButton(true, '⏳', 'Tu as déjà tenté — au tour des autres') + bandeauP;
          else
            center = buzzButton(false, 'BUZZ', 'Appuie vite !') + bandeauP
              // Sortie quand on ne reconnaît pas le morceau : dès que tout le monde
              // a renoncé, l'app révèle le titre et passe au suivant.
              + '<button id="pass" class="mt-4 mx-auto block px-5 py-2.5 rounded-xl glass text-white/70 font-bold text-sm">🤷 Je ne sais pas</button>';
        }
      } else if (s.phase === 'answering') {
        if (isBuzzer && answered) {
          center = '<div class="text-center animate-slidein"><div class="text-5xl mb-3">📨</div><p class="text-xl font-bold">Réponse envoyée ✓</p><p class="text-white/50 mt-1">En attente de l\'animateur…</p></div>';
        } else if (isBuzzer) {
          center = [
            '<div class="w-full animate-slidein text-center">',
            '  <p class="text-2xl font-extrabold text-neon-lime mb-1">À toi ! 🎉</p>',
            '  <p class="text-white/60 mb-4">' + amUI.consigne + '</p>',
            (amUI.deux
              ? '  <input id="ansTitle" maxlength="80" placeholder="💿 Titre…" class="w-full bg-black/40 rounded-xl px-4 py-3.5 text-lg text-center outline-none focus:ring-2 ring-neon-pink mb-2" />'
                + '<input id="ansArtist" maxlength="80" placeholder="🎤 Artiste…" class="w-full bg-black/40 rounded-xl px-4 py-3.5 text-lg text-center outline-none focus:ring-2 ring-neon-cyan mb-4" />'
              : '  <input id="ans" maxlength="120" placeholder="' + amUI.ph + '" class="w-full bg-black/40 rounded-xl px-4 py-4 text-lg text-center outline-none focus:ring-2 ring-neon-pink mb-4" />'),
            '  <button id="send" class="w-full py-4 rounded-xl text-lg font-extrabold bg-gradient-to-r from-neon-pink to-neon-violet active:animate-pop">Valider ma réponse</button>',
            '  <button id="oral" class="mt-3 text-white/40 text-sm">Je réponds à l\'oral</button>',
            '</div>'
          ].join('');
        } else {
          center = '<div class="text-center animate-slidein"><div class="text-5xl mb-3">🙊</div><p class="text-xl font-bold"><span class="text-neon-pink">' + esc(s.buzzer.name) + '</span> a buzzé !</p><p class="text-white/50 mt-1">Réponse en cours…</p></div>';
        }
      } else if (s.phase === 'voting') {
        if (isBuzzer) {
          center = '<div class="text-center animate-slidein"><div class="text-5xl mb-3">⏳</div><p class="text-xl font-bold">En attente du vote…</p></div>';
        } else if ((s.tried || []).indexOf(ME) >= 0) {
          // Déjà tenté (et raté) sur ce titre : on ne vote pas, donc pas de +2 à
          // récupérer juste après avoir perdu 2 points.
          center = '<div class="text-center animate-slidein"><div class="text-5xl mb-3">🙈</div>'
            + '<p class="text-xl font-bold">Tu as déjà joué ce titre</p>'
            + '<p class="text-white/50 mt-1">Tu ne votes pas sur cette manche — pas de points à reprendre.</p></div>';
        } else {
          center = [
            '<div class="w-full text-center animate-slidein">',
            '  <p class="text-white/60 mb-1">Réponse de ' + esc(s.buzzer.name) + '</p>',
            '  <div class="text-2xl font-extrabold mb-5">' + (s.answer ? '« ' + esc(s.answer) + ' »' : '<span class="text-white/40 text-lg">(à l\'oral)</span>') + '</div>',
            voted
              ? '<p class="text-neon-cyan font-bold">Vote enregistré ✓</p>'
              : '<div class="grid grid-cols-2 gap-4"><button id="up" class="py-8 rounded-2xl bg-neon-lime text-black text-4xl font-extrabold active:animate-pop">👍</button><button id="down" class="py-8 rounded-2xl bg-rose-500 text-4xl font-extrabold active:animate-pop">👎</button></div>'
                + '<p class="text-white/40 text-xs mt-3">Juge bien : +' + s.config.pointsVote + ' si tu as raison, ' + (s.config.pointsVoteWrong || 0) + ' si tu te trompes</p>',
            '</div>'
          ].join('');
        }
      } else if (s.phase === 'judging') {
        if (isSource) {
          center = [
            '<div class="w-full text-center animate-slidein">',
            '  <p class="text-white/60 mb-1">' + esc(s.buzzer.name) + ' répond :</p>',
            '  <div class="text-2xl font-extrabold mb-5">' + (s.answer ? '« ' + esc(s.answer) + ' »' : '<span class="text-white/40 text-lg">(à l\'oral)</span>') + '</div>',
            '  <p class="text-white/55 mb-3">C\'était ça ?</p>',
            '  <div class="grid grid-cols-2 gap-4"><button id="jok" class="py-8 rounded-2xl bg-neon-lime text-black text-3xl font-extrabold active:animate-pop">✓</button><button id="jko" class="py-8 rounded-2xl bg-rose-500 text-3xl font-extrabold active:animate-pop">✗</button></div>',
            '</div>'
          ].join('');
        } else {
          center = '<div class="text-center animate-slidein"><div class="text-5xl mb-3">🤔</div><p class="text-xl font-bold">' + esc(s.buzzer.name) + ' a répondu</p><p class="text-white/50 mt-1">🎶 ' + esc(s.source ? s.source.name : '') + ' valide…</p></div>';
        }
      } else if (s.phase === 'year_guess') {
        if (guessed) {
          center = '<div class="text-center animate-slidein"><div class="text-5xl mb-3">⏳</div><p class="text-xl font-bold">Réponse enregistrée ✓</p><p class="text-white/50 mt-1">En attente des autres…</p></div>';
        } else {
          center = [
            '<div class="w-full text-center animate-slidein">',
            '  <div class="text-5xl mb-2">📅</div>',
            '  <p class="text-xl font-extrabold mb-1">En quelle année ?</p>',
            '  <p class="text-white/55 mb-4">Devine l\'année de sortie du morceau</p>',
            '  <input id="yr" type="number" inputmode="numeric" placeholder="1987" class="w-full bg-black/40 rounded-xl px-4 py-4 text-2xl text-center font-bold outline-none focus:ring-2 ring-neon-cyan mb-4" />',
            '  <button id="yrSend" class="w-full py-4 rounded-xl text-lg font-extrabold bg-gradient-to-r from-neon-pink to-neon-violet active:animate-pop">Valider</button>',
            '</div>'
          ].join('');
        }
      } else if (s.phase === 'year_reveal') {
        var myG = s.guesses ? s.guesses[ME] : null;
        var iWon = s.result && (s.result.winners || []).indexOf(ME) >= 0;
        center = '<div class="text-center animate-slidein"><p class="text-white/55 uppercase text-sm">L\'année était</p><div class="text-6xl font-extrabold text-neon-gold my-2 text-glow">' + (s.year || '?') + '</div>' + (myG != null ? '<p class="text-white/70">Ton choix : <span class="font-bold">' + myG + '</span></p>' : '<p class="text-white/40">Tu n\'as pas répondu</p>') + (iWon ? '<p class="text-neon-lime font-extrabold text-xl mt-2">🏆 Gagné ! +' + s.config.pointsBuzz + '</p>' : '') + revealCard(s.reveal) + '</div>';
      } else if (s.phase === 'reveal') {
        var goodForMe = isBuzzer && s.result.correct;
        /* Dingo : celui qui a bien répondu peut quand même perdre des points. On
           l'écrit noir sur blanc à la révélation, sinon le score change sans que
           personne comprenne pourquoi — et une règle incomprise passe pour un bug. */
        var dingoTxt = (s.result.dingo && s.result.gain != null)
          ? '<p class="text-rose-300 font-bold mt-1">' + s.result.dingo + ' handicap dingo · '
            + (s.result.gain > 0 ? '+' : '') + s.result.gain + ' pt' + (Math.abs(s.result.gain) > 1 ? 's' : '') + '</p>' : '';
        center = '<div class="text-center animate-slidein"><div class="text-6xl mb-2">' + (s.result.lost ? '📻' : s.result.none ? '🤷' : s.result.correct ? '✅' : '❌') + '</div><p class="text-2xl font-extrabold ' + (s.result.none ? 'text-white/70' : s.result.correct ? 'text-neon-lime' : 'text-rose-400') + '">' + (s.result.lost ? 'Manche annulée' : s.result.none ? 'Personne ne trouve' : s.result.correct ? 'Bonne réponse !' : 'Raté !') + '</p><p class="text-white/60 mt-1">' + (s.result.lost ? 'Morceau introuvable — personne ne marque, on enchaîne' : s.result.none ? 'On passe au titre suivant' : goodForMe ? 'Bien joué 🔥' : esc(s.buzzer ? s.buzzer.name : '')) + '</p>' + reponseDite(s) + dingoTxt + revealCard(s.reveal) + bonusBanner(s) + '</div>';
      } else if (s.phase === 'ended') {
        center = [
          '<div class="w-full text-center animate-slidein">',
          '  <div class="text-6xl mb-1">🏆</div>',
          '  <p class="bt-title text-2xl font-extrabold glow-cyan">PARTIE TERMINÉE</p>',
          '  <p class="text-white/60 mt-1">Tu finis ' + (rank ? rank + (rank === 1 ? 'er' : 'e') : '') + ' avec <span class="text-neon-gold font-extrabold">' + myScore + ' pts</span></p>',
               renderPodium(lb),
          '</div>'
        ].join('');
      }

      app.innerHTML = [
        '<div class="flex-1 flex flex-col px-5 py-5 max-w-md mx-auto w-full">',
        '  <div class="flex items-center justify-between mb-2">',
        '    <div class="flex items-center gap-2 text-sm"><button id="gear" class="w-8 h-8 rounded-full glass flex items-center justify-center" aria-label="Réglages">⚙️</button><span class="text-white/40">Manche</span> <span class="font-extrabold text-neon-cyan">' + (s.round || '–') + '</span></div>',
        /* Le nom qui fait foi est celui de la partie, pas celui gardé sur le
           téléphone : si l'hôte t'a renommé, tu dois voir TON nouveau nom. */
        '    <div class="text-sm font-bold">' + esc(mine && mine.name ? mine.name : name) + ' · <span class="text-neon-gold">' + myScore + ' pts</span>' + (rank ? ' · #' + rank : '') + '</div>',
        '  </div>',
        (mine && typeof mine.team === 'number' ? '  <div class="text-center mt-1"><span class="inline-block px-3 py-1 rounded-full text-sm font-bold" style="background:' + (TEAM_COLORS[mine.team] || '#888') + '33;color:' + (TEAM_COLORS[mine.team] || '#fff') + '">👥 Équipe ' + (TEAM_NAMES[mine.team] || '') + '</span></div>' : ''),
        (s.blindRound && !s.tac && s.phase !== 'ended'
          ? '  <div class="text-center mt-2 mb-1 animate-slidein"><span class="inline-block px-4 py-1.5 rounded-2xl bg-neon-pink/25 ring-1 ring-neon-pink font-extrabold">🕶️ Finale à l\'aveugle — personne ne connaît la réponse</span></div>'
          : ''),
        (s.tac && s.phase !== 'ended'
          ? '  <div class="text-center mt-2 mb-1 animate-slidein"><span class="inline-block px-4 py-1.5 rounded-2xl bg-rose-500/25 ring-1 ring-rose-400 font-extrabold">⚡ TAC O TAC ' + Math.max(1, (s.tacTotal || 0) - (s.tacLeft || 0)) + '/' + (s.tacTotal || 0) + ' — points ×2, tout le monde à égalité</span></div>'
          : ''),
        // Le barème Dingo de CE joueur, annoncé avant qu'il décide de buzzer.
        dingoBadge(s, ME),
        (s.wheel && s.challenge && s.phase !== 'ended'
          ? '  <div class="text-center mt-2 mb-1 animate-slidein"><div class="inline-block px-4 py-1.5 rounded-2xl bg-neon-pink/20 ring-1 ring-neon-pink">'
            + '<span class="font-extrabold">' + s.challenge.icon + ' ' + esc(s.challenge.name) + '</span>'
            + ((s.mult || 1) > 1 ? '<span class="text-neon-gold font-bold text-sm"> ×' + s.mult + '</span>' : '')
            + '<div class="text-white/55 text-xs">' + esc(s.challenge.desc) + '</div></div></div>'
          : ''),
        (s.phase !== 'ended' && s.mode !== 'year' ? '  <div class="text-center mt-1 flex flex-wrap justify-center gap-2">'
          + (s.theme ? '<span class="inline-block px-3 py-1 rounded-full bg-neon-pink/20 ring-1 ring-neon-pink text-sm font-bold">🎯 ' + esc(s.theme) + '</span>' : '')
          + '<span class="inline-block px-3 py-1 rounded-full ' + (am === 'oeuvre' ? 'bg-neon-gold/25 ring-1 ring-neon-gold' : 'bg-white/10') + ' text-sm font-bold">' + amUI.badge + '</span></div>' : ''),
        '  <div class="flex-1 flex flex-col items-center justify-center py-6">' + center + '</div>',
        // Jokers : utilisables une fois chacun, avant de connaître le résultat.
        (function () {
          if (!s.jokers || imDJ || !mine) return '';
          var playing = ['armed', 'buzzing', 'answering', 'voting', 'racing', 'year_guess', 'judging'].indexOf(s.phase) >= 0;
          if (!playing) return '';
          var used = (s.jok || {})[ME];
          if (used) return '  <div class="text-center mb-2 text-sm font-bold ' + (used === 'x2' ? 'text-neon-gold' : 'text-neon-cyan') + '">' + (used === 'x2' ? '🃏 Joker ×2 activé !' : '🛡️ Bouclier activé') + '</div>';
          /* 🚫 Contre : offensif, donc des conditions strictes et LISIBLES —
             seulement avant qu'on buzze, seulement si un meneur existe et que ce
             n'est pas moi, et un seul contre par manche pour toute la table. */
          var meneurP = (function () {
            var arr = Object.keys(s.players).map(function (k) { return s.players[k]; });
            if (arr.length < 2) return null;
            arr.sort(function (a, b) { return b.score - a.score; });
            return (arr[0].score === arr[1].score) ? null : arr[0];
          })();
          var contreOk = !s.contre && !s.buzzer && (s.phase === 'armed' || s.phase === 'buzzing')
                         && meneurP && meneurP.id !== ME && (s.tried || []).indexOf(meneurP.id) < 0
                         && (mine.jct || 0) > 0;
          return '  <div class="grid grid-cols-2 gap-2 mb-2">'
            + '<button id="jokX2" class="py-2.5 rounded-xl text-sm font-bold ' + (mine.jx2 > 0 ? 'bg-neon-gold text-black' : 'bg-white/10 text-white/30 pointer-events-none') + '">🃏 ×2 <span class="text-xs">(' + (mine.jx2 || 0) + ')</span></button>'
            + '<button id="jokSh" class="py-2.5 rounded-xl text-sm font-bold ' + (mine.jsh > 0 ? 'bg-neon-cyan text-black' : 'bg-white/10 text-white/30 pointer-events-none') + '">🛡️ Bouclier <span class="text-xs">(' + (mine.jsh || 0) + ')</span></button>'
            + '</div>'
            + (contreOk
                ? '  <button id="jokContre" class="w-full py-2.5 rounded-xl text-sm font-extrabold bg-rose-500 text-white mb-2">🚫 Contrer ' + esc(meneurP.name) + ' <span class="text-xs opacity-80">(' + mine.jct + ')</span></button>'
                : ((mine.jct || 0) > 0 && !s.contre
                    ? '  <p class="text-white/30 text-xs text-center mb-2">🚫 Contre (' + mine.jct + ') — utilisable avant le premier buzz, contre le meneur</p>'
                    : ''));
        })(),
        '  <div class="glass rounded-2xl p-4">' + renderLeaderboard(lb, s._present || {}, ME, fairArgP) + (fairArgP ? '<p class="text-white/45 text-xs mt-2 text-center">⚖️ Scores ajustés : chacun n\'a pas été DJ le même nombre de fois</p>' : '') + '</div>',
        '  <button id="leave" class="mt-3 text-white/40 text-sm">Quitter</button>',
        '</div>'
      ].join('');

      // Liaisons d'événements
      bind('#leave', function () { location.hash = ''; });
      bind('#gear', openSettings);
      bind('#jokX2', function () { chan.sendIntent({ action: 'joker', id: ME, kind: 'x2' }); beep(920, 0.1, 'sine'); vibrate(50); toast('Joker ×2 activé 🃏', 'ok'); });
      bind('#jokSh', function () { chan.sendIntent({ action: 'joker', id: ME, kind: 'sh' }); beep(700, 0.1, 'sine'); vibrate(50); toast('Bouclier activé 🛡️', 'ok'); });
      bind('#jokContre', function () { chan.sendIntent({ action: 'contre', id: ME }); beep(160, 0.2, 'sawtooth'); vibrate(60); });
      /* 🐢 Ralenti : rien ne viendra du serveur à la fin du décompte — c'est un délai,
         pas un évènement. Sans ce minuteur, l'écran restait bloqué et le joueur se
         croyait éliminé alors que son buzz s'était rouvert. */
      if (_slowT) { clearTimeout(_slowT); _slowT = null; }
      if (s.phase === 'buzzing' && s.contre && s.contre.eff === 'slow'
          && s.contre.targetId === ME && Date.now() < (s.contre.openAt || 0)) {
        _slowT = setTimeout(function () { _slowT = null; renderPlayer(); },
                            Math.max(250, s.contre.openAt - Date.now()) + 60);
      }
      // Contrôles du DJ de la série (depuis son propre téléphone)
      // Le DJ choisit son morceau depuis son téléphone (reste caché jusqu'au verdict)
      bind('#djPickTrack', function () {
        openTrackPicker(function (t) {
          myTrack = { title: t.title, artist: t.artist ? t.artist.name : '', cover: (t.album && t.album.cover_medium) || '', preview: t.preview, year: null, oeuvre: t._oeuvre || null, oeuLabel: t._oeuLabel || null };
          fillYear(t, myTrack, renderPlayer);
          toast('Morceau prêt 🔒', 'ok'); renderPlayer();
        }, lastState && lastState.theme ? lastState.theme : '');
      });
      if (myTrack && (lastState.audioMode || 'device') === 'device') bindPlayer(myTrack, renderPlayer);
      // Depuis le lecteur du DJ : chercher un autre titre / repiocher au hasard
      bind('#plySearch', function () {
        dzPause();
        openTrackPicker(function (t) {
          myTrack = { title: t.title, artist: t.artist ? t.artist.name : '', cover: (t.album && t.album.cover_medium) || '', preview: t.preview, year: null, oeuvre: t._oeuvre || null, oeuLabel: t._oeuLabel || null };
          fillYear(t, myTrack, renderPlayer);
          toast('Morceau prêt 🎵', 'ok'); renderPlayer();
        }, '');
      });
      bind('#plyChange', function () { dzPause(); myTrack = null; renderPlayer(); });

      // Au verdict, on joint la fiche du morceau : elle n'a circulé qu'à cet instant.
      var myReveal = function () { return myTrack ? { title: myTrack.title, artist: myTrack.artist, cover: myTrack.cover, year: myTrack.year } : null; };
      bind('#djNext', function () { dzPause(); chan.sendIntent({ action: 'nextRound', id: ME, reveal: myReveal() }); myTrack = null; });
      bind('#djEnd', function () {
        // Même garde d'équité que le bouton « Terminer » de l'hôte : le DJ doit voir
        // qui n'a pas encore eu son tour avant de clore.
        var fi = fairInfo(s.players || {}), msg = 'Terminer la partie maintenant et afficher le classement ?';
        if (!fi.balanced && fi.any) {
          var short = Object.keys(s.players).map(function (k) { return s.players[k]; })
            .filter(function (q) { return (q.played || 0) < fi.maxPlayed; })
            .map(function (q) { return q.name + ' (' + (q.played || 0) + '/' + fi.maxPlayed + ')'; }).join(', ');
          msg = '⚠️ Cycle DJ incomplet — ' + short + ' ont eu moins de titres jouables.\n\n'
              + 'Le classement final sera AJUSTÉ pour rester équitable.\n\n' + msg;
        }
        if (!confirm(msg)) return;
        dzPause(); chan.sendIntent({ action: 'endGame', id: ME });
      });
      bind('#djForce', function () { chan.sendIntent({ action: 'forceJudge', id: ME }); });
      bind('#djCloseRace', function () { dzPause(); chan.sendIntent({ action: 'closeRace', id: ME }); });
      bind('#djApply', function () { chan.sendIntent({ action: 'applyTurbo', id: ME, reveal: myReveal() }); myTrack = null; });
      bind('#djOk', function () { dzPause(); chan.sendIntent({ action: 'judge', id: ME, correct: true, reveal: myReveal() }); myTrack = null; });
      bind('#djKo', function () { dzPause(); chan.sendIntent({ action: 'judge', id: ME, correct: false, reveal: myReveal() }); myTrack = null; });
      bind('#djHalf', function () { dzPause(); chan.sendIntent({ action: 'judge', id: ME, correct: true, partial: true, reveal: myReveal() }); myTrack = null; });
      Array.prototype.forEach.call(document.querySelectorAll('.djGrade'), function (b) {
        b.onclick = function () { chan.sendIntent({ action: 'grade', id: ME, target: b.getAttribute('data-id'), g: b.getAttribute('data-g') }); beep(660, 0.05, 'sine'); };
      });

      bind('#pass', function () {
        chan.sendIntent({ action: 'pass', id: ME, name: name });
        beep(300, 0.08, 'sine'); toast('Tu passes ce titre', 'info');
      });

      // Mode Turbo : envoi de la réponse par tout le monde
      var rT = $('#raceTitle'), rA = $('#raceArtist'), rO = $('#raceOne');
      if (rT || rO) {
        (rT || rO).focus();
        var raceCollect = function () {
          if (rT || rA) { var ti = (rT && rT.value.trim()) || '', ar = (rA && rA.value.trim()) || ''; return (ti && ar) ? (ti + ' — ' + ar) : (ti || ar); }
          return rO ? rO.value.trim() : '';
        };
        var raceSend = function () {
          var v = raceCollect();
          if (!v) { toast('Écris ta réponse', 'err'); vibrate(60); return; }
          raceMine = v;
          chan.sendIntent({ action: 'race', id: ME, name: name, text: v });
          beep(880, 0.08, 'sine'); vibrate(40);
          toast('Réponse envoyée ✓', 'ok');
        };
        bind('#raceSend', raceSend);
        bind('#racePass', function () { raceMine = ''; chan.sendIntent({ action: 'race', id: ME, name: name, text: '' }); beep(300, 0.08, 'sine'); toast('Tu passes ce titre', 'info'); });
        [rT, rA, rO].forEach(function (el) { if (el) el.onkeydown = function (e) { if (e.key === 'Enter') raceSend(); }; });
      }

      var ans = $('#ans'), ansT = $('#ansTitle'), ansA = $('#ansArtist');
      if (ans || ansT) {
        (ansT || ans).focus();
        var sendAnswer = function (txt) { answered = true; chan.sendIntent({ action: 'answer', id: ME, text: txt }); beep(520, 0.1, 'sine'); renderPlayer(); };
        var collect = function () {
          if (ansT || ansA) {
            var ti = (ansT && ansT.value.trim()) || '', ar = (ansA && ansA.value.trim()) || '';
            return (ti && ar) ? (ti + ' — ' + ar) : (ti || ar);
          }
          return ans ? ans.value.trim() : '';
        };
        bind('#send', function () { sendAnswer(collect()); });
        [ans, ansT, ansA].forEach(function (el) { if (el) el.onkeydown = function (e) { if (e.key === 'Enter') sendAnswer(collect()); }; });
        bind('#oral', function () { sendAnswer(''); });
      }
      bind('#up', function () { voted = true; chan.sendIntent({ action: 'vote', id: ME, value: 1 }); beep(880, 0.08, 'sine'); renderPlayer(); });
      bind('#down', function () { voted = true; chan.sendIntent({ action: 'vote', id: ME, value: -1 }); beep(300, 0.08, 'sine'); renderPlayer(); });

      // Fredonne : le fredonneur tranche
      bind('#jok', function () { chan.sendIntent({ action: 'judge', id: ME, correct: true }); beep(880, 0.1, 'sine'); });
      bind('#jko', function () { chan.sendIntent({ action: 'judge', id: ME, correct: false }); beep(200, 0.1, 'sawtooth'); });

      // Devine l'année : soumission
      var yr = $('#yr');
      if (yr) {
        yr.focus();
        var sendGuess = function () { var v = parseInt(yr.value, 10); if (isNaN(v)) { toast('Entre une année', 'err'); return; } guessed = true; chan.sendIntent({ action: 'guess', id: ME, name: name, year: v }); beep(660, 0.08, 'sine'); renderPlayer(); };
        bind('#yrSend', sendGuess);
        yr.onkeydown = function (e) { if (e.key === 'Enter') sendGuess(); };
      }

      // Le bouton BUZZ
      var bz = $('#buzz');
      if (bz) {
        bz.onclick = function () {
          if (s.phase !== 'buzzing' || s.buzzer) return;
          chan.sendIntent({ action: 'buzz', id: ME, name: name });
          beep(180, 0.25, 'square'); vibrate([0, 90, 40, 90]);
          bz.classList.add('animate-pop');
        };
      }

      // Restauration de la saisie en cours (voir le filet en haut de la fonction).
      Object.keys(_saved).forEach(function (id) {
        var el = document.getElementById(id);
        if (el && !el.value && _saved[id]) el.value = _saved[id];
      });
      if (_focusId) {
        var f = document.getElementById(_focusId);
        if (f) { try { f.focus(); if (_caret != null) f.setSelectionRange(_caret, _caret); } catch (e) {} }
      }
    }

    renderPlayer();
  }

  /* Gros bouton BUZZ (réutilisé). disabled = verrouillé. */
  function buzzButton(disabled, label, sub, id) {
    return [
      '<div class="flex flex-col items-center w-full">',
      '  <button id="' + (id || 'buzz') + '" ' + (disabled ? 'disabled' : '') + ' class="bt-title select-none w-60 h-60 sm:w-64 sm:h-64 rounded-full text-4xl font-extrabold flex items-center justify-center border-4 ' +
      (disabled
        ? 'border-white/10 bg-white/5 text-white/40 cursor-not-allowed'
        : 'border-neon-cyan text-white bg-gradient-to-br from-neon-pink to-rose-600 shadow-[0_0_70px_rgba(255,46,154,.7),inset_0_0_44px_rgba(34,211,238,.35)] animate-ring active:animate-pop') + '">' + esc(label) + '</button>',
      '  <p class="mt-6 text-white/60 text-lg">' + esc(sub) + '</p>',
      '</div>'
    ].join('');
  }

  /* --------------------------------------------------------------------------
     7. Leaderboard (partagé hôte/joueur)
     -------------------------------------------------------------------------- */
  var TEAM_COLORS = ['#ff4d6d', '#3aa0ff', '#a3e635', '#fbbf24'];
  var TEAM_NAMES = ['Rouge', 'Bleu', 'Vert', 'Jaune'];
  /* ------------------------------------------------------------------
     ÉQUITÉ DU CLASSEMENT
     Un joueur qui a été DJ plus souvent qu'un autre a eu MOINS d'occasions
     de marquer. On ramène donc tout le monde au même nombre d'occasions :
        score équitable = score × (occasions max) / (ses occasions)
     Si tout le monde a joué le même nombre de titres, rien ne change.
     ------------------------------------------------------------------ */
  /* Bandeau des bonus regagnés — même rendu chez l'hôte et chez les joueurs,
     pour que tout le monde voie d'où vient le joker qui arrive. */
  function bonusBanner(s) {
    var m = s && s.bonusMsg;
    if (!m || !m.length) return '';
    return '<div class="glass rounded-2xl p-3 mt-3 text-center" style="border-color:rgba(251,191,36,.55)">'
      + '<p class="text-xs font-bold uppercase text-neon-gold mb-1">🎁 Bonus regagnés</p>'
      + m.map(function (x) { return '<p class="text-sm font-bold text-white/80">' + esc(x) + '</p>'; }).join('')
      + '</div>';
  }
  function fairInfo(players) {
    var arr = Object.keys(players || {}).map(function (k) { return players[k]; });
    var maxPlayed = 0, balanced = true, firstPlayed = null;
    arr.forEach(function (p) {
      var pl = p.played || 0;
      if (pl > maxPlayed) maxPlayed = pl;
      if (firstPlayed === null) firstPlayed = pl; else if (pl !== firstPlayed) balanced = false;
    });
    return { maxPlayed: maxPlayed, balanced: balanced, any: arr.some(function (p) { return (p.djTurns || 0) > 0; }) };
  }
  function fairScore(p, info) {
    if (!info || info.balanced || !p.played) return p.score;
    return Math.round(p.score * (info.maxPlayed / p.played));
  }
  /* ---------------------------------------------------------------
     ROUE DES DÉFIS — à chaque manche, un défi est tiré au sort.
     Un défi = un mode de jeu et/ou un modificateur (points, réponse
     attendue). Le tirage évite de répéter le défi précédent.
     --------------------------------------------------------------- */
  var CHALLENGES = [
    { id: 'classic',  icon: '🔊', name: 'Classique',      desc: 'Le premier qui buzze répond',        mode: 'classic' },
    { id: 'turbo',    icon: '⚡', name: 'Turbo',           desc: 'Tout le monde répond, vitesse = points', mode: 'turbo' },
    { id: 'year',     icon: '📅', name: 'Devine l\'année', desc: 'Le plus proche de l\'année gagne',   mode: 'year' },
    { id: 'title',    icon: '💿', name: 'Titre seul',      desc: 'Seul le titre compte',               mode: 'classic', ans: 'title' },
    { id: 'artist',   icon: '🎤', name: 'Artiste seul',    desc: 'Seul l\'artiste compte',             mode: 'classic', ans: 'artist' },
    { id: 'both',     icon: '🎵', name: 'Titre + Artiste', desc: 'Les deux sont exigés !',             mode: 'classic', ans: 'both' },
    { id: 'double',   icon: '💰', name: 'Double points',   desc: 'Tous les points comptent double',    mode: 'classic', mult: 2 },
    { id: 'sudden',   icon: '☠️', name: 'Mort subite',     desc: 'Points doublés… malus aussi !',      mode: 'classic', mult: 2, risky: true },
    { id: 'turbo2',   icon: '🚀', name: 'Turbo doublé',    desc: 'Turbo avec points ×2',               mode: 'turbo',   mult: 2 }
  ];
  function pickChallenge(prevId) {
    var pool = CHALLENGES.filter(function (c) {
      return c.id !== prevId;                         // pas deux fois le même d'affilée
    });
    if (!pool.length) pool = CHALLENGES;
    return pool[(Math.random() * pool.length) | 0];
  }

  /* Objectif de fin de partie atteint ? On le SIGNALE sans couper brutalement :
     l'hôte garde la main (et l'avertissement d'équité du cycle DJ s'applique). */
  /* Longueur d'un tournoi : chaque joueur passe DJ pour N titres, puis on ajoute
     les manches à l'aveugle. Ex. 3 joueurs × 5 titres = 15, + 5 = 20 manches. */
  function tournoiPlan(s) {
    if (!s || !s.djRotate) return null;
    var nbJ = Object.keys(s.players || {}).length;
    // Série tirée au sort : on ne peut annoncer qu'une fourchette (1 à 5 titres par DJ).
    var alea = s.djEvery === -1;
    var parDj = alea ? 3 : (s.djEvery || 5);
    var fin = (s.finalN != null ? s.finalN : 0);
    return { joueurs: nbJ, parDj: parDj, alea: alea, dj: nbJ * parDj, aveugle: fin,
             total: nbJ * parDj + fin, mini: nbJ * 1 + fin, maxi: nbJ * 5 + fin };
  }
  function tournoiTexte(p) {
    if (!p || !p.joueurs) return '';
    if (p.alea) {
      return p.joueurs + ' joueur' + (p.joueurs > 1 ? 's' : '') + ' × 🎲 1 à 5 titres'
        + (p.aveugle ? ' + ' + p.aveugle + ' à l\'aveugle' : '')
        + ' = <b>' + p.mini + ' à ' + p.maxi + ' manches</b>';
    }
    return p.joueurs + ' joueur' + (p.joueurs > 1 ? 's' : '') + ' × ' + p.parDj + ' titres = ' + p.dj
      + (p.aveugle ? ' + ' + p.aveugle + ' à l\'aveugle' : '') + ' = <b>' + p.total + ' manches</b>';
  }

  /* ---------------------------------------------------------------
     🤪 MODE DINGO — l'avance se paie.
     Le coefficient dépend de l'écart à la MOYENNE, mesuré en « titres »
     (1 titre = la valeur d'une bonne réponse). Il est ANNONCÉ sur l'écran
     de chacun AVANT le buzz : c'est le cœur du mode, pas un piège. Le
     meneur voit qu'une bonne réponse va lui coûter et peut choisir de se
     taire — c'est là que le jeu devient intéressant. Un malus découvert
     après coup serait vécu comme un bug, pas comme une règle.
     --------------------------------------------------------------- */
  var DINGO_PALIERS = [
    { min:   3, k:  -1, m: 1,  icon: '🤪', lbl: 'Trop d\'avance : une bonne réponse te COÛTE des points' },
    { min:   2, k:   0, m: 1,  icon: '🧊', lbl: 'Tu mènes trop : plus rien à gagner sur ce titre' },
    { min:   1, k:  .5, m: 1,  icon: '🪫', lbl: 'En tête : demi-points' },
    { min:  -1, k:   1, m: 1,  icon: '🎵', lbl: 'Dans la moyenne : points normaux' },
    { min:  -2, k: 1.5, m: .5, icon: '🔥', lbl: 'Distancé : points ×1,5 et malus réduit de moitié' },
    { min: -99, k:   2, m: 0,  icon: '🚀', lbl: 'Largué : points ×2 et une erreur ne coûte RIEN' }
  ];
  function dingoNiveau(s, id) {
    if (!s || !s.dingo || s.tac) return null;   // pas de handicap pendant le tac o tac
    if (!s.players || !s.players[id]) return null;
    var arr = Object.keys(s.players).map(function (k) { return s.players[k]; });
    if (arr.length < 2) return null;            // seul, l'écart n'a aucun sens
    var tot = 0; arr.forEach(function (p) { tot += p.score; });
    // Le barème Turbo est sur 100, pas sur 5 : l'unité d'écart suit le mode.
    var unite = (s.mode === 'turbo') ? 80 : (Math.abs((s.config && s.config.pointsBuzz) || 5) || 5);
    var avance = (s.players[id].score - tot / arr.length) / unite;
    for (var i = 0; i < DINGO_PALIERS.length; i++) {
      var p = DINGO_PALIERS[i];
      if (avance >= p.min) return { k: p.k, m: p.m, icon: p.icon, lbl: p.lbl, unite: unite, avance: avance };
    }
    return null;
  }
  /* Bandeau affiché à chacun : « voilà ce que ce titre te rapporte, à toi ». */
  function dingoBadge(s, id) {
    var n = dingoNiveau(s, id);
    if (!n || s.phase === 'ended' || s.phase === 'lobby') return '';
    var col = n.k <= 0 ? 'rgba(244,63,94,.6)' : (n.k > 1 ? 'rgba(163,230,53,.6)' : 'rgba(255,255,255,.28)');
    return '  <div class="text-center mt-2 mb-1 animate-slidein"><div class="inline-block px-4 py-1.5 rounded-2xl" style="background:rgba(0,0,0,.35);border:1px solid ' + col + '">'
      + '<span class="font-extrabold">🤪 DINGO ' + n.icon + '</span>'
      + '<div class="text-white/65 text-xs">' + n.lbl + '</div></div></div>';
  }

  /* LA RÉPONSE TELLE QU'ELLE A ÉTÉ TAPÉE, à la révélation.
     Quand l'app corrige toute seule (partie à l'aveugle), on passait directement du
     buzz au verdict : personne ne voyait jamais ce que l'autre avait écrit. Or à deux,
     lire la bêtise de l'adversaire fait la moitié du plaisir. On la montre à tout le
     monde, bonne ou mauvaise. */
  function reponseDite(s) {
    if (!s || !s.answer || !s.result || s.result.none) return '';
    return '<div class="glass rounded-2xl px-4 py-3 mt-4 mb-1">'
      + '<div class="text-white/45 text-xs uppercase font-bold">' + esc(s.buzzer ? s.buzzer.name : '') + ' a répondu</div>'
      + '<div class="text-xl font-extrabold ' + (s.result.correct ? 'text-neon-lime' : 'text-rose-300') + '">« ' + esc(s.answer) + ' »</div></div>';
  }

  function goalReached(s) {
    // Tournoi : le tour complet de DJ + ses manches à l'aveugle valent fin de partie.
    if (s && s._finTour) return { label: 'Tour complet joué par tous les DJ', done: true };
    if (!s || !s.goal || s.goal === 'none' || !s.goalVal) return null;
    if (s.goal === 'rounds') {
      return s.round >= s.goalVal ? { label: s.goalVal + ' manches jouées', done: true } : null;
    }
    if (s.goal === 'score') {
      var best = null;
      Object.keys(s.players || {}).forEach(function (k) {
        var p = s.players[k]; if (!best || p.score > best.score) best = p;
      });
      if (best && best.score >= s.goalVal) return { label: best.name + ' a atteint ' + s.goalVal + ' pts', done: true };
    }
    return null;
  }
  function leaderboardFair(players, info) {
    return Object.keys(players || {}).map(function (k) { return players[k]; })
      .sort(function (a, b) { return fairScore(b, info) - fairScore(a, info) || a.name.localeCompare(b.name); });
  }
  function leaderboardArr(players) {
    return Object.keys(players || {}).map(function (k) { return players[k]; })
      .sort(function (a, b) { return b.score - a.score || a.name.localeCompare(b.name); });
  }
  function teamTotals(s) {
    if (!s.teams) return [];
    var arr = [];
    for (var i = 0; i < s.teams; i++) arr.push({ idx: i, name: TEAM_NAMES[i], c: TEAM_COLORS[i], score: 0, count: 0 });
    Object.keys(s.players || {}).forEach(function (id) {
      var p = s.players[id];
      if (typeof p.team === 'number' && p.team < s.teams) { arr[p.team].score += p.score; arr[p.team].count++; }
    });
    arr.sort(function (a, b) { return b.score - a.score; });
    return arr;
  }
  function renderTeams(s) {
    var t = teamTotals(s); if (!t.length) return '';
    var max = Math.max(1, t[0].score);
    return '<div class="mb-3 space-y-2">' + t.map(function (team) {
      var pct = team.score > 0 ? Math.max(8, Math.round(team.score / max * 100)) : 0;
      return '<div class="flex items-center gap-3 rounded-xl px-3 py-2 bg-black/25">'
        + '<div class="w-3 h-3 rounded-full shrink-0" style="background:' + team.c + '"></div>'
        + '<div class="flex-1 min-w-0"><div class="font-extrabold text-sm">Équipe ' + team.name + ' <span class="text-white/40 font-normal">· ' + team.count + '</span></div>'
        + '<div class="h-1.5 mt-1 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full" style="width:' + pct + '%;background:' + team.c + '"></div></div></div>'
        + '<div class="font-extrabold tabular-nums text-lg" style="color:' + team.c + '">' + team.score + '</div>'
        + '</div>';
    }).join('') + '</div>';
  }
  function avatarGrad(name) {
    var h = 0, s = String(name || '?');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    var a = h % 360, b = (a + 55) % 360;
    return 'linear-gradient(135deg,hsl(' + a + ',85%,60%),hsl(' + b + ',85%,48%))';
  }
  function renderLeaderboard(lb, present, highlightId, fair) {
    if (!lb.length) return '<p class="text-white/40 text-center py-3">Aucun joueur pour l\'instant…</p>';
    var medals = ['🥇', '🥈', '🥉'];
    var val = function (p) { return fair ? fairScore(p, fair) : p.score; };
    var max = Math.max(1, lb[0] ? val(lb[0]) : 1);
    return '<div class="space-y-2">' + lb.map(function (p, i) {
      var on = present && present[p.id];
      var hi = highlightId && p.id === highlightId;
      var sc = val(p);
      var pct = sc > 0 ? Math.max(8, Math.round((sc / max) * 100)) : 0;
      return [
        '<div class="lbRow flex items-center gap-3 rounded-xl px-3 py-2 ' + (hi ? 'bg-neon-violet/25 ring-1 ring-neon-violet' : 'bg-black/25') + '" data-pid="' + esc(p.id) + '">',
        '  <div class="w-6 text-center text-lg font-extrabold ' + (i < 3 ? '' : 'text-white/40') + '">' + (medals[i] || (i + 1)) + '</div>',
        '  <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 ' + (on ? '' : 'opacity-40') + '" style="background:' + avatarGrad(p.name) + '">' + esc(initials(p.name)) + '</div>',
        (typeof p.team === 'number' ? '  <span class="w-2.5 h-2.5 rounded-full shrink-0 -ml-1.5" title="Équipe ' + (TEAM_NAMES[p.team] || '') + '" style="background:' + (TEAM_COLORS[p.team] || '#888') + '"></span>' : ''),
        '  <div class="flex-1 min-w-0">',
        '    <div class="font-bold truncate text-sm ' + (on ? '' : 'text-white/40') + '">' + esc(p.name) + (on ? '' : ' <span class="text-xs">·zzz</span>') + (fair && sc !== p.score ? ' <span class="text-xs text-neon-cyan" title="ajusté : ' + (p.djTurns || 0) + ' titre(s) en tant que DJ">⚖️</span>' : '')
          + ((p.streak || 0) >= 2 ? ' <span class="text-xs font-extrabold text-neon-gold" title="' + p.streak + ' bonnes réponses d\'affilée">🔥×' + p.streak + '</span>' : '') + '</div>',
        '    <div class="h-1.5 mt-1 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full transition-all duration-700" style="width:' + pct + '%;background:linear-gradient(90deg,#22d3ee,#ff2e9a)"></div></div>',
        '  </div>',
        '  <div class="text-right"><div class="font-extrabold text-neon-gold tabular-nums text-lg">' + sc + '</div>' + (fair && sc !== p.score ? '<div class="text-white/35 text-[10px] leading-none">brut ' + p.score + '</div>' : '') + '</div>',
        '</div>'
      ].join('');
    }).join('') + '</div>';
  }

  /* Carte « morceau révélé » (pochette + titre + artiste + année). */
  function revealCard(r) {
    if (!r) return '';
    /* Manche à œuvre : c'était LA question, elle doit donc être la réponse la plus
       visible — un écran de verdict rappelle ce sur quoi il portait (leçon n°24). */
    var oeu = r.oeuvre ? '<div class="mt-3 text-center"><span class="inline-block px-4 py-1.5 rounded-2xl bg-neon-gold/25 ring-1 ring-neon-gold font-extrabold">🎬 ' + esc(oeuvreNom(r.oeuvre)) + '</span></div>' : '';
    return oeu + '<div class="mt-4 flex items-center gap-3 justify-center"><img src="' + esc(r.cover || '') + '" class="w-14 h-14 rounded-lg object-cover" alt="" /><div class="text-left min-w-0"><div class="font-extrabold truncate">' + esc(r.title || '') + '</div><div class="text-white/50 text-sm truncate">' + esc(r.artist || '') + (r.year ? ' · ' + r.year : '') + '</div></div></div>';
  }

  /* Podium top 3 (écran de fin). */
  function renderPodium(lb) {
    if (!lb.length) return '';
    var top = lb.slice(0, 3);
    var heights = ['h-28', 'h-20', 'h-16'];
    var medals = ['🥇', '🥈', '🥉'];

        '<div class="flex flex-col items-center justify-end gap-1.5 flex-1 min-w-0">',
        '  <div class="text-2xl h-7">' + (idx === 0 ? '👑' : '') + '</div>',

  /* Export du classement final en image (html2canvas). */
  function exportLeaderboard(s) {
    var lb = leaderboardArr(s.players);
    var card = document.createElement('div');
    card.style.cssText = 'position:fixed;left:-9999px;top:0;width:480px;padding:32px;background:linear-gradient(160deg,#0b0014,#1a0b2e);color:#fff;font-family:"Baloo 2",sans-serif;border-radius:24px;';
    card.innerHTML = '<div style="text-align:center;font-size:40px">🏆</div>' +
      '<div style="text-align:center;font-size:26px;font-weight:800;margin-bottom:4px">' + esc(s.partyName) + '</div>' +
      '<div style="text-align:center;color:#ffffff99;margin-bottom:20px">Classement final · ' + s.round + ' manche(s)</div>' +
      renderLeaderboard(lb, {}, null);
    document.body.appendChild(card);
    if (!window.html2canvas) { toast('Export indisponible', 'err'); card.remove(); return; }
    html2canvas(card, { backgroundColor: null, scale: 2 }).then(function (canvas) {
      card.remove();
      var a = document.createElement('a');
      a.download = 'blindtest-' + (s.partyName || 'classement').replace(/\s+/g, '-').toLowerCase() + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('Image exportée 📸', 'ok');

  /* --- Économie d'énergie ---------------------------------------------------
     1. On met les animations en pause dès que l'écran n'est pas regardé
        (changement d'appli, écran verrouillé) : plus rien ne tourne pour rien.
     2. On bascule en mode éco automatiquement si la batterie est faible. */
  function updatePaused() { document.body.classList.toggle('bt-paused', document.hidden); }
  document.addEventListener('visibilitychange', updatePaused);
  updatePaused();

  (function autoEco() {
    try {
      // Respecte le réglage système « réduire les animations »
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && !store.get('ecoSet', false)) {
        prefs.eco = true; applyPrefs();
      }
      if (navigator.getBattery) {
        navigator.getBattery().then(function (b) {
          var check = function () {
            // < 25 % et pas en charge → on économise, sauf si l'utilisateur a choisi lui-même
            if (!store.get('ecoSet', false) && !b.charging && b.level <= 0.25 && !prefs.eco) {
              prefs.eco = true; applyPrefs();
              toast('Batterie faible : mode éco activé 🔋', 'info');
            }
          };
          check();
          b.addEventListener('levelchange', check);
          b.addEventListener('chargingchange', check);
        }).catch(function () {});
      }
    } catch (e) {}
  })();

        + '<span class="text-white/50 text-xs">Les titres français ne sont pas exigés à la lettre et les deux noms sont acceptés (« Retour vers le futur » ou « Back to the Future »). Si tu donnes le titre de la chanson au lieu du film, tu marques la moitié des points.</span>'),
      sec('🏆 Les points (Classique / Année)',
        'Bonne réponse <b class="text-neon-lime">+5</b> · Mauvaise <b class="text-rose-400">−2</b><br>'
        + 'Bon vote <b class="text-neon-lime">+2</b> · Mauvais vote <b class="text-rose-400">−1</b><br>'
        + '<span class="text-white/50 text-xs">Voter est un pari : écoute bien même quand ce n\'est pas ton tour !</span>'),
      sec('⚡ Les points en mode Turbo',
        'Barème <b>différent</b> : pas de buzz, pas de vote, tout se joue à la vitesse.<br>'
        + '<b class="text-neon-lime">60 pts garantis</b> pour une bonne réponse<br>'
        + '<b class="text-neon-cyan">+ 0 à 40 pts</b> selon ta rapidité · <b class="text-neon-gold">+10</b> au plus rapide<br>'
        + '≈ à moitié = la moitié · faux ou passe = <b>0</b>, aucun malus<br>'
        + '<span class="text-white/50 text-xs">Soit 60 à 100 points par bonne réponse — tout le monde marque, l\'écart se fait au chrono.</span>'),
      sec('🎡 La roue des défis',
        'Si elle est activée, <b>un défi est tiré au hasard à chaque manche</b> — et il change les règles :<br>'
        + '🔊 Classique · ⚡ Turbo · 📅 Année<br>'
        + '💿 Titre seul · 🎤 Artiste seul · 🎵 Titre + Artiste<br>'
        + '<b class="text-neon-gold">💰 Double points</b> · <b class="text-rose-400">☠️ Mort subite</b> (points ET malus doublés) · <b class="text-neon-gold">🚀 Turbo doublé</b><br>'
        + '<span class="text-white/50 text-xs">Jamais deux fois le même d\'affilée. Le défi s\'affiche sur tous les écrans avant de jouer.</span>'),
      sec('🔥 Combos et 🃏 Jokers',
        '<b>Combo</b> : 2 bonnes réponses d\'affilée = <b class="text-neon-gold">+1</b>, 3 d\'affilée = <b class="text-neon-gold">+2</b>, 4 et + = <b class="text-neon-gold">+3</b>. Une erreur remet la série à zéro.<br>'
        + '<b>🃏 Joker ×2</b> : double tes points sur la manche.<br>'
        + '<b>🛡️ Bouclier</b> : annule le malus si tu te trompes.<br>'
        + '<b class="text-rose-300">🧊 Contre</b> : vise <b>le meneur</b>. Selon le réglage, son <b>écran se couvre de givre</b> (il doit le frotter au doigt pour revenir — il perd des secondes) ou il est <b>barré</b> sur le titre. À jouer <b>avant le premier buzz</b>, seulement si tu ne mènes pas, et <b>un seul par manche</b> pour toute la table.<br>'
        + '<span class="text-white/50 text-xs">1 de chaque par partie, à activer <b>avant</b> de connaître le résultat. On en regagne : 3 bonnes réponses d\'affilée, ou en étant distancé. En Turbo, le combo vaut +5/+10/+15.</span>'),
      sec('🤷 Je ne sais pas',
        'Pendant le buzz, <b>« Je ne sais pas »</b> te retire du titre en cours. Quand tout le monde a renoncé, l\'app <b>révèle la réponse</b> et on passe au suivant.<br>'
        + '<span class="text-white/50 text-xs">Attention : une fois que tu as tenté (ou passé), tu ne votes plus sur ce titre — donc pas de <b>+2</b> à récupérer juste après une mauvaise réponse.</span>'),
      sec('🔋 Ça chauffe / ça rame ?',
        'Active <b>Économie de batterie</b> dans les réglages : ça coupe les animations lourdes.<br>'
        + 'Pense aussi à <b>installer l\'app</b> (plein écran, plus stable).'),
      '  <button id="heDone" class="btn-glow w-full mt-2 py-3.5 rounded-xl bg-gradient-to-r from-neon-pink to-neon-violet font-extrabold">J\'ai compris 👍</button>',
      '</div>'
    ].join('');
    settingsEl.classList.remove('hidden');
    settingsEl.onclick = function (e) { if (e.target === settingsEl) closeSettings(); };
    bind('#heBack', openSettings);
    bind('#heClose', closeSettings);
    bind('#heDone', closeSettings);
  }

  /* Historique des parties terminées. */
  function openHistory() {
    if (!settingsEl) return;
    var hist = store.get('history', []) || [];
    var fmt = function (ts) {
      try { var d = new Date(ts); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
      catch (e) { return ''; }
    };
    var MODE_LBL = { classic: '🔊 Classique', turbo: '⚡ Turbo', fredonne: '🎶 Fredonne', year: '📅 Année' };
    settingsEl.innerHTML = [
      '<div class="set-panel p-5 animate-slidein">',
      '  <div class="flex items-center justify-between mb-3">',
      '    <button id="hBack" class="text-white/60 text-sm">← Retour</button>',
      '    <h2 class="bt-title text-lg font-extrabold glow-cyan">HISTORIQUE</h2>',
      '    <button id="hClose" class="w-9 h-9 rounded-full glass text-lg">✕</button>',
      '  </div>',
      (hist.length ? hist.map(function (h) {
        var podium = h.myRank === 1 ? '🥇' : h.myRank === 2 ? '🥈' : h.myRank === 3 ? '🥉' : '';
        return '<div class="glass rounded-2xl p-3 mb-2">'
          + '<div class="flex items-center justify-between gap-2"><span class="font-extrabold truncate">' + esc(h.party) + '</span><span class="text-white/35 text-xs shrink-0">' + fmt(h.at) + '</span></div>'
          + '<div class="text-white/45 text-xs mt-0.5">' + (MODE_LBL[h.mode] || '') + ' · ' + h.rounds + ' manche' + (h.rounds > 1 ? 's' : '') + ' · ' + h.players + ' joueur' + (h.players > 1 ? 's' : '') + ' · code ' + esc(h.code) + '</div>'
          + '<div class="flex items-center justify-between mt-2 text-sm">'
          + '<span class="text-neon-gold font-bold truncate">🏆 ' + esc(h.winner || '—') + ' (' + h.winnerScore + ')</span>'
          + (h.myScore != null ? '<span class="text-white/70 shrink-0">' + podium + ' toi : <b>' + h.myScore + '</b>' + (h.myRank ? ' · #' + h.myRank : '') + '</span>' : '')
          + '</div></div>';
      }).join('') : '<p class="text-white/40 text-center py-8">Aucune partie terminée pour l\'instant.<br><span class="text-xs">Elles s\'archiveront ici automatiquement.</span></p>'),
      (hist.length ? '  <button id="hClear" class="mt-2 w-full py-3 rounded-xl glass text-white/50 font-bold text-sm">Effacer l\'historique</button>' : ''),
      '</div>'
    ].join('');
    settingsEl.classList.remove('hidden');
    settingsEl.onclick = function (e) { if (e.target === settingsEl) closeSettings(); };
    bind('#hBack', openSettings);
    bind('#hClose', closeSettings);
    bind('#hClear', function () { if (confirm('Effacer tout l\'historique ?')) { store.del('history'); openHistory(); } });
  }

  /* Formulaire de retour d'expérience (envoi par email, sans serveur). */
  function openFeedback() {
    if (!settingsEl) return;
    var fbType = 'idea', fbRating = 0;
    function chip(id, emo, lbl) {
      return '<button data-fbt="' + id + '" class="fbchip flex-1 py-2.5 rounded-xl glass font-bold text-sm">' + emo + ' ' + lbl + '</button>';
    }
    function render() {
      settingsEl.innerHTML = [
        '<div class="set-panel p-5 animate-slidein">',
        '  <div class="flex items-center justify-between mb-3">',
        '    <button id="fbBack" class="text-white/60 text-sm">← Retour</button>',
        '    <h2 class="bt-title text-lg font-extrabold glow-cyan">TON AVIS</h2>',
        '    <button id="fbClose" class="w-9 h-9 rounded-full glass text-lg">✕</button>',
        '  </div>',
        '  <p class="text-white/55 text-sm mb-4">Aide à améliorer l\'app : un bug, une idée, un ressenti — tout est utile 🙏</p>',
        '  <p class="text-xs font-bold uppercase text-white/50 mb-2">Type</p>',
        '  <div class="flex gap-2 mb-4">' + chip('bug', '🐞', 'Bug') + chip('idea', '💡', 'Idée') + chip('other', '💬', 'Autre') + '</div>',
        '  <p class="text-xs font-bold uppercase text-white/50 mb-2">Note globale</p>',
        '  <div id="fbStars" class="flex gap-1 text-3xl mb-4">' + [1, 2, 3, 4, 5].map(function (i) { return '<button data-star="' + i + '">★</button>'; }).join('') + '</div>',
        '  <textarea id="fbMsg" rows="5" maxlength="1000" placeholder="Décris ton idée, le bug rencontré, ce que tu aimerais…" class="w-full bg-black/40 rounded-xl px-4 py-3 outline-none focus:ring-2 ring-neon-cyan mb-3"></textarea>',
        '  <label class="flex items-center gap-2 text-sm text-white/60 mb-4"><input id="fbTech" type="checkbox" checked class="w-4 h-4" /> Inclure les infos techniques (aide au débogage)</label>',
        '  <button id="fbSend" class="btn-glow w-full py-3.5 rounded-xl bg-gradient-to-r from-neon-pink to-neon-violet font-extrabold">Envoyer 📨</button>',
        '  <p class="text-white/35 text-xs text-center mt-3">Envoyé par email à archi.tech.fr@gmail.com</p>',
        '</div>'
      ].join('');
      settingsEl.classList.remove('hidden');

      Array.prototype.forEach.call(settingsEl.querySelectorAll('.fbchip'), function (b) {
        var on = b.getAttribute('data-fbt') === fbType;
        if (on) { b.classList.add('ring-2', 'ring-neon-pink'); }
        b.onclick = function () { fbType = b.getAttribute('data-fbt'); render(); };
      });
      Array.prototype.forEach.call(settingsEl.querySelectorAll('#fbStars button'), function (b) {
        var v = +b.getAttribute('data-star');
        b.classList.add(v <= fbRating ? 'text-neon-gold' : 'opacity-40');
        b.onclick = function () { fbRating = v; render(); };
      });

      bind('#fbBack', openSettings);
      bind('#fbClose', closeSettings);
      settingsEl.onclick = function (e) { if (e.target === settingsEl) closeSettings(); };

      bind('#fbSend', function () {
        var ta = $('#fbMsg');
        var msg = ta ? ta.value.trim() : '';
        if (!msg) { toast('Écris un petit message 🙂', 'err'); if (ta) ta.focus(); return; }
        var tech = $('#fbTech') && $('#fbTech').checked;
        var labels = { bug: '🐞 Bug', idea: '💡 Idée', other: '💬 Retour' };
        var subject = '[DJ Blind Test] ' + (labels[fbType] || 'Retour') + (fbRating ? ' — ' + fbRating + '/5' : '');
        var body = msg;
        if (tech) {
          body += '\n\n----- infos techniques -----\n'
            + 'App : DJ Blind Test v1.1\n'
            + 'Thème : ' + (prefs.theme || 'synthwave') + '\n'
            + 'Écran : ' + (window.screen ? screen.width + 'x' + screen.height : '?') + ' (dpr ' + (window.devicePixelRatio || 1) + ')\n'
            + 'Langue : ' + (navigator.language || '?') + '\n'
            + 'Navigateur : ' + navigator.userAgent;
        }
        if (navigator.clipboard) navigator.clipboard.writeText(subject + '\n\n' + body).catch(function () {});
        location.href = 'mailto:archi.tech.fr@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        toast('Merci pour ton retour ! 🙏', 'ok');
        setTimeout(closeSettings, 500);
      });
    }
    render();
  }

  /* --------------------------------------------------------------------------
     8. Démarrage
     -------------------------------------------------------------------------- */
  applyPrefs(); // applique le thème + préférences enregistrés avant le 1er rendu

  /* PWA : service worker (cache + installable plein écran). */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  if (!SB_URL || !window.supabase) {
    app.innerHTML = '<div class="flex-1 flex items-center justify-center p-8 text-center text-white/70">Configuration Supabase manquante.<br>Vérifie assets/js/supabase-config.js</div>';
  } else {
    route();
  }
})();

</script>
</body>
</html>
