  <style>
    :root { --bt-max: 480px; }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    html { background: #05000a; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #05000a;
      overscroll-behavior: none;
    }

    /* ====================== DÉCOR SYNTHWAVE (fixe, derrière tout) ====================== */
    .bt-bg { position: fixed; inset: 0; z-index: -2; overflow: hidden;
      background: linear-gradient(180deg,
        #05000a 0%, #0c0530 20%, #2a0a55 38%, #6a1670 52%, #c01f7a 60%,
        #ff486b 63%, #ff9a3c 65%, #1c0738 65%, #0a0118 100%); }
    .bt-stars { position: absolute; inset: 0 0 38% 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, #fff, transparent),
        radial-gradient(1px 1px at 70% 18%, #fff, transparent),
        radial-gradient(1px 1px at 45% 50%, #ffd9f3, transparent),
        radial-gradient(1px 1px at 85% 40%, #fff, transparent),
        radial-gradient(1px 1px at 12% 60%, #cfeeff, transparent),
        radial-gradient(1px 1px at 60% 65%, #fff, transparent);
      opacity: .8; }
    .bt-sun { position: absolute; left: 50%; top: 64%; transform: translate(-50%, -100%);
      width: min(62vw, 320px); height: min(62vw, 320px); border-radius: 50%;
      background: linear-gradient(180deg, #fff6b0 0%, #ffd23f 28%, #ff7a3d 55%, #ff2e9a 82%, #b3146e 100%);
      box-shadow: 0 0 90px 22px rgba(255,90,140,.5), 0 0 160px 40px rgba(255,138,0,.25); }
    .bt-sun::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: repeating-linear-gradient(180deg, transparent 0 16px, #1c0738 16px 22px);
      -webkit-mask: linear-gradient(180deg, transparent 46%, #000 46%);
              mask: linear-gradient(180deg, transparent 46%, #000 46%); }
    .bt-grid { position: absolute; left: -60%; right: -60%; top: 65%; bottom: -25%;
      background-image:
        linear-gradient(to right, rgba(34,211,238,.55) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(255,46,154,.5) 1.5px, transparent 1.5px);
      background-size: 44px 44px;
      transform: perspective(320px) rotateX(64deg); transform-origin: 50% 0;
      animation: btgrid 1.6s linear infinite;
      -webkit-mask: linear-gradient(180deg, #000 0%, transparent 88%);
              mask: linear-gradient(180deg, #000 0%, transparent 88%); }
    @keyframes btgrid { from { background-position: 0 0; } to { background-position: 0 44px; } }
    @media (prefers-reduced-motion: reduce) { .bt-grid { animation: none; } }

    /* Voile scanlines CRT + vignette */
    .bt-scan { position: fixed; inset: 0; z-index: 60; pointer-events: none;

    .bt-vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 80% at 50% 35%, transparent 55%, rgba(0,0,0,.55) 100%); }

    /* ====================== CADRE "APP MOBILE" ====================== */
    #app { position: relative; z-index: 1; width: 100%; max-width: var(--bt-max);
      margin: 0 auto; min-height: 100dvh;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    @media (min-width: 540px) {
      #app { min-height: min(900px, 94dvh); margin: 3dvh auto;

    }

    /* ====================== UTILITAIRES NÉON ====================== */
    /* Pas de backdrop-filter ici : appliqué à chaque carte, c'est le plus gros
       consommateur GPU sur mobile (flou recalculé à chaque frame). Le dégradé
       opaque donne le même rendu pour un coût quasi nul. */
    .glass { background: linear-gradient(180deg, rgba(40,12,66,.72), rgba(10,3,26,.82));
      border: 1px solid rgba(34,211,238,.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 26px rgba(34,211,238,.08); }
    .text-glow { text-shadow: 0 0 16px rgba(255,46,154,.7), 0 0 38px rgba(255,46,154,.35); }
    .glow-cyan { text-shadow: 0 0 14px rgba(34,211,238,.75), 0 0 30px rgba(34,211,238,.4); }
    .bt-logo { font-family: "Audiowide", system-ui, sans-serif; letter-spacing: .04em;
      background: linear-gradient(180deg, #fff 0%, #ffe7fb 38%, #ff7ad0 62%, #22d3ee 63%, #18a9c7 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 0 rgba(255,46,154,.6)) drop-shadow(0 0 22px rgba(34,211,238,.45)); }
    .bt-title { font-family: "Orbitron", system-ui, sans-serif; }

    /* Boutons : ressenti tactile + halo néon sur les CTA dégradés */
    button { transition: transform .12s ease, box-shadow .2s ease, filter .2s ease; }
    button:active { transform: translateY(1px) scale(.985); }
    .btn-glow { box-shadow: 0 0 26px rgba(255,46,154,.45), inset 0 0 0 1px rgba(255,255,255,.12); }
    .btn-glow-cyan { box-shadow: 0 0 26px rgba(34,211,238,.45), inset 0 0 0 1px rgba(255,255,255,.12); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(34,211,238,.25); border-radius: 8px; }
    input { font-size: 16px; } /* évite le zoom auto iOS */

    /* Confettis (canvas plein écran) */
    #confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }

    /* ====================== THÈMES DE COULEUR ====================== */
    body[data-theme="miami"] .bt-bg { background: linear-gradient(180deg,#03252e 0%,#063b46 22%,#0b6b6b 40%,#16a3a3 52%,#27d3c4 58%,#ff6ad5 63%,#ffd23f 65%,#06212b 65%,#03141a 100%); }
    body[data-theme="miami"] .bt-sun { background: linear-gradient(180deg,#fff1c2,#ffd23f 28%,#ff6ad5 60%,#a21caf 100%); }
    body[data-theme="miami"] .bt-grid { background-image: linear-gradient(to right,rgba(45,212,191,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(255,106,213,.5) 1.5px,transparent 1.5px); }

    body[data-theme="outrun"] .bt-bg { background: linear-gradient(180deg,#1a0524 0%,#3b0a3f 24%,#7a1340 44%,#c01f3a 56%,#ff5e3a 62%,#ffb43d 65%,#1a0820 65%,#0a0410 100%); }
    body[data-theme="outrun"] .bt-sun { background: linear-gradient(180deg,#fff3b0,#ffd23f 25%,#ff7a3d 55%,#ff2e3a 100%); }
    body[data-theme="outrun"] .bt-grid { background-image: linear-gradient(to right,rgba(255,138,0,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(255,60,90,.5) 1.5px,transparent 1.5px); }

    body[data-theme="ice"] .bt-bg { background: linear-gradient(180deg,#02061a 0%,#071233 24%,#0b2a6b 44%,#1455c0 56%,#3aa0ff 62%,#9fe3ff 65%,#04122e 65%,#020816 100%); }
    body[data-theme="ice"] .bt-sun { background: linear-gradient(180deg,#ffffff,#cfeeff 30%,#5fb6ff 60%,#1455c0 100%); }
    body[data-theme="ice"] .bt-grid { background-image: linear-gradient(to right,rgba(125,211,252,.65) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(37,99,235,.5) 1.5px,transparent 1.5px); }

    body[data-theme="galaxy"] .bt-bg { background: linear-gradient(180deg,#05010f 0%,#140531 26%,#3b1080 46%,#6d28d9 56%,#a21caf 62%,#ec4899 65%,#0f0524 65%,#05010f 100%); }
    body[data-theme="galaxy"] .bt-sun { background: linear-gradient(180deg,#f5d0fe,#c084fc 30%,#a21caf 60%,#6d28d9 100%); }
    body[data-theme="galaxy"] .bt-grid { background-image: linear-gradient(to right,rgba(139,92,246,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(236,72,153,.5) 1.5px,transparent 1.5px); }

    body[data-theme="mint"] .bt-bg { background: linear-gradient(180deg,#04201f 0%,#073b35 24%,#0f6b5a 42%,#34d399 54%,#a7f3d0 60%,#fbcfe8 64%,#0a201d 64%,#041413 100%); }
    body[data-theme="mint"] .bt-sun { background: linear-gradient(180deg,#fffde7,#a7f3d0 30%,#5eead4 55%,#f472b6 100%); }
    body[data-theme="mint"] .bt-grid { background-image: linear-gradient(to right,rgba(94,234,212,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(244,114,182,.5) 1.5px,transparent 1.5px); }

    body.bt-no-anim .bt-grid { animation: none; }

    /* ================= ÉCONOMIE DE BATTERIE =================
       Une animation plein écran en boucle fait travailler le GPU 60×/s sans
       interruption : c'est ce qui fait chauffer les téléphones. On la coupe
       dès que la page n'est pas regardée, et en mode éco. */
    body.bt-paused .bt-grid,
    body.bt-paused .animate-float,
    body.bt-paused .animate-pulse,
    body.bt-paused .animate-ring { animation-play-state: paused !important; }

    body.bt-eco .bt-grid { animation: none !important; }
    body.bt-eco .animate-float,
    body.bt-eco .animate-pulse,
    body.bt-eco .animate-ring { animation: none !important; }
    body.bt-eco .bt-scan { display: none; }            /* voile plein écran inutile */
    body.bt-eco #settings, body.bt-eco #picker,
    body.bt-eco #scanner { backdrop-filter: none; background: rgba(3,0,10,.9); }
    body.bt-eco #app { backdrop-filter: none; }
    body.bt-eco .bt-sun { box-shadow: none; }          /* grandes ombres = coûteuses */

    /* ====================== ROUE & MENU RÉGLAGES ====================== */
    .gear { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; z-index: 5;

    #settings.hidden, #picker.hidden, #scanner.hidden { display: none; }
    #settings, #picker, #scanner { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center;
      background: rgba(3,0,10,.62); backdrop-filter: blur(5px); }
    @media (min-width: 540px) { #settings, #picker, #scanner { align-items: center; } }
    .dz-card { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: rgba(0,0,0,.25); }
    .dz-card img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .set-panel { width: 100%; max-width: 480px; max-height: 92dvh; overflow-y: auto;
      border-radius: 26px 26px 0 0;
      background: linear-gradient(180deg, rgba(22,7,44,.97), rgba(8,2,20,.99));
      border: 1px solid rgba(34,211,238,.25);
      box-shadow: 0 -12px 70px rgba(255,46,154,.25);
      padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }
    @media (min-width: 540px) { .set-panel { border-radius: 26px; } }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 0; border-top: 1px solid rgba(255,255,255,.06); }
    .swatch { width: 40px; height: 40px; border-radius: 13px; border: 2px solid transparent; cursor: pointer; transition: transform .12s; }
    .swatch:active { transform: scale(.92); }
    .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(34,211,238,.7), 0 0 16px rgba(255,46,154,.5); }
    .toggle { width: 52px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.16); position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
    .toggle.on { background: linear-gradient(90deg,#22d3ee,#ff2e9a); }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
    .toggle.on::after { left: 25px; }
  </style>

<body class="text-white font-display antialiased">
  <!-- Décor Synthwave -->

  <!-- Lecteur audio (extraits Deezer, sur l'appareil hôte) -->

  <!-- Confettis + Toasts -->

  <div id="toasts" class="fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

  <script>
/* =============================================================================
   BLIND TEST MUSICAL — Application de soirée multijoueur temps réel
   -----------------------------------------------------------------------------
   Stack : HTML + Tailwind (CDN) + Supabase Realtime (Broadcast + Presence).
   Aucune table SQL, aucune migration : le jeu est éphémère et tient en mémoire.

   Architecture "autorité hôte" :
     • L'ÉCRAN HÔTE détient l'état complet de la partie (the single source of truth)
       et le diffuse (broadcast "state") à chaque changement.
     • Les ÉCRANS JOUEURS sont des clients fins : ils envoient des intentions
       (broadcast "intent" : join / buzz / answer / vote / leave) et se contentent
       d'afficher l'état reçu de l'hôte.
     • La PRÉSENCE Supabase détecte les connexions/déconnexions.

   Dépendances chargées avant (voir blindtest.html) :
     supabase-js v2, supabase-config.js (window.AXION_SUPABASE), qrcode, html2canvas.
   ============================================================================= */
(function () {
  'use strict';

  /* --------------------------------------------------------------------------
     0. Constantes & utilitaires
     -------------------------------------------------------------------------- */
  /* Credentials Supabase : on réutilise ceux d'AXION si présents (window.AXION_SUPABASE,
     défini par assets/js/supabase-config.js), sinon on retombe sur les valeurs publiques
     intégrées ci-dessous. La clé "anon"/"publishable" est PUBLIQUE par conception (elle
     tourne dans le navigateur). Realtime Broadcast/Presence ne touche à aucune table.
     => L'app fonctionne donc en autonomie totale (GitHub Pages, Vercel, fichier servi…). */
  var SB_FALLBACK = { url: 'https://phfdrgvdfhwtyycxpahq.supabase.co', anonKey: 'sb_publishable_GD32kGL-4Et4FEAAOQQrBQ_zClazT3V' };
  var SB_CONF = window.AXION_SUPABASE || SB_FALLBACK;
  var SB_URL = SB_CONF.url || SB_FALLBACK.url;
  var SB_KEY = SB_CONF.anonKey || SB_FALLBACK.anonKey;
  var BUZZ_LOCK_MS = 3000;          // anti-spam : buzz verrouillé au lancement
  var CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sans I,O,0,1,L (lisibilité)

  var app = document.getElementById('app');
  var toasts = document.getElementById('toasts');

  function $(sel, root) { return (root || document).querySelector(sel); }
  function uuid() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxxyxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0, v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  function genCode() {
    var s = '';
    for (var i = 0; i < 6; i++) s += CODE_ALPHABET[(Math.random() * CODE_ALPHABET.length) | 0];
    return s;
  }
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function deb(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return ((parts[0][0] || '?') + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  /* Petit feedback sensoriel : bip WebAudio + vibration. */
  var AC = window.AudioContext || window.webkitAudioContext;
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (prefs && prefs.muted) return;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sawtooth'; o.frequency.value = freq || 660;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.18));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + (dur || 0.18));
    } catch (e) { /* audio bloqué, on ignore */ }
  }
  function vibrate(pattern) { if (prefs && prefs.novib) return; try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }

  /* Empêche la mise en veille de l'écran pendant une partie (crucial pour l'hôte). */
  var _wake = null;
  function keepAwake() {
    try {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (w) {
          _wake = w; w.addEventListener('release', function () { _wake = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });

  /* --------------------------------------------------------------------------
     Lecteur Deezer (recherche JSONP sans clé/serveur + lecture des extraits 30s)
     -------------------------------------------------------------------------- */
  function jsonp(url, cb) {
    var name = 'dz_' + Math.floor(Math.random() * 1e9) + (jsonp._n = (jsonp._n || 0) + 1);
    var s = document.createElement('script');
    var done = false;
    var to = setTimeout(function () { if (!done) { done = true; cleanup(); cb(null); } }, 8000);
    function cleanup() { clearTimeout(to); delete window[name]; if (s.parentNode) s.remove(); }
    window[name] = function (data) { if (done) return; done = true; cleanup(); cb(data); };
    s.onerror = function () { if (!done) { done = true; cleanup(); cb(null); } };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'output=jsonp&callback=' + name;
    document.body.appendChild(s);
  }
  function deezerSearch(q, cb) {
    if (!q) { cb([]); return; }
    jsonp('https://api.deezer.com/search?limit=12&q=' + encodeURIComponent(q), function (d) {
      cb(d && d.data ? d.data.filter(function (t) { return t.preview; }) : null);
    });
  }
  function deezerTrack(id, cb) { jsonp('https://api.deezer.com/track/' + id, function (d) { cb(d || null); }); }

  /* ---------------------------------------------------------------
     Deuxième banque d'extraits : Apple/iTunes (gratuite, sans compte,
     sans publicité). Catalogue et surtout POINT DE DÉPART des extraits
     différents de Deezer — utile quand l'extrait Deezer tombe mal.
     Les résultats sont normalisés au format Deezer pour que le reste
     du code n'ait rien à changer ; l'année est fournie directement.
     --------------------------------------------------------------- */
  function itunesSearch(q, cb) {
    if (!q) { cb([]); return; }
    var url = 'https://itunes.apple.com/search?entity=song&limit=12&country=FR&term=' + encodeURIComponent(q);
    try {
      fetch(url).then(function (r) { return r.json(); }).then(function (d) {
        var list = (d && d.results ? d.results : []).filter(function (t) { return t.previewUrl; }).map(function (t) {
          return {
            id: t.trackId,
            title: t.trackName,
            artist: { name: t.artistName },
            album: { cover_small: (t.artworkUrl60 || t.artworkUrl100 || ''), cover_medium: (t.artworkUrl100 || '').replace('100x100', '300x300') },
            preview: t.previewUrl,
            year: parseInt(String(t.releaseDate || '').slice(0, 4), 10) || null
          };
        });
        cb(list);
      }).catch(function () { cb(null); });
    } catch (e) { cb(null); }
  }

  /* Recherche via la banque choisie dans les réglages. */
  function musicSearch(q, cb) {
    if (prefs && prefs.previewSrc === 'itunes') itunesSearch(q, cb);
    else deezerSearch(q, cb);
  }
  /* Complète l'année si la banque ne l'a pas déjà fournie. */
  function fillYear(t, obj, done) {
    if (t && t.year) { obj.year = t.year; done && done(); return; }
    deezerTrack(t.id, function (full) {
      if (full && full.release_date) obj.year = parseInt(String(full.release_date).slice(0, 4), 10) || null;
      done && done();
    });
  }

  /* Tire un morceau de la playlist, en évitant ceux déjà joués. cb(track|null) */
  function autoPick(pl, usedIds, cb, tries) {
    tries = tries || 0;
    if (!pl || tries >= 4) { cb(null); return; }
    var artist = pl.artists[(Math.random() * pl.artists.length) | 0];
    musicSearch(artist, function (res) {
      if (!res || !res.length) { autoPick(pl, usedIds, cb, tries + 1); return; }
      var pool = res.filter(function (t) { return t.preview && usedIds.indexOf(t.id) < 0; });
      if (!pool.length) { autoPick(pl, usedIds, cb, tries + 1); return; }
      cb(pool[(Math.random() * pool.length) | 0]);
    });
  }

  var dzAudio = document.getElementById('dzaudio');

  var appAudioMode = 'device';
  function canPlayInApp() { return appAudioMode === 'device'; }

  function dzPlay(url) {
    // En mode "source à part", on ne lance jamais d'audio : le son vient d'ailleurs.
    if (!canPlayInApp()) return;
    if (!dzAudio || !url) return;
    try { if (dzAudio.src !== url) dzAudio.src = url; dzAudio.currentTime = 0; dzAudio.play().catch(function () {}); } catch (e) {}
  }
  function dzResume() { if (dzAudio) dzAudio.play().catch(function () {}); }

  // Le DJ voit SON morceau par défaut (il doit le choisir, le lancer, corriger).

  var trackHidden = false;
  function playerBar(track, opts) {

      + '</div>'

  /* Branche les commandes du lecteur + la progression (événement natif, léger). */
  function bindPlayer(track, onChange) {
    if (!track) return;
    bind('#plyToggle', function () {
      if (!dzAudio) return;
      if (!dzAudio.paused && dzAudio.src === track.preview) dzPause();
      else if (dzAudio.src === track.preview && dzAudio.currentTime > 0) dzResume();
      else dzPlay(track.preview);
      if (onChange) setTimeout(onChange, 60);
    });
    bind('#plyRestart', function () { dzPlay(track.preview); if (onChange) setTimeout(onChange, 60); });
    bind('#plyPeek', function () { trackHidden = !trackHidden; if (onChange) onChange(); });
    var v = $('#plyVol'); if (v) v.oninput = function () { if (dzAudio) dzAudio.volume = parseFloat(v.value); };
    if (dzAudio) {
      dzAudio.ontimeupdate = function () {
        var bar = document.getElementById('plyBar'), tm = document.getElementById('plyTime');
        if (!bar || !dzAudio.duration) return;
        bar.style.width = Math.min(100, (dzAudio.currentTime / dzAudio.duration) * 100) + '%';
        if (tm) { var s = Math.floor(dzAudio.currentTime); tm.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
      };
      dzAudio.onended = function () { if (onChange) onChange(); };
    }
  }
  function dzPause() { if (dzAudio) try { dzAudio.pause(); } catch (e) {} }

  /* Comparaison floue réponse <-> morceau (pour la suggestion ✓/✗). */
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\(.*?\)/g, ' ').replace(/feat.*$/, ' ').replace(/[^a-z0-9]+/g, ' ').trim(); }
  function fuzzyHit(answer, track, mode) {
    if (!track) return null;
    var a = norm(answer); if (!a) return null;
    var title = norm(track.title), artist = norm(track.artist);
    function inc(h, n) { return n && n.length > 1 && h.indexOf(n) >= 0; }
    function match(field) {
      if (!field) return false;
      if (inc(a, field) || inc(field, a)) return true;
      var aw = a.split(' ').filter(function (w) { return w.length > 2; });
      var fw = field.split(' ');
      return aw.filter(function (w) { return fw.indexOf(w) >= 0; }).length >= 1;
    }
    var mt = match(title), ma = match(artist);
    if (mode === 'title') return mt ? 'ok' : 'ko';
    if (mode === 'artist') return ma ? 'ok' : 'ko';
    if (mode === 'either') return (mt || ma) ? 'ok' : 'ko';       // l'un des deux suffit
    return (mt && ma) ? 'ok' : ((mt || ma) ? 'half' : 'ko');      // both : les deux attendus
  }

  /* --------------------------------------------------------------------------
     Scanner QR intégré (caméra + décodage jsQR chargé à la demande)
     -------------------------------------------------------------------------- */
  function loadJsQR(cb) {
    if (window.jsQR) return cb(true);
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = function () { cb(!!window.jsQR); };
    s.onerror = function () { cb(false); };
    document.body.appendChild(s);
  }
  var scanStream = null, scanRAF = 0;
  function stopScan() {
    if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = 0; }
    if (scanStream) { try { scanStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} scanStream = null; }
    var el = document.getElementById('scanner'); if (el) { el.classList.add('hidden'); el.innerHTML = ''; }
  }
  function openScanner() {
    var el = document.getElementById('scanner'); if (!el) return;
    el.innerHTML = '<div class="set-panel p-5 text-center animate-slidein">'
      + '<div class="flex items-center justify-between mb-3"><h2 class="bt-title text-lg font-extrabold glow-cyan">SCANNER LE QR</h2><button id="scClose" class="w-9 h-9 rounded-full glass text-lg">✕</button></div>'
      + '<div class="relative rounded-2xl overflow-hidden bg-black" style="aspect-ratio:1"><video id="scvid" playsinline muted class="w-full h-full object-cover"></video><div class="absolute inset-6 border-2 border-neon-cyan rounded-2xl pointer-events-none"></div></div>'
      + '<p id="scmsg" class="text-white/60 text-sm mt-3">Vise le QR code affiché par l\'hôte…</p>'
      + '<button id="scManual" class="mt-2 text-white/40 text-sm underline">Saisir le code à la main</button>'
      + '</div>';
    el.classList.remove('hidden');
    el.onclick = function (e) { if (e.target === el) stopScan(); };
    bind('#scClose', stopScan);
    bind('#scManual', function () { stopScan(); location.hash = ''; setTimeout(function () { var i = document.getElementById('joinCode'); if (i) i.focus(); }, 120); });
    var msg = function (t) { var m = document.getElementById('scmsg'); if (m) m.textContent = t; };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg('Caméra non disponible sur cet appareil. Saisis le code à la main.'); return; }
    loadJsQR(function (ok) {
      if (!ok) { msg('Scanner indisponible (réseau ?). Saisis le code à la main.'); return; }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (stream) {
        scanStream = stream;
        var v = document.getElementById('scvid'); if (!v) { stopScan(); return; }
        v.srcObject = stream; v.play().catch(function () {});
        var cv = document.createElement('canvas'), cx = cv.getContext('2d');
        function tick() {
          if (!scanStream) return;
          if (v.readyState >= 2 && v.videoWidth) {
            cv.width = v.videoWidth; cv.height = v.videoHeight;
            cx.drawImage(v, 0, 0, cv.width, cv.height);
            var img = cx.getImageData(0, 0, cv.width, cv.height);
            var res = window.jsQR(img.data, img.width, img.height);
            if (res && res.data) {
              var m = res.data.match(/join=([A-Za-z0-9]{6})/);
              if (m) { vibrate(60); beep(880, 0.1, 'sine'); var code = m[1].toUpperCase(); stopScan(); location.hash = 'join=' + code; return; }
              msg('QR détecté, mais ce n\'est pas une partie Blind Test.');
            }
          }
          scanRAF = requestAnimationFrame(tick);
        }
        scanRAF = requestAnimationFrame(tick);
      }).catch(function (err) {
        msg(err && err.name === 'NotAllowedError' ? 'Accès caméra refusé. Autorise la caméra, ou saisis le code.' : 'Impossible d\'ouvrir la caméra. Saisis le code à la main.');
      });
    });
  }

  /* Confettis plein écran (canvas, sans dépendance) */
  var _confCv = document.getElementById('confetti');
  var _confCtx = _confCv && _confCv.getContext('2d');
  var _conf = [], _confRAF = 0;
  function confetti(n) {
    if (prefs && prefs.noanim) return;
    if (!_confCtx) return;
    var W = _confCv.width = window.innerWidth, H = _confCv.height = window.innerHeight;
    var colors = ['#ff2e9a', '#22d3ee', '#a3e635', '#fbbf24', '#8b5cf6', '#ff8a00'];
    for (var i = 0; i < (n || 120); i++) {
      _conf.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.3,
        vx: (Math.random() - 0.5) * 6, vy: 3 + Math.random() * 5,
        s: 5 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!_confRAF) _confRAF = requestAnimationFrame(_confStep);
  }
  function _confStep() {
    var W = _confCv.width, H = _confCv.height;
    _confCtx.clearRect(0, 0, W, H);
    for (var i = _conf.length - 1; i >= 0; i--) {
      var p = _conf[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.r += p.vr;
      _confCtx.save(); _confCtx.translate(p.x, p.y); _confCtx.rotate(p.r);
      _confCtx.fillStyle = p.c; _confCtx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); _confCtx.restore();
      if (p.y > H + 30) _conf.splice(i, 1);
    }
    if (_conf.length) _confRAF = requestAnimationFrame(_confStep);
    else { _confCtx.clearRect(0, 0, W, H); _confRAF = 0; }
  }

  function toast(msg, kind) {
    var c = { ok: 'bg-neon-lime text-black', err: 'bg-rose-500', info: 'bg-neon-violet' }[kind || 'info'];

    el.className = 'pointer-events-auto px-4 py-2 rounded-full font-bold shadow-lg animate-slidein ' + c;
    el.textContent = msg;

  /* Stockage local (pseudo + identité client + reprise de partie hôte) */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('bt.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('bt.' + k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem('bt.' + k); } catch (e) {} }
  };

  var ME = store.get('clientId', null);
  if (!ME) { ME = uuid(); store.set('clientId', ME); }

  /* Historique : une partie terminée est archivée et ne doit plus être proposée
     en « reprise rapide » sur l'accueil. */
  function archiveGame(st, code, myName) {
    try {
      var hist = store.get('history', []);
      if (hist.some(function (h) { return h.code === code && h.round === st.round; })) return;
      var info = fairInfo(st.players);
      var lb = (!info.balanced ? leaderboardFair(st.players, info) : leaderboardArr(st.players));
      var me = st.players && st.players[ME];
      hist.unshift({
        code: code, party: st.partyName || 'Blind Test', at: Date.now(),
        rounds: st.round, mode: st.mode,
        winner: lb[0] ? lb[0].name : '', winnerScore: lb[0] ? (info.balanced ? lb[0].score : fairScore(lb[0], info)) : 0,
        myName: myName || (me && me.name) || '', myScore: me ? me.score : null,
        myRank: lb.findIndex(function (p) { return p.id === ME; }) + 1,
        players: lb.length
      });
      store.set('history', hist.slice(0, 20));
      var lj = store.get('lastJoin', null);
      if (lj && lj.code === code) store.del('lastJoin'); // ne plus proposer d'y revenir
    } catch (e) {}
  }

  /* --------------------------------------------------------------------------
     1. Couche temps réel (Supabase Realtime)
     -------------------------------------------------------------------------- */
  var supa = null;
  function client() {
    if (supa) return supa;
    if (!window.supabase || !SB_URL) throw new Error('SDK Supabase indisponible');
    // 10 évts/s suffisent largement pour un blind test et réduisent le réveil radio du téléphone.
    supa = window.supabase.createClient(SB_URL, SB_KEY, { realtime: { params: { eventsPerSecond: 10 } } });
    return supa;
  }

  /* Bandeau d'état de la connexion temps réel (visible en haut de l'écran). */
  var linkEl = null, linkState = 'wait';
  function setLink(st) {
    if (st === linkState) return;
    linkState = st;
    if (!linkEl) {
      linkEl = document.createElement('div');
      linkEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:90;text-align:center;font-size:12px;font-weight:700;padding:5px 8px;transition:opacity .3s;pointer-events:none';
      document.body.appendChild(linkEl);
    }
    if (st === 'ok') {
      linkEl.textContent = '✓ Connecté';
      linkEl.style.background = 'rgba(163,230,53,.9)'; linkEl.style.color = '#0b0014';
      setTimeout(function () { if (linkState === 'ok') linkEl.style.opacity = '0'; }, 1200);
    } else {
      linkEl.style.opacity = '1';
      if (st === 'down') { linkEl.textContent = '⚠️ Connexion perdue — reconnexion…'; linkEl.style.background = 'rgba(244,63,94,.95)'; linkEl.style.color = '#fff'; }
      else { linkEl.textContent = '⏳ Connexion…'; linkEl.style.background = 'rgba(139,92,246,.9)'; linkEl.style.color = '#fff'; }
    }
  }
  window.addEventListener('offline', function () { setLink('down'); });
  window.addEventListener('online', function () { setLink('wait'); });

  /* Ouvre un canal de partie. handlers = { onIntent, onState, onPresence, onReady } */
  function openChannel(code, identity, handlers) {
    var ch = client().channel('blindtest-' + code, {
      config: { broadcast: { self: false }, presence: { key: identity.id } }
    });
    if (handlers.onIntent) ch.on('broadcast', { event: 'intent' }, function (m) { handlers.onIntent(m.payload); });
    if (handlers.onState) ch.on('broadcast', { event: 'state' }, function (m) { handlers.onState(m.payload); });
    // Canal léger : sert à informer le DJ de l'avancement SANS renvoyer tout l'état
    // (un state complet reconstruit l'écran des joueurs et efface leur saisie en cours).
    if (handlers.onProgress) ch.on('broadcast', { event: 'progress' }, function (m) { handlers.onProgress(m.payload); });
    if (handlers.onPresence) {
      ch.on('presence', { event: 'sync' }, function () { handlers.onPresence(ch.presenceState()); });
      ch.on('presence', { event: 'leave' }, function (e) { handlers.onPresence(ch.presenceState(), e); });
    }
    ch.subscribe(function (status) {
      // Statut visible : sans ça, une coupure réseau se traduit par un écran figé sans explication.
      setLink(status === 'SUBSCRIBED' ? 'ok' : (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') ? 'down' : 'wait');
      if (status === 'SUBSCRIBED') {
        ch.track({ id: identity.id, name: identity.name, role: identity.role, at: Date.now() });
        if (handlers.onReady) handlers.onReady(ch);
      }
    });
    return {
      raw: ch,
      sendIntent: function (payload) { ch.send({ type: 'broadcast', event: 'intent', payload: payload }); },
      sendState: function (payload) { ch.send({ type: 'broadcast', event: 'state', payload: payload }); },
      sendProgress: function (payload) { ch.send({ type: 'broadcast', event: 'progress', payload: payload }); },
      close: function () { try { client().removeChannel(ch); } catch (e) {} }
    };
  }

  /* --------------------------------------------------------------------------
     2. Routeur de vues minimal (basé sur le hash)
     -------------------------------------------------------------------------- */
  var current = null; // contrôleur actif (host/player) pour nettoyage
  function teardown() { if (current && current.destroy) { try { current.destroy(); } catch (e) {} } current = null; }

  function route() {
    teardown();
    var h = location.hash.slice(1);
    var m = h.match(/^join=([A-Z0-9]{6})$/i);
    if (h === 'new') return renderHostSetup();          // créer une nouvelle partie
    if (h === 'host') {                                  // partie hôte en cours
      var saved = store.get('hostGame', null);
      if (saved && saved.code) return startHost(saved);
      return renderHostSetup();
    }
    if (m) return renderJoin(m[1].toUpperCase());
    return renderHome();
  }
  window.addEventListener('hashchange', route);
  /* Naviguer en étant sûr que la vue change : affecter un hash identique
     ne déclenche pas d'événement, ce qui donnait des boutons « sans effet ». */
  function go(h) {
    if (location.hash.replace('#', '') === h) route();
    else location.hash = h;
  }

  function initialState(code, hostName, partyName, cfg) {
    return {
      code: code, hostName: hostName, partyName: partyName, config: cfg,
      round: 0, phase: 'lobby', theme: '', mode: 'classic', teams: 0, answerMode: 'both',
      source: null, _srcIdx: -1, fredEvery: 10, fredCount: 0, year: null, guesses: {},
      reveal: null, suggest: null,
      buzzer: null, answer: null, votes: {}, result: null, buzzAt: 0,
      buzzOpenAt: 0, buzzMs: null, voteAt: 0, tried: [],
      answers: {}, grades: {}, turboSecs: 30, turboScores: null,
      djRotate: 0, djEvery: 5, djCount: 0, _djIdx: -1, dj: null,
      goal: 'none', goalVal: 0, combos: 1, jokers: 1, jok: {},
      wheel: 0, challenge: null, mult: 1, audioMode: 'device', blind: 0,
      players: {},   // id -> { id, name, score, team }
      history: []
    };

  /* --------------------------------------------------------------------------
     5. CONTRÔLEUR HÔTE (autorité de la partie)
     -------------------------------------------------------------------------- */
  function startHost(state) {
    var code = state.code;
    store.set('hostGame', state);
    keepAwake();
    appAudioMode = state.audioMode || 'device'; // qui produit le son sur cette partie
    var roundTrack = null; // morceau Deezer choisi pour la manche (local hôte, jamais diffusé)
    var autoPl = store.get('autoPlaylist', null); // playlist automatique active (id) ou null
    var playedIds = [];                            // morceaux déjà passés, pour ne pas les répéter
    var autoLoading = false;

    /* Précharge le morceau suivant de la playlist pour qu'il soit prêt
       dès que l'hôte lance la manche (la recherche Deezer est asynchrone). */
    function prefetchAuto() {
      if (!autoPl || roundTrack || autoLoading) return;
      var pl = playlistById(autoPl); if (!pl) return;
      autoLoading = true;
      autoPick(pl, playedIds, function (t) {
        autoLoading = false;
        if (!t) { toast('Playlist : aucun morceau trouvé, réessaie', 'err'); return; }
        playedIds.push(t.id);
        if (playedIds.length > 200) playedIds.shift();
        roundTrack = { title: t.title, artist: t.artist ? t.artist.name : '', cover: (t.album && t.album.cover_medium) || '', preview: t.preview, year: null, auto: true };
        fillYear(t, roundTrack, renderHost);
        renderHost();
      });
    }

    function persist() { store.set('hostGame', state); }
    function publish() { persist(); if (chan) chan.sendState(state); renderHost(); }

    function assignTeam(pl) {
      if (!state.teams) { pl.team = null; return; }
      var counts = []; for (var i = 0; i < state.teams; i++) counts[i] = 0;
      Object.keys(state.players).forEach(function (id) {
        var t = state.players[id].team;
        if (typeof t === 'number' && t < state.teams && id !== pl.id) counts[t]++;
      });
      var min = 0; for (var j = 1; j < state.teams; j++) if (counts[j] < counts[min]) min = j;
      pl.team = min;
    }
    function reassignTeams() {
      var ids = leaderboardArr(state.players).map(function (p) { return p.id; });
      ids.forEach(function (id, i) { state.players[id].team = state.teams ? (i % state.teams) : null; });
    }
    function ensurePlayer(id, name) {
      if (!state.players[id]) {
        // ord = ordre d'arrivée, FIXE. Sert aux rotations (DJ, fredonneur) :
        // on ne doit JAMAIS se baser sur le classement, qui bouge à chaque point.
        var maxOrd = -1;
        Object.keys(state.players).forEach(function (k) { if (typeof state.players[k].ord === 'number' && state.players[k].ord > maxOrd) maxOrd = state.players[k].ord; });
        // played = manches où le joueur POUVAIT marquer (il n'était ni DJ ni fredonneur).
        // djTurns = nombre de titres passés aux commandes. Sert à l'équité du classement.
        // streak = bonnes réponses d'affilée (combo) ; jx2 / jsh = jokers restants.
        state.players[id] = { id: id, name: name || 'Joueur', score: 0, team: null, ord: maxOrd + 1,
                              played: 0, djTurns: 0, streak: 0, best: 0,
                              jx2: state.jokers ? 1 : 0, jsh: state.jokers ? 1 : 0 };
        if (state.teams) assignTeam(state.players[id]);
      } else if (name) state.players[id].name = name;
      return state.players[id];
    }
    /* Ordre STABLE (arrivée) pour les rotations — à ne pas confondre avec le classement. */
    function rotationArr() {
      return Object.keys(state.players)
        .map(function (k) { return state.players[k]; })
        .sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
    }

    /* Réception des intentions joueurs */
    function onIntent(p) {
      if (!p || !p.id) return;
      if (p.action === 'join') {
        ensurePlayer(p.id, p.name);
        beep(880, 0.08, 'sine');
        publish();
      } else if (p.action === 'buzz') {
        // Premier buzz reçu pendant la phase "buzzing" gagne.
        if (state.phase === 'buzzing' && !state.buzzer) {
          if (state.mode === 'fredonne' && state.source && state.source.id === p.id) return; // le fredonneur ne buzze pas
          if ((state.tried || []).indexOf(p.id) >= 0) return;                                 // déjà tenté sur cette manche
          if (state.dj && state.dj.id === p.id) return;                                        // le DJ du moment connaît la réponse
          var pl = ensurePlayer(p.id, p.name);
          state.buzzer = { id: pl.id, name: pl.name };
          state.phase = 'answering';
          dzPause(); // coupe l'extrait dès le buzz
          beep(180, 0.35, 'square'); vibrate([0, 120, 60, 120]);
          publish();
        }
      } else if (p.action === 'answer') {
        if (state.phase === 'answering' && state.buzzer && state.buzzer.id === p.id) {
          state.answer = String(p.text || '').slice(0, 120);
          // Chrono : temps entre l'ouverture du buzz et la réponse envoyée (info pour le DJ).
          if (state.buzzOpenAt) state.buzzMs = Date.now() - state.buzzOpenAt;
          state.suggest = (state.mode !== 'fredonne') ? fuzzyHit(state.answer, roundTrack, state.answerMode) : null;
          state.phase = (state.mode === 'fredonne') ? 'judging' : 'voting';
          state.voteAt = Date.now(); // départ du temps de vote des autres joueurs
          beep(520, 0.12, 'sine');
          publish();
        }
      } else if (p.action === 'joker') {
        // Un joker s'active AVANT de connaître le résultat, et une seule fois par manche.
        var jp = state.players[p.id];
        if (!jp || !state.jokers) return;
        if ((state.jok || {})[p.id]) return;                       // déjà un joker sur cette manche
        if (state.phase === 'reveal' || state.phase === 'ended' ||
            state.phase === 'turbo_reveal' || state.phase === 'year_reveal' || state.phase === 'lobby') return;
        if (p.kind === 'x2' && jp.jx2 > 0) { jp.jx2--; state.jok[p.id] = 'x2'; }
        else if (p.kind === 'sh' && jp.jsh > 0) { jp.jsh--; state.jok[p.id] = 'sh'; }
        else return;
        beep(920, 0.12, 'sine');
        publish();
      } else if (p.action === 'race') {
        // Mode Turbo : chacun envoie sa réponse, on horodate pour le barème vitesse.
        if (state.phase === 'racing' && !state.answers[p.id] && !(state.dj && state.dj.id === p.id)) {
          var rp = ensurePlayer(p.id, p.name);
          state.answers[p.id] = { name: rp.name, text: String(p.text || '').slice(0, 120), ms: Date.now() - (state.buzzOpenAt || Date.now()) };
          beep(660, 0.06, 'sine');
          // IMPORTANT : pas de publish() ici. Renvoyer tout l'état reconstruirait l'écran
          // des joueurs en train d'écrire et effacerait leur saisie. On met à jour l'hôte
          // localement et on envoie juste un accusé léger (utile au DJ + à l'auteur).
          persist(); renderHost();
          if (chan) chan.sendProgress({ count: Object.keys(state.answers).length, total: Object.keys(state.players).length, from: p.id, ms: state.answers[p.id].ms, name: rp.name });
        }
      } else if (p.action === 'vote') {
        if (state.phase === 'voting' && state.buzzer && state.buzzer.id !== p.id) {
          state.votes[p.id] = p.value === 1 ? 1 : -1;
          publish();
        }
      } else if (p.action === 'judge') {
        // Le fredonneur (mode Fredonne) OU le DJ de la série tranche depuis son téléphone.
        var isSource = state.source && state.source.id === p.id;
        var isDJ = state.dj && state.dj.id === p.id;
        if ((state.phase === 'judging' || state.phase === 'voting') && (isSource || isDJ)) {
          // Le DJ joint la fiche de SON morceau : on l'utilise pour la révélation.
          if (p.reveal && p.reveal.title) roundTrack = p.reveal;
          validate(p.correct === true, p.partial === true);
        }
      } else if (p.action === 'grade') {
        // Mode Turbo : le DJ corrige une réponse depuis son téléphone.
        if (state.phase === 'grading' && state.dj && state.dj.id === p.id && p.target) {
          state.grades[p.target] = p.g;
          publish();
        }
      } else if (p.action === 'closeRace') {
        if (state.phase === 'racing' && state.dj && state.dj.id === p.id) closeRacing();
      } else if (p.action === 'applyTurbo') {
        if (state.phase === 'grading' && state.dj && state.dj.id === p.id) {
          if (p.reveal && p.reveal.title) roundTrack = p.reveal;
          applyTurbo();
        }
      } else if (p.action === 'guess') {
        // Devine l'année : un joueur propose une année.
        if (state.phase === 'year_guess') {
          var gy = parseInt(p.year, 10);
          if (!isNaN(gy)) { ensurePlayer(p.id, p.name); state.guesses[p.id] = gy; beep(660, 0.06, 'sine'); publish(); }
        }
      } else if (p.action === 'leave') {
        // On garde le score (reconnexion possible) mais on peut nettoyer le lobby.
        publish();
      }
    }

    /* L'hôte fait partie des joueurs dès qu'il y a rotation DJ ou mode Fredonne :
       il joue comme les autres, sauf sur les manches où c'est lui le DJ / le fredonneur. */
    if (state.djRotate || state.mode === 'fredonne' || state.blind) ensurePlayer(ME, state.hostName);

    var chan = openChannel(code, { id: ME, name: state.hostName, role: 'host' }, {
      onIntent: onIntent,
      onReady: function () { publish(); },
      onPresence: function (st) {
        // Marque présents / absents pour l'affichage hôte (scores conservés).
        var present = {};
        Object.keys(st).forEach(function (k) { (st[k] || []).forEach(function (m) { present[m.id] = true; }); });
        state._present = present;
        renderHost();
      }
    });

    /* Actions hôte (machine à états) */
    function resetRound() {
      state.buzzer = null; state.answer = null; state.votes = {}; state.result = null; state.guesses = {}; state.year = null;
      state.reveal = null; state.suggest = null;
      state.buzzOpenAt = 0; state.buzzMs = null; state.voteAt = 0; state.tried = [];
      state.answers = {}; state.grades = {}; state.turboScores = null; state.jok = {};
    }
    function armBuzz() {
      state.phase = 'armed';
      state.buzzAt = Date.now() + BUZZ_LOCK_MS;
      publish();
      setTimeout(function () {
        if (state.phase === 'armed') {
          state.phase = 'buzzing'; state.buzzOpenAt = Date.now(); beep(740, 0.12, 'sine');
          if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview);
          publish();
        }
      }, BUZZ_LOCK_MS);
    }
    function launchRound() {
      state.round += 1;
      resetRound();
      /* ROUE DES DÉFIS : on tire le défi de la manche et on l'applique. */
      if (state.wheel) {
        var prev = state.challenge ? state.challenge.id : null;
        var c = pickChallenge(prev, Object.keys(state.players).length >= 2);
        state.challenge = { id: c.id, icon: c.icon, name: c.name, desc: c.desc, risky: !!c.risky };
        state.mode = c.mode;
        if (c.ans) state.answerMode = c.ans;
        state.mult = c.mult || 1;
        beep(880, 0.14, 'sine'); confetti(60);
      } else { state.challenge = null; state.mult = 1; }
      /* Rotation du DJ : tous les N titres, un joueur différent prend les commandes.
         Le DJ choisit le morceau → il connaît la réponse → il ne marque pas ce tour-ci. */
      if (state.djRotate) {
        var dids = rotationArr().map(function (p) { return p.id; }); // ordre d'arrivée, stable
        if (dids.length) {
          var dEvery = state.djEvery || 5;
          if (!state.dj || (state.djCount % dEvery === 0)) state._djIdx = state._djIdx + 1;
          var did = dids[state._djIdx % dids.length];
          state.dj = { id: did, name: state.players[did].name };
          state.djCount = (state.djCount || 0) + 1;
        }
      } else { state.dj = null; }

      if (state.mode === 'fredonne') {
        var ids = rotationArr().map(function (p) { return p.id; }); // ordre d'arrivée, stable
        if (!ids.length) { toast('Aucun joueur pour fredonner', 'err'); state.round -= 1; state.phase = 'lobby'; publish(); return; }
        var every = state.fredEvery || 10;
        // On change de fredonneur seulement tous les "every" morceaux.
        if (!state.source || (state.fredCount % every === 0)) state._srcIdx = state._srcIdx + 1;
        var sid = ids[state._srcIdx % ids.length];
        state.source = { id: sid, name: state.players[sid].name };
        state.fredCount = (state.fredCount || 0) + 1;
      } else {
        state.source = null;
      }

      /* ÉQUITÉ : on comptabilise, pour chaque joueur, s'il pouvait marquer sur ce titre.
         Celui qui est aux commandes (DJ ou fredonneur) ne peut pas → il ne doit pas être
         pénalisé au classement final (voir fairScore()). */
      Object.keys(state.players).forEach(function (pid) {
        var atControls = (state.dj && state.dj.id === pid) || (state.source && state.source.id === pid);
        var pl = state.players[pid];
        if (atControls) pl.djTurns = (pl.djTurns || 0) + 1;
        else pl.played = (pl.played || 0) + 1;
      });

      if (state.mode === 'year') { state.phase = 'year_guess'; if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview); publish(); return; }
      if (state.mode === 'turbo') {
        // Tout le monde répond en même temps : le chrono démarre pour tous.
        state.phase = 'racing'; state.buzzOpenAt = Date.now();
        if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview);
        beep(740, 0.12, 'sine'); publish(); return;
      }
      armBuzz();
    }
    function hostBuzz() {
      if (state.phase === 'buzzing' && !state.buzzer && state.mode === 'fredonne' && (!state.source || state.source.id !== ME)) {
        var pl = ensurePlayer(ME, state.hostName);
        state.buzzer = { id: pl.id, name: pl.name };
        state.phase = 'answering';
        beep(180, 0.35, 'square'); vibrate([0, 120, 60, 120]);
        publish();
      }
    }
    function hostAnswer(text) {
      if (state.phase === 'answering' && state.buzzer && state.buzzer.id === ME) {
        state.answer = String(text || '').slice(0, 120);
        if (state.buzzOpenAt) state.buzzMs = Date.now() - state.buzzOpenAt;
        state.phase = (state.mode === 'fredonne') ? 'judging' : 'voting';
        state.voteAt = Date.now();
        publish();
      }
    }
    function revealYear(yr) {
      yr = parseInt(yr, 10);
      if (isNaN(yr) && roundTrack && roundTrack.year) yr = roundTrack.year;
      if (isNaN(yr)) { toast('Entre une année (ou choisis un morceau Deezer)', 'err'); return; }
      dzPause();
      if (roundTrack) { state.reveal = { title: roundTrack.title, artist: roundTrack.artist, cover: roundTrack.cover, year: roundTrack.year }; roundTrack = null; }
      state.year = yr;
      var best = Infinity;
      Object.keys(state.guesses).forEach(function (id) { var d = Math.abs(state.guesses[id] - yr); if (d < best) best = d; });
      var winners = [];
      Object.keys(state.guesses).forEach(function (id) {
        if (Math.abs(state.guesses[id] - yr) === best) {
          winners.push(id);
          var wp = state.players[id];
          if (wp) {
            var g = state.config.pointsBuzz * (state.mult || 1);
            if ((state.jok || {})[id] === 'x2') g *= 2;
            wp.streak = (wp.streak || 0) + 1;
            if (wp.streak > (wp.best || 0)) wp.best = wp.streak;
            if (state.combos && wp.streak >= 2) g += Math.min(wp.streak - 1, 3);
            wp.score += g;
          }
        }
      });
      state.result = { year: yr, winners: winners, best: best };
      state.phase = 'year_reveal';
      state.history.push({ round: state.round, year: yr });
      confetti(150); beep(880, 0.3, 'sine');
      publish();
    }
    function validate(correct, partial) {
      if (!state.buzzer) return;
      var b = state.players[state.buzzer.id];
      // partial = mode « Titre + Artiste » avec une seule des deux trouvée → points réduits.
      var gain = correct ? (partial ? Math.ceil(state.config.pointsBuzz / 2) : state.config.pointsBuzz) : state.config.pointsWrong;
      var combo = 0, jokerLbl = '';
      if (b) {
        // COMBO : bonnes réponses d'affilée → bonus croissant (+1, +2, +3 max)
        if (correct) {
          b.streak = (b.streak || 0) + 1;
          if (b.streak > (b.best || 0)) b.best = b.streak;
          if (state.combos && b.streak >= 2) { combo = Math.min(b.streak - 1, 3); gain += combo; }
        } else { b.streak = 0; }
        // JOKERS : ×2 double le gain, 🛡️ annule le malus
        // Défi « double points » / « mort subite » : le multiplicateur de la manche.
        var mlt = state.mult || 1;
        if (mlt > 1) {
          // En mort subite, le malus est doublé aussi ; sinon on ne double que les gains.
          if (correct || (state.challenge && state.challenge.risky)) gain *= mlt;
        }
        var jk = (state.jok || {})[b.id];
        if (jk === 'x2' && correct) { gain *= 2; jokerLbl = '🃏 ×2'; }
        else if (jk === 'sh' && !correct) { gain = 0; jokerLbl = '🛡️ protégé'; }
        b.score += gain;
      }
      // Le vote est un pari : bien juger rapporte, mal juger coûte.
      Object.keys(state.votes).forEach(function (vid) {
        var agreed = (state.votes[vid] === 1) === correct;
        if (!state.players[vid]) return;
        state.players[vid].score += agreed ? state.config.pointsVote : (state.config.pointsVoteWrong || 0);
      });
      state.result = { correct: correct, partial: !!partial, gain: gain, combo: combo, joker: jokerLbl, streak: b ? b.streak : 0 };
      dzPause();
      // Reste-t-il quelqu'un qui pourrait rebondir ? (si oui et réponse fausse, on ne révèle pas encore)
      var triedNow = (state.tried || []).concat(state.buzzer ? [state.buzzer.id] : []);
      var candidates = Object.keys(state.players).filter(function (id) {
        if (triedNow.indexOf(id) >= 0) return false;
        if (state.mode === 'fredonne' && state.source && state.source.id === id) return false;
        return true;
      });
      var canRebound = !correct && candidates.length > 0;
      if (roundTrack && !canRebound) { state.reveal = { title: roundTrack.title, artist: roundTrack.artist, cover: roundTrack.cover, year: roundTrack.year }; roundTrack = null; }
      state.phase = 'reveal';
      state.history.push({
        round: state.round, buzzer: state.buzzer, answer: state.answer,
        correct: correct, votes: tallyVotes()
      });
      beep(correct ? 880 : 160, 0.3, correct ? 'sine' : 'sawtooth');
      if (correct) confetti(150);
      publish();
    }
    /* Rebond : après une mauvaise réponse, on rouvre le buzz aux AUTRES joueurs
       (celui qui vient de se tromper ne peut pas retenter). Le 1er à répondre juste marque. */
    function reopenBuzz() {
      var prev = (state.buzzer && state.buzzer.id) || null;
      var tried = state.tried || [];
      if (prev && tried.indexOf(prev) < 0) tried.push(prev);
      state.tried = tried;
      state.buzzer = null; state.answer = null; state.votes = {}; state.result = null;
      state.suggest = null; state.buzzMs = null; state.voteAt = 0;
      state.phase = 'buzzing'; state.buzzOpenAt = Date.now();
      if (roundTrack && roundTrack.preview) dzPlay(roundTrack.preview);
      beep(740, 0.12, 'sine');
      publish();
    }
    /* ---- MODE TURBO : tout le monde répond, points sur 100 selon la vitesse ----
       Barème pensé pour garder tout le monde en jeu :
         • bonne réponse  = 60 pts garantis + jusqu'à 40 pts de bonus vitesse (max 100)
         • à moitié       = la moitié du total obtenu
         • faux / absent  = 0 (aucun malus : on reste motivé jusqu'au bout)
         • le tout 1er à répondre juste gagne +10 « éclair » (plafonné à 100) */
    function closeRacing() {
      dzPause();
      state.grades = {};
      Object.keys(state.answers).forEach(function (id) {
        var g = fuzzyHit(state.answers[id].text, roundTrack, state.answerMode);
        state.grades[id] = g || 'ko'; // pré-notation auto, l'hôte peut corriger
      });
      // Partie à l'aveugle : personne ne connaît la réponse, donc personne ne
      // corrige — l'app tranche seule et enchaîne directement sur les résultats.
      if (state.blind) { applyTurbo(); return; }
      state.phase = 'grading';
      publish();
    }
    function turboPoints() {
      var T = (state.turboSecs || 30) * 1000;
      var ids = Object.keys(state.answers);
      var goodSorted = ids.filter(function (id) { return state.grades[id] === 'ok' || state.grades[id] === 'half'; })
        .sort(function (a, b) { return state.answers[a].ms - state.answers[b].ms; });
      var first = goodSorted[0];
      var out = {};
      ids.forEach(function (id) {
        var g = state.grades[id], a = state.answers[id], pl = state.players[id];
        var jk = (state.jok || {})[id];
        if (g !== 'ok' && g !== 'half') {
          if (pl) pl.streak = 0;
          out[id] = { pts: 0, name: a.name, ms: a.ms, grade: g, joker: jk === 'sh' ? '🛡️' : '' };
          return;
        }
        var speed = Math.max(0, 1 - (a.ms / T));           // 1 = instantané, 0 = fin de fenêtre
        var pts = 60 + Math.round(40 * speed);              // 60 → 100
        if (id === first) pts = Math.min(100, pts + 10);    // bonus éclair au 1er juste
        if (g === 'half') pts = Math.round(pts / 2);        // une seule des deux trouvée
        // COMBO : +5 pts par cran de série (max +15), à l'échelle du barème /100
        var cb = 0;
        if (pl) {
          pl.streak = (pl.streak || 0) + 1;
          if (pl.streak > (pl.best || 0)) pl.best = pl.streak;
          if (state.combos && pl.streak >= 2) { cb = Math.min(pl.streak - 1, 3) * 5; pts += cb; }
        }
        if ((state.mult || 1) > 1) pts *= state.mult;   // défi « Turbo doublé »
        var jlbl = '';
        if (jk === 'x2') { pts *= 2; jlbl = '🃏×2'; }
        out[id] = { pts: pts, name: a.name, ms: a.ms, grade: g, first: id === first,
                    combo: cb, streak: pl ? pl.streak : 0, joker: jlbl };
      });
      return out;
    }
    function applyTurbo() {
      var res = turboPoints();
      Object.keys(res).forEach(function (id) { if (state.players[id]) state.players[id].score += res[id].pts; });
      state.turboScores = res;
      if (roundTrack) { state.reveal = { title: roundTrack.title, artist: roundTrack.artist, cover: roundTrack.cover, year: roundTrack.year }; roundTrack = null; }
      state.phase = 'turbo_reveal';
      state.history.push({ round: state.round, turbo: res });
      confetti(180); beep(880, 0.3, 'sine');
      publish();
    }
    function endGame() { dzPause(); state.phase = 'ended'; confetti(240); archiveGame(state, state.code, state.hostName); publish(); }
    function replay() {
      Object.keys(state.players).forEach(function (id) {
        var p = state.players[id];
        p.score = 0; p.played = 0; p.djTurns = 0; p.streak = 0; p.best = 0;
        p.jx2 = state.jokers ? 1 : 0; p.jsh = state.jokers ? 1 : 0;
      });
      state.round = 0; state.phase = 'lobby'; state._srcIdx = -1; state.fredCount = 0; state.source = null;
      state._djIdx = -1; state.djCount = 0; state.dj = null;
      dzPause(); roundTrack = null;
      resetRound(); state.history = [];
      publish();
    }
    function tallyVotes() {
      var up = 0, down = 0;
      Object.keys(state.votes).forEach(function (k) { state.votes[k] === 1 ? up++ : down++; });
      return { up: up, down: down };
    }

    /* Sélecteur de morceau Deezer (overlay) */
    var pickerEl = document.getElementById('picker');
    function closePicker() { if (pickerEl) { pickerEl.classList.add('hidden'); pickerEl.innerHTML = ''; } dzPause(); }
    function openMusicPicker() {
      if (!pickerEl) return;
      var lastResults = [];
      function render(results, q, loading) {
        var list = '';
        if (loading) list = '<p class="text-white/50 text-center py-6">Recherche…</p>';
        else if (results === null) list = '<p class="text-rose-400 text-center py-6">Erreur réseau, réessaie.</p>';
        else if (results && results.length) {
          list = results.map(function (t, i) {

            return '<div class="dz-card mb-2">'

              + (canPlayInApp()
                  ? '<button class="dzPrev px-3 py-2 rounded-lg glass text-sm" data-i="' + i + '" title="Pré-écouter">▶</button>'
                  : '<button class="dzOpen px-3 py-2 rounded-lg glass text-sm" data-i="' + i + '" title="Ouvrir dans ' + esc(platform().name) + '">' + platform().icon + '↗</button>')
              + '<button class="dzPick px-3 py-2 rounded-lg bg-neon-lime text-black font-bold text-sm" data-i="' + i + '">' + (canPlayInApp() ? 'Choisir' : 'Valider') + '</button>'
              + '</div>';

        } else if (results) list = '<p class="text-white/40 text-center py-6">Aucun résultat.</p>';
        pickerEl.innerHTML = [
          '<div class="set-panel p-5 animate-slidein">',

          (canPlayInApp() ? '' : '  <p class="text-white/50 text-xs mb-2">Cherche le titre que tu vas lancer sur ' + esc(platform().name) + ' : il restera caché et servira à la révélation + correction auto.</p>'),

          '</div>'
        ].join('');
        pickerEl.classList.remove('hidden');
        pickerEl.onclick = function (e) { if (e.target === pickerEl) closePicker(); };
        bind('#dzClose', closePicker);
        var go = function () { var q2 = ($('#dzq') || {}).value || ''; render(null, q2, true); musicSearch(q2, function (res) { lastResults = (res && res.length) ? res : (res === null ? null : []); render(lastResults, q2, false); }); };
        bind('#dzgo', go);
        var qi = $('#dzq'); if (qi) qi.onkeydown = function (e) { if (e.key === 'Enter') go(); };
        Array.prototype.forEach.call(pickerEl.querySelectorAll('.dzPrev'), function (b) { b.onclick = function () { var t = lastResults[+b.getAttribute('data-i')]; if (t) dzPlay(t.preview); }; });
        // Ouvre le morceau dans la plateforme du DJ (Spotify, YT Music…) pour qu'il le lance sur l'enceinte.
        Array.prototype.forEach.call(pickerEl.querySelectorAll('.dzOpen'), function (b) {

            window.open(p.url(t.title + ' ' + (t.artist ? t.artist.name : '')), '_blank', 'noopener');
          };
        });
        Array.prototype.forEach.call(pickerEl.querySelectorAll('.dzPick'), function (b) {
          b.onclick = function () {
            var t = lastResults[+b.getAttribute('data-i')]; if (!t) return;

            fillYear(t, roundTrack, renderHost);
            closePicker(); toast('Morceau prêt 🔒', 'ok'); renderHost();
          };
        });
        if (qi && !q) qi.focus();
      }
      var initQ = state.theme || '';
      render([], initQ, false);
      if (initQ) { render(null, initQ, true); musicSearch(initQ, function (res) { lastResults = res || []; render(lastResults, initQ, false); }); }
    }

    /* Panneau « Inviter / faire revenir un joueur » — accessible à TOUT MOMENT.

      var url = origin2 + '#join=' + state.code;

        '  <p class="text-white/60 text-sm mb-3">Fais scanner ce QR (ou donne le code) pour rejoindre — même en pleine partie. Les points sont conservés.</p>',

        (away.length
          ? '  <div class="mt-5 text-left"><p class="text-xs font-bold uppercase text-white/50 mb-2">Joueurs déconnectés</p>'
            + away.map(function (p) { return '<div class="flex items-center gap-2 rounded-xl px-3 py-2 bg-black/25 mb-2"><span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold" style="background:' + avatarGrad(p.name) + '">' + esc(initials(p.name)) + '</span><span class="flex-1 font-bold text-sm truncate">' + esc(p.name) + '</span><span class="text-neon-gold font-extrabold">' + p.score + '</span></div>'; }).join('')
            + '<p class="text-white/40 text-xs">Ils gardent leur score : qu\'ils rescannent le QR avec le même pseudo pour reprendre leur place.</p></div>'
          : '  <p class="text-white/40 text-xs mt-4">Tous les joueurs sont connectés ✓</p>'),
        '</div>'
      ].join('');
      el.classList.remove('hidden');
      el.onclick = function (e) { if (e.target === el) closePicker(); };
      if (window.QRCode) QRCode.toCanvas($('#ivqr'), url, { width: 168, margin: 1, color: { dark: '#0b0014', light: '#ffffff' } }, function () {});
      bind('#ivClose', closePicker);
      bind('#ivCopy', function () { if (navigator.clipboard) navigator.clipboard.writeText(url); toast('Lien copié !', 'ok'); });
      bind('#ivShare', function () {
        if (navigator.share) navigator.share({ title: 'Blind Test', text: 'Rejoins la partie (code ' + state.code + ')', url: url }).catch(function () {});
        else { if (navigator.clipboard) navigator.clipboard.writeText(url); toast('Lien copié !', 'ok'); }
      });
    }

    // Rafraîchit l'écran hôte chaque seconde pendant le vote (compte à rebours vivant).
    // Décompte du vote : on met à jour UNIQUEMENT le chiffre affiché.
    // (Reconstruire tout l'écran chaque seconde était inutilement coûteux.)
    var voteTick = setInterval(function () {
      if (document.hidden) return;
      if (state.phase === 'voting') {
        var el = document.getElementById('voteLeft');
        if (!el) return;
        var secs = (state.config && state.config.voteSecs) || 10;
        var left = state.voteAt ? Math.max(0, Math.ceil((state.voteAt + secs * 1000 - Date.now()) / 1000)) : 0;
        if (el.textContent !== String(left)) el.textContent = left;
        if (left === 0) renderHost(); // fin du décompte : on débloque les boutons
      } else if (state.phase === 'racing' && state.buzzOpenAt) {
        // Turbo : la fenêtre de réponse est celle qui sert au calcul des points.
        var T = (state.turboSecs || 30) * 1000;
        var rl = Math.max(0, Math.ceil((state.buzzOpenAt + T - Date.now()) / 1000));
        var rel = document.getElementById('raceLeft');
        if (rel && rel.textContent !== String(rl)) rel.textContent = rl;
        if (rl === 0) closeRacing(); // temps écoulé → on passe à la correction
      }
    }, 1000);

    /* Gestion d'un joueur : corriger son score, le renommer, l'exclure.
       Indispensable en soirée réelle (erreur de validation, faute de frappe…). */
    function openPlayerAdmin(pid) {
      var el = document.getElementById('picker'); if (!el) return;

        '<div class="set-panel p-5 animate-slidein">',

        '  <div class="flex items-center gap-3 mb-4"><span class="w-12 h-12 rounded-full flex items-center justify-center font-extrabold" style="background:' + avatarGrad(p.name) + '">' + esc(initials(p.name)) + '</span>',
        '    <div class="flex-1 min-w-0"><input id="paName" value="' + esc(p.name) + '" maxlength="20" class="w-full bg-black/40 rounded-lg px-3 py-2 font-bold outline-none focus:ring-2 ring-neon-cyan" />',
        '    <div class="text-white/40 text-xs mt-1">' + (p.played || 0) + ' titre(s) jouable(s) · ' + (p.djTurns || 0) + ' en DJ</div></div></div>',
        '  <div class="glass rounded-2xl p-4 text-center mb-4">',
        '    <div class="text-white/50 text-xs uppercase font-bold mb-1">Score</div>',
        '    <div class="text-5xl font-extrabold text-neon-gold mb-3">' + p.score + '</div>',
        '    <div class="grid grid-cols-4 gap-2">',
        '      <button class="paAdj py-3 rounded-xl bg-rose-500/80 font-extrabold" data-d="-5">−5</button>',
        '      <button class="paAdj py-3 rounded-xl bg-rose-500/60 font-extrabold" data-d="-1">−1</button>',
        '      <button class="paAdj py-3 rounded-xl bg-neon-lime/70 text-black font-extrabold" data-d="1">+1</button>',
        '      <button class="paAdj py-3 rounded-xl bg-neon-lime text-black font-extrabold" data-d="5">+5</button>',
        '    </div>',
        '  </div>',
        '  <div class="grid grid-cols-2 gap-2">',
        '    <button id="paSave" class="py-3 rounded-xl bg-gradient-to-r from-neon-pink to-neon-violet font-extrabold">Enregistrer</button>',

        '</div>'
      ].join('');
      el.classList.remove('hidden');
      el.onclick = function (e) { if (e.target === el) closePicker(); };
      bind('#paClose', closePicker);
      Array.prototype.forEach.call(el.querySelectorAll('.paAdj'), function (b) {
        b.onclick = function () {
          p.score += parseInt(b.getAttribute('data-d'), 10) || 0;

        };
      });
      bind('#paSave', function () {
        var v = ($('#paName') || {}).value;
        if (v && v.trim()) p.name = v.trim().slice(0, 20);
        publish(); closePicker(); toast('Joueur mis à jour', 'ok');
      });
      bind('#paKick', function () {
        if (!confirm('Retirer ' + p.name + ' de la partie ? Son score sera perdu.')) return;
        delete state.players[pid];
        if (state.dj && state.dj.id === pid) state.dj = null;
        if (state.source && state.source.id === pid) state.source = null;
        publish(); closePicker(); toast('Joueur retiré', 'info');

    current = {
      destroy: function () { if (chan) chan.close(); dzPause(); clearInterval(voteTick); }
    };

    /* --- Rendu de l'écran hôte --- */
    function renderHost() {
      var s = state;

      var fair = fairInfo(s.players);
      // En fin de partie, on classe à l'équitable (chacun ramené au même nombre d'occasions).
      var lb = (s.phase === 'ended' && !fair.balanced) ? leaderboardFair(s.players, fair) : leaderboardArr(s.players);
      var fairArg = (s.phase === 'ended' && !fair.balanced) ? fair : null;
      var present = s._present || {};

      var THEME_PRESETS = ['Années 80', 'Années 90', 'Années 2000', 'Disney', 'Rap FR', 'Variété FR', 'Rock', 'Films', 'Séries TV', 'Dessins animés', 'Été', 'Karaoké'];
      var showTheme = (s.phase === 'lobby' || s.phase === 'reveal' || s.phase === 'year_reveal');
      var themeBar = [
        '<div class="glass rounded-2xl p-3 mb-4">',
        '  <div class="flex items-center justify-between mb-2"><span class="text-xs font-bold uppercase text-white/50">🎯 Thème de la manche</span>' + (s.theme ? '<button id="themeClear" class="text-xs text-white/40 underline">effacer</button>' : '') + '</div>',
        '  <div class="flex gap-2 overflow-x-auto pb-1">' + THEME_PRESETS.map(function (t) { return '<button class="themeChip shrink-0 px-3 py-1.5 rounded-full text-sm font-bold ' + (s.theme === t ? 'bg-neon-pink text-white' : 'bg-black/30 text-white/70') + '" data-theme="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div>',
        '  <input id="themeFree" value="' + esc(s.theme || '') + '" placeholder="…ou tape un thème libre" class="w-full mt-2 bg-black/40 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 ring-neon-cyan" />',
        '</div>'
      ].join('');

      var MODES = [{ id: 'classic', name: '🔊 Classique' }, { id: 'turbo', name: '⚡ Turbo' }, { id: 'fredonne', name: '🎶 Fredonne' }, { id: 'year', name: '📅 Année' }];
      var modeBar = [
        '<div class="glass rounded-2xl p-3 mb-4">',

        '  <div class="text-xs mt-2 ' + (isTurbo ? 'text-neon-lime' : 'text-white/45') + '">' + (isTurbo
             ? '⚡ Points à la vitesse : 60 garantis + jusqu\'à 40 de rapidité (+10 au plus rapide) · pas de malus, pas de vote'
             : '🏆 ' + (s.config.pointsBuzz >= 0 ? '+' : '') + s.config.pointsBuzz + ' bonne · ' + s.config.pointsWrong + ' mauvaise · +' + s.config.pointsVote + ' bon vote · ' + (s.config.pointsVoteWrong || 0) + ' mauvais vote') + '</div>',
        '  <button id="wheelToggle" class="w-full mt-2 py-2 rounded-xl text-sm font-extrabold ' + (s.wheel ? 'bg-gradient-to-r from-neon-pink to-neon-violet text-white' : 'bg-black/30 text-white/60') + '">🎡 Roue des défis : ' + (s.wheel ? 'ON' : 'OFF') + '</button>',
        '  <div class="text-xs font-bold uppercase text-white/50 mt-3 mb-2">👥 Équipes</div>',
        '  <div class="grid grid-cols-4 gap-2">' + [0, 2, 3, 4].map(function (n) { return '<button class="teamChip py-2 rounded-xl text-sm font-bold ' + (s.teams === n ? 'bg-neon-cyan text-black' : 'bg-black/30 text-white/70') + '" data-teams="' + n + '">' + (n === 0 ? 'Off' : n) + '</button>'; }).join('') + '</div>',
        '</div>'
      ].join('');

      var isFred = s.mode === 'fredonne', isYear = s.mode === 'year', isTurbo = s.mode === 'turbo';
      var modeIcon = isYear ? '📅' : isFred ? '🎶' : isTurbo ? '⚡' : '🎵';
      var fredEvery = s.fredEvery || 10;
      var fredTag = (isFred && s.fredCount) ? ' · chanson ' + (((s.fredCount - 1) % fredEvery) + 1) + '/' + fredEvery : '';

      // Lecteur Deezer (modes à enceinte uniquement)
      var deezerOn = prefs.deezer && (s.mode === 'classic' || s.mode === 'year' || s.mode === 'turbo');
      var prepPhase = (s.phase === 'lobby' || s.phase === 'reveal' || s.phase === 'year_reveal' || s.phase === 'turbo_reveal');
      // Si la manche est lancée sans morceau choisi, on DOIT pouvoir en choisir un
      // en cours de route — sinon l'hôte se retrouve bloqué sans rien à jouer.
      var missingTrack = canPlayInApp() && !roundTrack && s.phase !== 'ended';
      var showTrackUI = prepPhase || missingTrack;
      var dzBar = '';
      if (deezerOn && showTrackUI) {
        var plays = canPlayInApp();
        var curPl = autoPl ? playlistById(autoPl) : null;
        // D'où sort la musique (modifiable en pleine partie)
        // En partie à l'aveugle, l'app gère tout : ni sélection ni playlist à proposer.
        if (s.blind) {
          dzBar = '<div class="glass rounded-2xl p-3 mb-3 text-center">'
            + '<div class="text-xs font-bold uppercase text-white/50">🕶️ Partie à l\'aveugle</div>'
            + '<div class="font-extrabold mt-0.5">' + (curPl ? curPl.icon + ' ' + esc(curPl.name) : 'Playlist') + ' · manche ' + Math.max(1, s.round) + '/' + (s.goalVal || 10) + '</div>'
            + '<div class="text-white/45 text-xs mt-1">Personne ne connaît la réponse — l\'app choisit, joue et corrige.</div></div>';
        } else {
        // Le choix de la source sonore ne sert qu'au réglage : discret hors du salon.
        dzBar = (s.phase === 'lobby')
          ? '<button id="audioToggle" class="w-full py-2.5 rounded-xl text-sm font-bold mb-3 ' + (plays ? 'bg-neon-violet text-white' : 'bg-black/30 text-white/70') + '">'
            + (plays ? '📱 Musique jouée par l\'app' : '🔊 Son depuis une source à part') + ' · changer</button>'
          : '';
        // Playlist automatique : l'app enchaîne les morceaux toute seule.
        dzBar += '<div class="glass rounded-2xl p-3 mb-3">'
          + '<div class="flex items-center justify-between mb-2"><span class="text-xs font-bold uppercase text-white/50">📻 Playlist auto</span>'
          + (curPl ? '<button id="plOff" class="text-xs text-white/40 underline">désactiver</button>' : '') + '</div>'
          + (curPl
              ? '<div class="flex items-center gap-2"><span class="px-3 py-1.5 rounded-full bg-neon-violet text-white text-sm font-bold">' + curPl.icon + ' ' + esc(curPl.name) + '</span>'
                + '<span class="text-white/40 text-xs flex-1">' + playedIds.length + ' morceau(x) joué(s)</span>'
                + '<button id="plSkip" class="px-3 py-1.5 rounded-lg glass text-xs font-bold">↻ Autre</button></div>'
              : '<div class="flex gap-2 overflow-x-auto pb-1">' + PLAYLISTS.map(function (p) {
                  return '<button class="plChip shrink-0 px-3 py-1.5 rounded-full text-sm font-bold bg-black/30 text-white/75" data-pl="' + p.id + '">' + p.icon + ' ' + esc(p.name) + '</button>';
                }).join('') + '</div>')
          + (curPl && s.phase === 'lobby' ? '<p class="text-white/40 text-xs mt-2">L\'app choisit le morceau suivant automatiquement — tu n\'as plus qu\'à lancer.</p>' : '')
          + '</div>';
        // Entre deux manches, la playlist active tient en une ligne discrète.
        if (curPl && s.phase !== 'lobby') {
          dzBar = '<div class="flex items-center gap-2 mb-3 text-xs text-white/45"><span class="px-2.5 py-1 rounded-full bg-neon-violet/30 font-bold text-white/80">' + curPl.icon + ' ' + esc(curPl.name) + '</span>'
            + '<span>' + playedIds.length + ' joué(s)</span>'
            + '<button id="plOff" class="ml-auto underline">changer de playlist</button></div>';
        }
        // Si le lecteur intégré est affiché, il tient déjà lieu de carte morceau :
        // on n'affiche pas deux fois le même titre (et on ne le dévoile pas).
        dzBar += (canPlayInApp() && roundTrack) ? '' : '<div class="glass rounded-2xl p-3 mb-4">' + (roundTrack
          ? '<div class="flex items-center gap-3"><img src="' + esc(roundTrack.cover) + '" class="w-12 h-12 rounded-lg object-cover" alt="" /><div class="flex-1 min-w-0"><div class="text-xs text-neon-lime font-bold">' + (roundTrack.auto ? '📻 Choisi automatiquement (caché)' : '🔒 Réponse enregistrée (cachée)') + '</div><div class="font-bold truncate text-sm">' + esc(roundTrack.title) + '</div><div class="text-white/50 text-xs truncate">' + esc(roundTrack.artist) + '</div></div><button id="dzopen" class="px-3 py-2 rounded-lg glass text-sm shrink-0">Changer</button></div>'
          : '<button id="dzopen" class="w-full py-3 rounded-xl bg-gradient-to-r from-neon-cyan to-neon-lime text-black font-extrabold">🔎 ' + (plays ? 'Choisir un morceau' : 'Enregistrer la réponse du titre') + '</button>'
            + '<p class="text-white/40 text-xs mt-2 text-center">' + (plays
                ? 'Extraits fournis par l\'app — <b>aucun compte ni abonnement</b> requis.'
                : 'Tu lances la musique depuis ' + esc(platform().name) + ' — ceci sert à révéler le titre et corriger automatiquement.') + '</p>') + '</div>';
        } // fin du cas « partie normale »
      }
      var dzCtrl = '';
      // Lecteur chez l'hôte s'il n'y a pas de DJ tournant OU si c'est lui le DJ.
      var hostPlays = !s.dj || s.dj.id === ME;
      if (roundTrack && canPlayInApp() && hostPlays && s.phase !== 'ended') {
        // Lecteur intégré unique : titre MASQUÉ (l'écran est souvent visible de tous),
        // bouton 👁 pour vérifier, 🔄 pour changer de morceau.
        // À l'aveugle, l'hôte joue aussi : le morceau doit rester secret pour lui.
        dzCtrl = s.blind ? playerBar(roundTrack, { blind: true }) : playerBar(roundTrack, { onChange: true });
      } else if (false) {
        dzCtrl = '<div class="glass rounded-2xl p-3 mb-4 flex items-center gap-2">'
          + '<button id="dzToggle" class="px-3 py-2 rounded-lg glass">⏯️</button>'
          + '<button id="dzReplay" class="px-3 py-2 rounded-lg glass text-sm">🔁 Rejouer</button>'
          + '<span class="text-white/40 text-xs ml-1">🔊</span>'

          + '</div>';

      var phaseBlock = '';
      if (s.phase === 'lobby') {

                '<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs ' + (on ? 'bg-neon-cyan text-black' : 'bg-white/10') + '">' + esc(initials(p.name)) + '</span>' +

          '  <button id="copyLink" class="mt-4 text-sm text-white/60 underline">Copier le lien d\'invitation</button>',
