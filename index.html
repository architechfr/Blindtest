  <style>
    :root { --bt-max: 480px; }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    html { background: #05000a; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #05000a;
      overscroll-behavior: none;
    }

    /* ====================== DÉCOR SYNTHWAVE (fixe, derrière tout) ====================== */
    .bt-bg { position: fixed; inset: 0; z-index: -2; overflow: hidden;
      background: linear-gradient(180deg,
        #05000a 0%, #0c0530 20%, #2a0a55 38%, #6a1670 52%, #c01f7a 60%,
        #ff486b 63%, #ff9a3c 65%, #1c0738 65%, #0a0118 100%); }
    .bt-stars { position: absolute; inset: 0 0 38% 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, #fff, transparent),
        radial-gradient(1px 1px at 70% 18%, #fff, transparent),
        radial-gradient(1px 1px at 45% 50%, #ffd9f3, transparent),
        radial-gradient(1px 1px at 85% 40%, #fff, transparent),
        radial-gradient(1px 1px at 12% 60%, #cfeeff, transparent),
        radial-gradient(1px 1px at 60% 65%, #fff, transparent);
      opacity: .8; }
    .bt-sun { position: absolute; left: 50%; top: 64%; transform: translate(-50%, -100%);
      width: min(62vw, 320px); height: min(62vw, 320px); border-radius: 50%;
      background: linear-gradient(180deg, #fff6b0 0%, #ffd23f 28%, #ff7a3d 55%, #ff2e9a 82%, #b3146e 100%);
      box-shadow: 0 0 90px 22px rgba(255,90,140,.5), 0 0 160px 40px rgba(255,138,0,.25); }
    .bt-sun::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: repeating-linear-gradient(180deg, transparent 0 16px, #1c0738 16px 22px);
      -webkit-mask: linear-gradient(180deg, transparent 46%, #000 46%);
              mask: linear-gradient(180deg, transparent 46%, #000 46%); }
    .bt-grid { position: absolute; left: -60%; right: -60%; top: 65%; bottom: -25%;
      background-image:
        linear-gradient(to right, rgba(34,211,238,.55) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(255,46,154,.5) 1.5px, transparent 1.5px);
      background-size: 44px 44px;
      transform: perspective(320px) rotateX(64deg); transform-origin: 50% 0;
      animation: btgrid 1.6s linear infinite;
      -webkit-mask: linear-gradient(180deg, #000 0%, transparent 88%);
              mask: linear-gradient(180deg, #000 0%, transparent 88%); }
    @keyframes btgrid { from { background-position: 0 0; } to { background-position: 0 44px; } }
    @media (prefers-reduced-motion: reduce) { .bt-grid { animation: none; } }

    /* Voile scanlines CRT + vignette */
    .bt-scan { position: fixed; inset: 0; z-index: 60; pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
      opacity: .28; }
    .bt-vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 80% at 50% 35%, transparent 55%, rgba(0,0,0,.55) 100%); }

    /* ============ ÉCRAN DE CRÉATION : LISIBILITÉ ============
       Ce formulaire est long et dense, et il était posé À MÊME LE DÉCOR : le soleil
       clair, la bande orange et la grille animée passaient derrière du texte gris fin
       (text-white/40 en text-xs). Illisible en soirée, à bout de bras.
       On pose donc une surface sombre stable, on remonte les contrastes et on
       grossit les explications. Réglé ici, par écran, plutôt que sur la trentaine de
       chaînes concernées : l'écran reste d'un seul tenant et rien d'autre ne bouge.
       Pas de backdrop-filter (cf. le piège batterie) : un fond opaque suffit. */
    .bt-setup { background: rgba(6,1,16,.93); border-radius: 20px;
      border: 1px solid rgba(255,255,255,.10); box-shadow: 0 12px 44px rgba(0,0,0,.6); }
    .bt-setup .text-xs { font-size: .8125rem; line-height: 1.5; }
    .bt-setup [class*="text-white/35"], .bt-setup [class*="text-white/40"],
    .bt-setup [class*="text-white/45"] { color: rgba(255,255,255,.74) !important; }
    .bt-setup [class*="text-white/50"], .bt-setup [class*="text-white/55"] { color: rgba(255,255,255,.82) !important; }
    .bt-setup [class*="text-white/60"], .bt-setup [class*="text-white/65"],
    .bt-setup [class*="text-white/70"], .bt-setup [class*="text-white/75"] { color: rgba(255,255,255,.9) !important; }
    .bt-setup .opacity-80 { opacity: .95; }
    /* Boutons non sélectionnés : bg-black/30 laissait remonter le décor derrière le texte. */
    .bt-setup [class*="bg-black/30"] { background-color: rgba(0,0,0,.58); }

    /* ====================== CADRE "APP MOBILE" ====================== */
    #app { position: relative; z-index: 1; width: 100%; max-width: var(--bt-max);
      margin: 0 auto; min-height: 100dvh;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    @media (min-width: 540px) {
      #app { min-height: min(900px, 94dvh); margin: 3dvh auto;
        border-radius: 34px; overflow: hidden;
        background: rgba(8,2,20,.45); backdrop-filter: blur(3px);
        box-shadow: 0 0 0 2px rgba(34,211,238,.30), 0 0 0 7px rgba(8,2,20,.6),
                    0 0 70px rgba(255,46,154,.28), 0 36px 90px rgba(0,0,0,.6); }
    }

    /* ====================== UTILITAIRES NÉON ====================== */
    /* Pas de backdrop-filter ici : appliqué à chaque carte, c'est le plus gros
       consommateur GPU sur mobile (flou recalculé à chaque frame). Le dégradé
       opaque donne le même rendu pour un coût quasi nul. */
    .glass { background: linear-gradient(180deg, rgba(40,12,66,.72), rgba(10,3,26,.82));
      border: 1px solid rgba(34,211,238,.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 26px rgba(34,211,238,.08); }
    .text-glow { text-shadow: 0 0 16px rgba(255,46,154,.7), 0 0 38px rgba(255,46,154,.35); }
    .glow-cyan { text-shadow: 0 0 14px rgba(34,211,238,.75), 0 0 30px rgba(34,211,238,.4); }
    .bt-logo { font-family: "Audiowide", system-ui, sans-serif; letter-spacing: .04em;
      background: linear-gradient(180deg, #fff 0%, #ffe7fb 38%, #ff7ad0 62%, #22d3ee 63%, #18a9c7 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 0 rgba(255,46,154,.6)) drop-shadow(0 0 22px rgba(34,211,238,.45)); }
    .bt-title { font-family: "Orbitron", system-ui, sans-serif; }

    /* Boutons : ressenti tactile + halo néon sur les CTA dégradés */
    button { transition: transform .12s ease, box-shadow .2s ease, filter .2s ease; }
    button:active { transform: translateY(1px) scale(.985); }
    .btn-glow { box-shadow: 0 0 26px rgba(255,46,154,.45), inset 0 0 0 1px rgba(255,255,255,.12); }
    .btn-glow-cyan { box-shadow: 0 0 26px rgba(34,211,238,.45), inset 0 0 0 1px rgba(255,255,255,.12); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(34,211,238,.25); border-radius: 8px; }
    input { font-size: 16px; } /* évite le zoom auto iOS */

    /* Confettis (canvas plein écran) */
    #confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }

    /* ====================== THÈMES DE COULEUR ====================== */
    body[data-theme="miami"] .bt-bg { background: linear-gradient(180deg,#03252e 0%,#063b46 22%,#0b6b6b 40%,#16a3a3 52%,#27d3c4 58%,#ff6ad5 63%,#ffd23f 65%,#06212b 65%,#03141a 100%); }
    body[data-theme="miami"] .bt-sun { background: linear-gradient(180deg,#fff1c2,#ffd23f 28%,#ff6ad5 60%,#a21caf 100%); }
    body[data-theme="miami"] .bt-grid { background-image: linear-gradient(to right,rgba(45,212,191,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(255,106,213,.5) 1.5px,transparent 1.5px); }

    body[data-theme="outrun"] .bt-bg { background: linear-gradient(180deg,#1a0524 0%,#3b0a3f 24%,#7a1340 44%,#c01f3a 56%,#ff5e3a 62%,#ffb43d 65%,#1a0820 65%,#0a0410 100%); }
    body[data-theme="outrun"] .bt-sun { background: linear-gradient(180deg,#fff3b0,#ffd23f 25%,#ff7a3d 55%,#ff2e3a 100%); }
    body[data-theme="outrun"] .bt-grid { background-image: linear-gradient(to right,rgba(255,138,0,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(255,60,90,.5) 1.5px,transparent 1.5px); }

    body[data-theme="ice"] .bt-bg { background: linear-gradient(180deg,#02061a 0%,#071233 24%,#0b2a6b 44%,#1455c0 56%,#3aa0ff 62%,#9fe3ff 65%,#04122e 65%,#020816 100%); }
    body[data-theme="ice"] .bt-sun { background: linear-gradient(180deg,#ffffff,#cfeeff 30%,#5fb6ff 60%,#1455c0 100%); }
    body[data-theme="ice"] .bt-grid { background-image: linear-gradient(to right,rgba(125,211,252,.65) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(37,99,235,.5) 1.5px,transparent 1.5px); }

    body[data-theme="galaxy"] .bt-bg { background: linear-gradient(180deg,#05010f 0%,#140531 26%,#3b1080 46%,#6d28d9 56%,#a21caf 62%,#ec4899 65%,#0f0524 65%,#05010f 100%); }
    body[data-theme="galaxy"] .bt-sun { background: linear-gradient(180deg,#f5d0fe,#c084fc 30%,#a21caf 60%,#6d28d9 100%); }
    body[data-theme="galaxy"] .bt-grid { background-image: linear-gradient(to right,rgba(139,92,246,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(236,72,153,.5) 1.5px,transparent 1.5px); }

    body[data-theme="mint"] .bt-bg { background: linear-gradient(180deg,#04201f 0%,#073b35 24%,#0f6b5a 42%,#34d399 54%,#a7f3d0 60%,#fbcfe8 64%,#0a201d 64%,#041413 100%); }
    body[data-theme="mint"] .bt-sun { background: linear-gradient(180deg,#fffde7,#a7f3d0 30%,#5eead4 55%,#f472b6 100%); }
    body[data-theme="mint"] .bt-grid { background-image: linear-gradient(to right,rgba(94,234,212,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(244,114,182,.5) 1.5px,transparent 1.5px); }

    body.bt-no-anim .bt-grid { animation: none; }

    /* ================= ÉCONOMIE DE BATTERIE =================
       Une animation plein écran en boucle fait travailler le GPU 60×/s sans
       interruption : c'est ce qui fait chauffer les téléphones. On la coupe
       dès que la page n'est pas regardée, et en mode éco. */
    body.bt-paused .bt-grid,
    body.bt-paused .animate-float,
    body.bt-paused .animate-pulse,
    body.bt-paused .animate-ring { animation-play-state: paused !important; }

    body.bt-eco .bt-grid { animation: none !important; }
    body.bt-eco .animate-float,
    body.bt-eco .animate-pulse,
    body.bt-eco .animate-ring { animation: none !important; }
    body.bt-eco .bt-scan { display: none; }            /* voile plein écran inutile */
    body.bt-eco #settings, body.bt-eco #picker,
    body.bt-eco #scanner { backdrop-filter: none; background: rgba(3,0,10,.9); }
    body.bt-eco #app { backdrop-filter: none; }
    body.bt-eco .bt-sun { box-shadow: none; }          /* grandes ombres = coûteuses */

    /* ====================== ROUE & MENU RÉGLAGES ====================== */
    .gear { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; z-index: 5;
      width: 42px; height: 42px; border-radius: 50%; }
    #settings.hidden, #picker.hidden, #scanner.hidden { display: none; }
    #settings, #picker, #scanner { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center;
      background: rgba(3,0,10,.62); backdrop-filter: blur(5px); }
    @media (min-width: 540px) { #settings, #picker, #scanner { align-items: center; } }
    .dz-card { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: rgba(0,0,0,.25); }
    .dz-card img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .set-panel { width: 100%; max-width: 480px; max-height: 92dvh; overflow-y: auto;
      border-radius: 26px 26px 0 0;
      background: linear-gradient(180deg, rgba(22,7,44,.97), rgba(8,2,20,.99));
      border: 1px solid rgba(34,211,238,.25);
      box-shadow: 0 -12px 70px rgba(255,46,154,.25);
      padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }
    @media (min-width: 540px) { .set-panel { border-radius: 26px; } }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 0; border-top: 1px solid rgba(255,255,255,.06); }
    .swatch { width: 40px; height: 40px; border-radius: 13px; border: 2px solid transparent; cursor: pointer; transition: transform .12s; }
    .swatch:active { transform: scale(.92); }
    .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(34,211,238,.7), 0 0 16px rgba(255,46,154,.5); }
    .toggle { width: 52px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.16); position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
    .toggle.on { background: linear-gradient(90deg,#22d3ee,#ff2e9a); }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
    .toggle.on::after { left: 25px; }
  </style>
</head>

  <div id="toasts" class="fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

  <script>
/* =============================================================================
   BLIND TEST MUSICAL — Application de soirée multijoueur temps réel
   -----------------------------------------------------------------------------
   Stack : HTML + Tailwind (CDN) + Supabase Realtime (Broadcast + Presence).
   Aucune table SQL, aucune migration : le jeu est éphémère et tient en mémoire.

   Architecture "autorité hôte" :
     • L'ÉCRAN HÔTE détient l'état complet de la partie (the single source of truth)
       et le diffuse (broadcast "state") à chaque changement.
     • Les ÉCRANS JOUEURS sont des clients fins : ils envoient des intentions
       (broadcast "intent" : join / buzz / answer / vote / leave) et se contentent
       d'afficher l'état reçu de l'hôte.
     • La PRÉSENCE Supabase détecte les connexions/déconnexions.

   Dépendances chargées avant (voir blindtest.html) :
     supabase-js v2, supabase-config.js (window.AXION_SUPABASE), qrcode, html2canvas.
   ============================================================================= */
(function () {
  'use strict';

  /* --------------------------------------------------------------------------
     0. Constantes & utilitaires
     -------------------------------------------------------------------------- */
  /* Credentials Supabase : on réutilise ceux d'AXION si présents (window.AXION_SUPABASE,
     défini par assets/js/supabase-config.js), sinon on retombe sur les valeurs publiques
     intégrées ci-dessous. La clé "anon"/"publishable" est PUBLIQUE par conception (elle
     tourne dans le navigateur). Realtime Broadcast/Presence ne touche à aucune table.
     => L'app fonctionne donc en autonomie totale (GitHub Pages, Vercel, fichier servi…). */
  var SB_FALLBACK = { url: 'https://phfdrgvdfhwtyycxpahq.supabase.co', anonKey: 'sb_publishable_GD32kGL-4Et4FEAAOQQrBQ_zClazT3V' };
  var SB_CONF = window.AXION_SUPABASE || SB_FALLBACK;
  var SB_URL = SB_CONF.url || SB_FALLBACK.url;
  var SB_KEY = SB_CONF.anonKey || SB_FALLBACK.anonKey;
  var BUZZ_LOCK_MS = 3000;          // anti-spam : buzz verrouillé au lancement
  var CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sans I,O,0,1,L (lisibilité)

  var app = document.getElementById('app');
  var toasts = document.getElementById('toasts');

  function $(sel, root) { return (root || document).querySelector(sel); }
  function uuid() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxxyxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0, v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  function genCode() {
    var s = '';
    for (var i = 0; i < 6; i++) s += CODE_ALPHABET[(Math.random() * CODE_ALPHABET.length) | 0];
    return s;
  }
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function deb(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return ((parts[0][0] || '?') + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  /* Petit feedback sensoriel : bip WebAudio + vibration. */
  var AC = window.AudioContext || window.webkitAudioContext;
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (prefs && prefs.muted) return;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sawtooth'; o.frequency.value = freq || 660;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.18));
      o.connect(g); g.connect(audioCtx.destination);

  /* ---------------------------------------------------------------
     MÉMOIRE MUSICALE — elle survit à la fin d'une partie ET au
     rechargement de l'app. Avant, le sac d'artistes vivait en mémoire
     et la liste des morceaux joués repartait à zéro à chaque partie :
     quand on enchaînait deux soirées, les mêmes artistes et les mêmes
     titres revenaient tout de suite.
       bags    : ce qu'il reste à tirer par liste d'artistes
       tracks  : identifiants des morceaux déjà passés
       artists : artistes récemment passés, du plus ancien au plus récent
     `store` est défini plus bas dans le fichier : on initialise donc à
     la première utilisation, jamais au chargement.
     --------------------------------------------------------------- */
  var MEM_TRACKS = 800, MEM_ARTISTS = 150;
  var AUTO_LIMIT = 50;   // titres ramenés par artiste pour le tirage automatique
  var _mem = null;
  function mem() {
    if (!_mem) {
      var m = store.get('musicMemory', null);
      _mem = (m && m.bags && m.tracks && m.artists) ? m : { bags: {}, tracks: [], artists: [] };
    }
    return _mem;
  }
  function memSave() { if (_mem) store.set('musicMemory', _mem); }
  /* On vide les tableaux SUR PLACE : une partie en cours garde une référence
     directe vers `tracks` (voir playedIds). Remplacer l'objet la laisserait
     travailler sur une liste orpheline, plus jamais enregistrée. */
  function memReset() {
    var m = mem();
    m.bags = {}; m.tracks.length = 0; m.artists.length = 0;
    memSave();
  }

  /* Tirage SANS REMISE des artistes : on mélange la liste et on la consomme
     entièrement avant qu'un artiste puisse revenir. Sans ça, un tirage aléatoire
     indépendant ramenait plusieurs fois le même artiste sur une même partie. */
  function nextArtist(list) {
    var m = mem();
    var key = list.length + '|' + list[0] + '|' + list[list.length - 1];
    var bag = m.bags[key];
    if (!bag || !bag.length) {
      bag = list.slice();
      for (var i = bag.length - 1; i > 0; i--) {      // mélange de Fisher-Yates
        var j = (Math.random() * (i + 1)) | 0, t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      /* Nouveau tour de sac : on repousse en fin de file ceux qui viennent de
         passer (on tire avec pop(), donc « début du tableau » = tiré en dernier).
         Sinon un artiste pouvait fermer un tour et rouvrir le suivant. */
      var recent = m.artists;
      bag.sort(function (a, b) { return recent.indexOf(b) - recent.indexOf(a); });
      m.bags[key] = bag;
    }
    var pick = bag.pop();
    m.artists.push(pick);
    if (m.artists.length > MEM_ARTISTS) m.artists.shift();
    memSave();
    return pick;
  }

  /* Tire un morceau de la playlist, en évitant ceux déjà joués. cb(track|null)
     Au dernier essai on accepte un morceau déjà joué : mieux vaut un titre
     déjà entendu qu'une manche bloquée faute de nouveauté. */
  function autoPick(pl, usedIds, cb, tries) {
    tries = tries || 0;
    /* On accepte aussi bien une playlist du catalogue (qui peut être « à œuvre »)
       qu'une liste de sources déjà construite par l'appelant ({artists: […]}). */
    var srcs = (pl && pl.artists && pl.artists.length) ? pl.artists : plSources(pl);
    if (!srcs.length || tries > 4) { cb(null); return; }
    var dernier = tries === 4;
    var src = nextArtist(srcs);
    var oeu = decOeuvre(src);   // source « à œuvre » (film / série) ou simple artiste
    var recu = function (res) {
      if (!res || !res.length) { autoPick(pl, usedIds, cb, tries + 1); return; }
      var pool = res.filter(function (t) { return t.preview && usedIds.indexOf(t.id) < 0; });
      if (!pool.length && dernier) pool = res.filter(function (t) { return t.preview; });
      if (!pool.length) { autoPick(pl, usedIds, cb, tries + 1); return; }
      var t = pool[(Math.random() * pool.length) | 0];
      /* On a cherché PAR œuvre : on sait donc de quel film il s'agit, sans avoir
         à le déduire du nom d'album. C'est ce qui rend la question fiable. */
      if (oeu) { t._oeuvre = oeu.entree; t._oeuLabel = oeu.pl.label || 'L\'œuvre'; }
      cb(t);
    };
    if (oeu) oeuvreSearch(oeu.entree, oeu.pl, recu, AUTO_LIMIT);
    else musicSearch(src, recu, AUTO_LIMIT);
  }

  var dzAudio = document.getElementById('dzaudio');
  /* Mode audio de la partie : 'device' = l'app joue la musique sur le téléphone
     du DJ ; 'external' = le son vient d'ailleurs (enceinte, autre appareil). */
  var appAudioMode = 'device';
  /* Sur une manche à l'aveugle, PERSONNE ne connaît le morceau : aucun humain ne
     peut donc le lancer depuis une source externe. L'app doit obligatoirement
     jouer le son elle-même, quel que soit le réglage de la partie. */
  var blindAudio = false;
  function canPlayInApp() { return blindAudio || appAudioMode === 'device'; }

  function dzPlay(url) {
    // En mode "source à part", on ne lance jamais d'audio : le son vient d'ailleurs.
    if (!canPlayInApp()) return;
    if (!dzAudio || !url) return;
    try { if (dzAudio.src !== url) dzAudio.src = url; dzAudio.currentTime = 0; dzAudio.play().catch(function () {}); } catch (e) {}
  }
  function dzResume() { if (dzAudio) dzAudio.play().catch(function () {}); }

  /* ---------------------------------------------------------------
     LECTEUR INTÉGRÉ — le DJ lance/arrête la musique sans jamais
     sortir de l'application. `hidden` masque le titre (anti-spoil
     si quelqu'un regarde par-dessus l'épaule).
     --------------------------------------------------------------- */
  // Le DJ voit SON morceau par défaut (il doit le choisir, le lancer, corriger).
  // Le masquage est une option, s'il craint les regards indiscrets.
  var trackHidden = false;
  function playerBar(track, opts) {
    opts = opts || {};
    if (!track) return '';
    var playing = dzAudio && !dzAudio.paused && dzAudio.src === track.preview;
    // blind = partie à l'aveugle : le titre reste secret pour TOUT LE MONDE, hôte compris.
    var show = opts.blind ? false : !trackHidden;
    return '<div class="glass rounded-2xl p-3 mb-3">'
      + '<div class="flex items-center gap-3">'
      + (show
          ? '<img src="' + esc(track.cover || '') + '" class="w-12 h-12 rounded-lg object-cover shrink-0" alt="" />'
          : '<div class="w-12 h-12 rounded-lg shrink-0 bg-black/40 flex items-center justify-center text-xl">🔒</div>')
      + '<div class="flex-1 min-w-0">'
      + (show
          ? '<div class="font-bold truncate text-sm">' + esc(track.title) + '</div><div class="text-white/50 text-xs truncate">' + esc(track.artist) + '</div>'
          : '<div class="text-xs text-neon-lime font-bold">Morceau prêt · caché</div><div class="font-bold text-sm text-white/30 tracking-widest">••••••••</div>')
      + '<div class="h-1.5 mt-1.5 rounded-full bg-white/10 overflow-hidden"><div id="plyBar" class="h-full rounded-full" style="width:0%;background:linear-gradient(90deg,#22d3ee,#ff2e9a)"></div></div>'
      + '</div>'
      /* Verrou d'écoute : à l'aveugle, l'hôte joue aussi. Le titre était masqué, mais
         rien ne l'empêchait d'ÉCOUTER l'extrait avant de lancer la manche — or le
         morceau suivant est préchargé entre les manches. Il connaissait donc la
         réponse avant tout le monde. Masquer le titre ne suffit pas : il faut couper
         l'accès au son tant que la manche n'est pas ouverte pour tous. */
      + (opts.verrou
          ? '<div class="w-14 h-14 rounded-full shrink-0 text-2xl flex items-center justify-center bg-white/10 text-white/40">🔒</div>'
          : '<button id="plyToggle" class="w-14 h-14 rounded-full shrink-0 text-2xl font-extrabold flex items-center justify-center ' + (playing ? 'bg-white/15' : 'bg-gradient-to-br from-neon-lime to-neon-cyan text-black') + '">' + (playing ? '⏸' : '▶') + '</button>')
      + '</div>'
      + (opts.verrou ? '<p class="text-white/45 text-xs mt-2">🔒 Écoute verrouillée — la musique démarrera en même temps pour tout le monde, au lancement de la manche.</p>' : '')
      + '<div class="flex items-center gap-2 mt-2">'
      + (opts.verrou ? '' : '<button id="plyRestart" class="px-2.5 py-1.5 rounded-lg glass text-xs font-bold" title="Reprendre au début">↺</button>')
      + '<span id="plyTime" class="text-white/40 text-xs tabular-nums">0:00</span>'
      + '<input id="plyVol" type="range" min="0" max="1" step="0.05" value="' + (dzAudio ? dzAudio.volume : 1) + '" class="flex-1 min-w-0" />'
      + (opts.blind ? '' : '<button id="plyPeek" class="px-2.5 py-1.5 rounded-lg glass text-xs font-bold shrink-0">' + (trackHidden ? '👁' : '🙈') + '</button>')
      + '</div>'
      // Choisir un AUTRE morceau : recherche précise, ou tirage au sort dans la playlist.
      // (Rien de tout ça à l'aveugle : l'app décide seule.)
      + (opts.blind ? '' :
          '<div class="grid ' + (opts.onChange ? 'grid-cols-2' : 'grid-cols-1') + ' gap-2 mt-2">'
          + '<button id="plySearch" class="py-2.5 rounded-lg bg-gradient-to-r from-neon-cyan to-neon-lime text-black font-extrabold text-sm">🔎 Chercher un titre / artiste</button>'
          + (opts.onChange ? '<button id="plyChange" class="py-2.5 rounded-lg glass font-bold text-sm">🔄 Autre au hasard</button>' : '')
          + '</div>')
      + '</div>';
  }
  /* Branche les commandes du lecteur + la progression (événement natif, léger). */
  function bindPlayer(track, onChange) {
    if (!track) return;
    bind('#plyToggle', function () {
      if (!dzAudio) return;
      if (!dzAudio.paused && dzAudio.src === track.preview) dzPause();
      else if (dzAudio.src === track.preview && dzAudio.currentTime > 0) dzResume();
      else dzPlay(track.preview);
      if (onChange) setTimeout(onChange, 60);
    });
    bind('#plyRestart', function () { dzPlay(track.preview); if (onChange) setTimeout(onChange, 60); });
    bind('#plyPeek', function () { trackHidden = !trackHidden; if (onChange) onChange(); });
    var v = $('#plyVol'); if (v) v.oninput = function () { if (dzAudio) dzAudio.volume = parseFloat(v.value); };
    if (dzAudio) {
      dzAudio.ontimeupdate = function () {
        var bar = document.getElementById('plyBar'), tm = document.getElementById('plyTime');
        if (!bar || !dzAudio.duration) return;
        bar.style.width = Math.min(100, (dzAudio.currentTime / dzAudio.duration) * 100) + '%';
        if (tm) { var s = Math.floor(dzAudio.currentTime); tm.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
      };
      // Fin de l'extrait : on met à jour UNIQUEMENT le bouton lecture.
      // (Un rendu complet ici effaçait la réponse en cours de saisie.)
      dzAudio.onended = function () {
        var b = document.getElementById('plyToggle');
        if (b) { b.textContent = '▶'; b.className = b.className.replace('bg-white/15', 'bg-gradient-to-br from-neon-lime to-neon-cyan text-black'); }
      };
    }
  }
  function dzPause() { if (dzAudio) try { dzAudio.pause(); } catch (e) {} }

  /* Comparaison floue réponse <-> morceau (pour la suggestion ✓/✗). */
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\(.*?\)/g, ' ').replace(/feat.*$/, ' ').replace(/[^a-z0-9]+/g, ' ').trim(); }
  /* Nettoyage poussé : retire les mentions d'édition qui ne font pas partie du
     titre réel (Remastered, Live, Radio Edit…) et les articles peu porteurs. */
  var NOISE = /\b(remaster(ed)?|remasterise\w*|version|edit|radio|single|album|mono|stereo|live|deluxe|bonus|track|feat|ft|featuring|avec|original|motion|picture|soundtrack|bande|originale|extended|mix|remix)\b/g;
  var STOP = { le: 1, la: 1, les: 1, un: 1, une: 1, des: 1, du: 1, de: 1, d: 1, l: 1, the: 1, a: 1, an: 1, of: 1, and: 1, et: 1, on: 1, in: 1, to: 1, my: 1, me: 1, i: 1, you: 1 };
  function clean(s) { return norm(s).replace(NOISE, ' ').replace(/\s+/g, ' ').trim(); }
  function words(s) { return clean(s).split(' ').filter(function (w) { return w && !STOP[w]; }); }

  /* Distance de Levenshtein → tolère les fautes de frappe et l'orthographe approximative. */
  function lev(a, b) {
    if (a === b) return 0;
    if (!a.length || !b.length) return Math.max(a.length, b.length);
    if (Math.abs(a.length - b.length) > 6) return 99;
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      prev = cur.slice();
    }
    return prev[b.length];
  }
  function simil(a, b) { var m = Math.max(a.length, b.length); return m ? 1 - lev(a, b) / m : 0; }
  /* Deux mots se ressemblent-ils ? (tolérance proportionnelle à la longueur) */
  function wordAlike(x, y) {
    if (x === y) return true;
    if (x.length >= 4 && y.length >= 4 && (x.indexOf(y) === 0 || y.indexOf(x) === 0)) return true; // préfixe commun
    var tol = x.length <= 4 ? 1 : (x.length <= 7 ? 2 : 3);
    return lev(x, y) <= tol;
  }

  function fuzzyHit(answer, track, mode) {
    if (!track) return null;
    var a = clean(answer); if (!a) return null;
    var title = clean(track.title), artist = clean(track.artist);

    function match(field) {
      if (!field || !a) return false;
      // 1. Quasi-identique (tolère les fautes) : « bohemian rapsodie » ≈ « bohemian rhapsody »
      if (simil(a, field) >= 0.80) return true;
      // 2. La réponse est contenue dans le champ (ou l'inverse), sur une longueur significative
      var shortest = Math.min(a.length, field.length);
      if (shortest >= 4 && (field.indexOf(a) >= 0 || a.indexOf(field) >= 0)) return true;
      // 3. Comparaison mot à mot : il faut retrouver l'ESSENTIEL des mots porteurs,
      //    pas un seul mot en commun (« Take On Me » ne doit pas valider « Take That »).
      var aw = words(a), fw = words(field);
      if (!aw.length || !fw.length) return false;
      var hits = aw.filter(function (w) {
        return fw.some(function (f) { return wordAlike(w, f); });
      }).length;
      var need = Math.max(1, Math.ceil(fw.length * 0.6));   // 60 % des mots du vrai titre
      // Il faut aussi que l'essentiel de CE QUI A ÉTÉ TAPÉ corresponde : sinon
      // « take that » validerait « Take On Me » sur le seul mot « take ».
      if (hits < need || hits < Math.ceil(aw.length * 0.7)) return false;
      // Garde-fou final : l'ensemble doit rester globalement proche.
      return simil(a, field) >= 0.55;
    }

    var mt = match(title), ma = match(artist);
    /* Thème « à œuvre » (film, série, dessin animé) : on demande le NOM DE L'ŒUVRE.
       Toutes les variantes déclarées sont acceptées (« Retour vers le futur » et
       « Back to the Future »). Donner le titre de la chanson à la place n'est pas
       faux — c'est à moitié bon : on reconnaît l'effort sans donner tout le point. */
    if (mode === 'oeuvre') {
      var noms = oeuvreNoms(track.oeuvre);
      for (var i = 0; i < noms.length; i++) if (match(clean(noms[i]))) return 'ok';
      return mt ? 'half' : 'ko';
    }
    if (mode === 'title') return mt ? 'ok' : 'ko';
    if (mode === 'artist') return ma ? 'ok' : 'ko';
    if (mode === 'either') return (mt || ma) ? 'ok' : 'ko';       // l'un des deux suffit
    return (mt && ma) ? 'ok' : ((mt || ma) ? 'half' : 'ko');      // both : les deux attendus
  }

  /* UNE seule description de ce qu'on demande. Le badge, la consigne et le champ
     de saisie étaient trois chaînes ternaires recopiées à quatre endroits : elles
     ont fini par diverger (leçon n°13 — une règle, une fonction).
     `deux` = deux champs séparés (titre + artiste). */
  function ansUI(am, label) {
    if (am === 'oeuvre') {
      var l = label || 'L\'œuvre';
      return { badge: '🎬 ' + l, consigne: 'Donne ' + l.charAt(0).toLowerCase() + l.slice(1), ph: '🎬 ' + l + '…', deux: false };
    }
    if (am === 'both') return { badge: '🎵 Titre + Artiste', consigne: 'Titre ET artiste', ph: '', deux: true };
    if (am === 'either') return { badge: '🎲 Titre OU Artiste', consigne: 'Titre OU artiste (au choix)', ph: '🎲 Titre ou artiste…', deux: false };
    if (am === 'artist') return { badge: '🎤 Artiste', consigne: 'Nomme l\'artiste', ph: '🎤 Artiste…', deux: false };
    return { badge: '💿 Titre', consigne: 'Donne le titre', ph: '💿 Titre…', deux: false };
  }

  /* --------------------------------------------------------------------------
     Scanner QR intégré (caméra + décodage jsQR chargé à la demande)
     -------------------------------------------------------------------------- */
  function loadJsQR(cb) {

    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';

  var scanStream = null, scanRAF = 0;
  function stopScan() {

    var el = document.getElementById('scanner'); if (el) { el.classList.add('hidden'); el.innerHTML = ''; }
  }
  function openScanner() {

      + '<div class="relative rounded-2xl overflow-hidden bg-black" style="aspect-ratio:1"><video id="scvid" playsinline muted class="w-full h-full object-cover"></video><div class="absolute inset-6 border-2 border-neon-cyan rounded-2xl pointer-events-none"></div></div>'
      + '<p id="scmsg" class="text-white/60 text-sm mt-3">Vise le QR code affiché par l\'hôte…</p>'
      + '<button id="scManual" class="mt-2 text-white/40 text-sm underline">Saisir le code à la main</button>'

    var msg = function (t) { var m = document.getElementById('scmsg'); if (m) m.textContent = t; };

  /* Confettis plein écran (canvas, sans dépendance) */
  var _confCv = document.getElementById('confetti');
  var _confCtx = _confCv && _confCv.getContext('2d');
  var _conf = [], _confRAF = 0;
  function confetti(n) {
    if (prefs && prefs.noanim) return;
    if (!_confCtx) return;
    var W = _confCv.width = window.innerWidth, H = _confCv.height = window.innerHeight;
    var colors = ['#ff2e9a', '#22d3ee', '#a3e635', '#fbbf24', '#8b5cf6', '#ff8a00'];
    for (var i = 0; i < (n || 120); i++) {
      _conf.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.3,
        vx: (Math.random() - 0.5) * 6, vy: 3 + Math.random() * 5,
        s: 5 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!_confRAF) _confRAF = requestAnimationFrame(_confStep);
  }
  function _confStep() {
    var W = _confCv.width, H = _confCv.height;
    _confCtx.clearRect(0, 0, W, H);
    for (var i = _conf.length - 1; i >= 0; i--) {
      var p = _conf[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.r += p.vr;
      _confCtx.save(); _confCtx.translate(p.x, p.y); _confCtx.rotate(p.r);
      _confCtx.fillStyle = p.c; _confCtx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); _confCtx.restore();
      if (p.y > H + 30) _conf.splice(i, 1);
    }
    if (_conf.length) _confRAF = requestAnimationFrame(_confStep);
    else { _confCtx.clearRect(0, 0, W, H); _confRAF = 0; }
  }

  /* ---------------------------------------------------------------
     EFFETS DU CONTRE — le seul joker qui vise quelqu'un d'autre.
     Trois règles d'arbitrage, que tout nouvel effet doit respecter :
       1. AUCUN n'élimine définitivement — on ralentit, on corse, on
          fait patienter, mais le visé reste dans la manche (sauf
          « barré sec », assumé comme la version brutale).
       2. AUCUN ne demande d'arbitrage humain : la règle se résout
          toute seule, sinon la soirée s'arrête pour discuter.
       3. TOUS fonctionnent avec une enceinte unique. Un effet qui
          couperait le son du visé couperait celui de toute la table :
          c'est pour ça qu'il n'y a pas de « son coupé » ici.
     --------------------------------------------------------------- */
  var CONTRE_DELAI = 5000;   // « ralenti » : retard imposé au buzz du meneur
  var CONTRE_EFFETS = {
    ice:    { icon: '🧊', nom: 'Écran gelé', verbe: 'a gelé',
              court: 'écran pris par le givre — il doit le frotter pour revenir',
              aide: 'Son écran se couvre de givre : il doit le <b>frotter au doigt</b> pour revenir. Il perd de précieuses secondes mais reste dans la manche.' },
    slow:   { icon: '🐢', nom: 'Ralenti', verbe: 'a ralenti',
              court: 'son buzz s\'ouvre 5 secondes après les autres',
              aide: 'Son buzz s\'ouvre <b>5 secondes après</b> celui des autres. Il joue quand même : si personne ne trouve avant, il marque.' },
    exig:   { icon: '🎯', nom: 'Exigence', verbe: 'a corsé le titre de',
              court: 'il doit donner le titre ET l\'artiste',
              aide: 'Il doit donner <b>le titre ET l\'artiste</b> quand les autres n\'ont qu\'une des deux à trouver. Il peut encore prendre la moitié des points.' },
    dbl:    { icon: '💸', nom: 'Quitte ou double', verbe: 'a doublé la mise contre',
              court: 'ses points comptent double, en bien comme en mal',
              aide: 'Sur ce titre ses points comptent <b>double</b> : s\'il trouve il s\'envole, s\'il se trompe il plonge. Un pari sur son assurance.' },
    second: { icon: '🥈', nom: 'Second couteau', verbe: 'a fait passer devant',
              court: 'il ne peut buzzer qu\'après une première tentative',
              aide: 'Il ne peut buzzer qu\'<b>après</b> que quelqu\'un d\'autre a tenté sa chance. Il garde le rebond, pas la primeur.' },
    block:  { icon: '🚫', nom: 'Barré sec', verbe: 'a barré',
              court: 'il ne joue pas ce titre',
              aide: 'Il ne joue pas ce titre du tout. Le plus brutal — à réserver aux parties courtes.' }
  };
  var CONTRE_ORDRE = ['ice', 'slow', 'exig', 'dbl', 'second', 'block'];
  /* Les parties enregistrées avant les nouveaux effets n'ont que `ice: 0|1`. */
  function contreInfo(c) {
    if (!c) return CONTRE_EFFETS.ice;
    return CONTRE_EFFETS[c.eff] || (c.ice ? CONTRE_EFFETS.ice : CONTRE_EFFETS.block);
  }

  /* ---------------------------------------------------------------
     ÉCRAN GELÉ — « casse la glace ». Le joueur visé par un contre voit
     son écran pris par le givre : il doit le FROTTER au doigt pour
     retrouver l'accès. Ça ne l'élimine pas, ça lui coûte des secondes —
     de quoi laisser une chance aux autres sans humilier personne.
     Le canvas vit HORS de #app : les rendus de l'écran joueur
     reconstruisent #app en permanence et l'effaceraient sinon.
     --------------------------------------------------------------- */
  var _ice = { on: false, cleared: false, ctx: null, need: 0.55, cb: null, checkAt: 0 };
  function iceVisible() { return _ice.on && !_ice.cleared; }
  function hideIce() {
    _ice.on = false; _ice.cleared = false; _ice.cb = null;
    var c = document.getElementById('iceLayer'), h = document.getElementById('iceHint');
    if (c) c.classList.add('hidden');
    if (h) h.classList.add('hidden');
  }
  function showIce(par, onCleared) {
    var c = document.getElementById('iceLayer'), h = document.getElementById('iceHint');
    if (!c || _ice.on) return;
    _ice.on = true; _ice.cleared = false; _ice.cb = onCleared || null;
    var w = c.width = window.innerWidth, hh = c.height = window.innerHeight;
    var g = c.getContext('2d'); _ice.ctx = g;
    // Givre : bleu très clair, opaque, avec des cristaux pour que ce soit lisible.
    var grd = g.createLinearGradient(0, 0, w, hh);
    grd.addColorStop(0, 'rgba(214,240,255,.97)');
    grd.addColorStop(.5, 'rgba(168,216,247,.97)');
    grd.addColorStop(1, 'rgba(226,246,255,.97)');
    g.fillStyle = grd; g.fillRect(0, 0, w, hh);
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2;
    for (var i = 0; i < 90; i++) {
      var x = Math.random() * w, y = Math.random() * hh, r = 8 + Math.random() * 26;
      g.beginPath();
      for (var k = 0; k < 6; k++) {
        var a = (Math.PI / 3) * k;
        g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      }
      g.stroke();
    }
    c.classList.remove('hidden');
    if (h) {
      h.innerHTML = '<div class="inline-block px-5 py-3 rounded-2xl" style="background:rgba(10,3,26,.72)">'
        + '<div class="text-5xl mb-1">🧊</div>'
        + '<p class="bt-title text-xl font-extrabold text-white">ÉCRAN GELÉ</p>'
        + '<p class="text-white/80 text-sm mt-1">' + esc(par || '') + ' t\'a gelé — <b>frotte l\'écran</b> pour le dégager</p></div>';
      h.classList.remove('hidden');
    }
    var frotter = function (ev) {
      if (!_ice.on || _ice.cleared) return;
      ev.preventDefault();
      var pts = ev.touches ? ev.touches : [ev];
      for (var j = 0; j < pts.length; j++) {
        var rect = c.getBoundingClientRect();
        var px = pts[j].clientX - rect.left, py = pts[j].clientY - rect.top;
        g.save(); g.globalCompositeOperation = 'destination-out';
        g.beginPath(); g.arc(px, py, 42, 0, Math.PI * 2); g.fill(); g.restore();
      }
      // Le calcul du dégagement est coûteux : on n'échantillonne que par intervalles.
      var now = Date.now();
      if (now - _ice.checkAt < 120) return;
      _ice.checkAt = now;
      try {
        var pas = 16, vus = 0, clairs = 0;
        var d = g.getImageData(0, 0, c.width, c.height).data;
        for (var y2 = 0; y2 < c.height; y2 += pas) {
          for (var x2 = 0; x2 < c.width; x2 += pas) {
            var idx = ((y2 * c.width) + x2) * 4 + 3;
            vus++; if (d[idx] < 40) clairs++;
          }
        }
        if (vus && (clairs / vus) >= _ice.need) {
          _ice.cleared = true;
          beep(1200, 0.18, 'sine'); vibrate([0, 40, 30, 60]);
          var cb = _ice.cb; hideIce();
          if (cb) cb();
        }
      } catch (e) { /* getImageData peut échouer : on ne bloque jamais le jeu */ }
    };

    c.onmousedown = frotter; c.ontouchstart = frotter;
    /* Filet de sécurité : si le dégagement ne se calcule pas (canvas protégé,
       navigateur exotique), on libère au bout de 12 s — on ne piège personne. */
    setTimeout(function () {
      if (_ice.on && !_ice.cleared) { _ice.cleared = true; var cb2 = _ice.cb; hideIce(); if (cb2) cb2(); }
    }, 12000);
  }

  /* Historique : une partie terminée est archivée et ne doit plus être proposée

  function archiveGame(st, code, myName) {

      if (hist.some(function (h) { return h.code === code && h.round === st.round; })) return;
      var info = fairInfo(st.players);

        myRank: lb.findIndex(function (p) { return p.id === ME; }) + 1,
        players: lb.length
      });

  /* Ouvre un canal de partie. handlers = { onIntent, onState, onPresence, onReady } */
  function openChannel(code, identity, handlers) {
    var ch = client().channel('blindtest-' + code, {
      config: { broadcast: { self: false }, presence: { key: identity.id } }
    });
    if (handlers.onIntent) ch.on('broadcast', { event: 'intent' }, function (m) { handlers.onIntent(m.payload); });
    if (handlers.onState) ch.on('broadcast', { event: 'state' }, function (m) { handlers.onState(m.payload); });
    // Canal léger : sert à informer le DJ de l'avancement SANS renvoyer tout l'état
    // (un state complet reconstruit l'écran des joueurs et efface leur saisie en cours).
    if (handlers.onProgress) ch.on('broadcast', { event: 'progress' }, function (m) { handlers.onProgress(m.payload); });
    if (handlers.onPresence) {
      ch.on('presence', { event: 'sync' }, function () { handlers.onPresence(ch.presenceState()); });
      ch.on('presence', { event: 'leave' }, function (e) { handlers.onPresence(ch.presenceState(), e); });
    }
    ch.subscribe(function (status) {
      // Statut visible : sans ça, une coupure réseau se traduit par un écran figé sans explication.
      setLink(status === 'SUBSCRIBED' ? 'ok' : (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') ? 'down' : 'wait');
      if (status === 'SUBSCRIBED') {
        ch.track({ id: identity.id, name: identity.name, role: identity.role, at: Date.now() });
        if (handlers.onReady) handlers.onReady(ch);
      }
    });
    return {
      raw: ch,
      sendIntent: function (payload) { ch.send({ type: 'broadcast', event: 'intent', payload: payload }); },
      sendState: function (payload) { ch.send({ type: 'broadcast', event: 'state', payload: payload }); },
      sendProgress: function (payload) { ch.send({ type: 'broadcast', event: 'progress', payload: payload }); },
      close: function () { try { client().removeChannel(ch); } catch (e) {} }
    };
  }

  /* --------------------------------------------------------------------------
     2. Routeur de vues minimal (basé sur le hash)
     -------------------------------------------------------------------------- */
  var current = null; // contrôleur actif (host/player) pour nettoyage
  function teardown() { if (current && current.destroy) { try { current.destroy(); } catch (e) {} } current = null; }

  function route() {
    teardown();
    var h = location.hash.slice(1);
    var m = h.match(/^join=([A-Z0-9]{6})$/i);
    if (h === 'new') return renderHostSetup();          // créer une nouvelle partie
    if (h === 'solo') return startSolo();                // entraînement, hors ligne de jeu
    if (h === 'host') {                                  // partie hôte en cours
      var saved = store.get('hostGame', null);
      if (saved && saved.code) return startHost(saved);
      return renderHostSetup();
    }
    if (m) return renderJoin(m[1].toUpperCase());
    return renderHome();
  }
  window.addEventListener('hashchange', route);

  /* Plein écran : accessible partout, pas seulement depuis les Réglages. */
  (function () {
    var fb = document.getElementById('fsFloat');
    if (!fb) return;
    var maj = function () { fb.textContent = document.fullscreenElement ? '⤡' : '⛶'; };
    fb.onclick = function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } catch (e) {}
    };
    document.addEventListener('fullscreenchange', maj);
    maj();
  })();
  /* Naviguer en étant sûr que la vue change : affecter un hash identique
     ne déclenche pas d'événement, ce qui donnait des boutons « sans effet ». */
  function go(h) {
    if (location.hash.replace('#', '') === h) route();
    else location.hash = h;
  }

      var STYLES = {

        aveugle:  function () { press('#suDingo', 0); press('#suHostPlays', 1); press('#suWheel', 0); choose('suDj', 'data-dj', '0'); press('#suBlind', 1); choose('suBlindPlay', 'data-play', 'turbo'); manches(10); syncDjUI(0); },
        duel:     function () { press('#suDingo', 0); press('#suHostPlays', 1); press('#suWheel', 0); choose('suDj', 'data-dj', '0'); press('#suBlind', 1); choose('suBlindPlay', 'data-play', 'buzz'); manches(10); choose('suAns', 'data-ans', 'either'); syncDjUI(0); },
        anim:     function () { press('#suDingo', 0); press('#suHostPlays', 0); press('#suBlind', 0); choose('suDj', 'data-dj', '0'); press('#suWheel', 0); choose('suMode', 'data-mode', 'classic'); libre(); syncDjUI(0); },
        surprise: function () { press('#suDingo', 0); press('#suHostPlays', 1); press('#suBlind', 0); choose('suDj', 'data-dj', '5'); press('#suWheel', 1); libre(); syncDjUI(1); },
        /* Ce départ rapide met l'app aux commandes (elle choisit, joue et corrige) :
           c'est la façon la plus lisible de découvrir le handicap. Mais l'interrupteur
           « 🤪 Handicap Dingo » s'utilise avec n'importe quel style — le barème se
           calcule sur les scores, que personne ne peut arranger. */
        dingo:    function () { press('#suDingo', 1); press('#suHostPlays', 1); press('#suWheel', 0); choose('suDj', 'data-dj', '0'); press('#suBlind', 1); choose('suBlindPlay', 'data-play', 'buzz'); manches(10); choose('suAns', 'data-ans', 'either'); syncDjUI(0); }
      };
      /* Le bloc « rotation » n'a de sens que dans les styles qui font tourner le DJ.
         Ailleurs on le masque ; en tournoi on retire « moi seul » (contradictoire).
         Les « manches à l'aveugle en fin de tour » suivent la rotation : sans elle,
         il n'y a pas de « fin de tour ». */
      /* « X manches » avec une valeur choisie : le bouton de fin de partie force 20,
         ce qui est long pour une partie où l'app enchaîne toute seule. */
      function manches(n) {
        choose('suGoal', 'data-goal', 'rounds');
        var v = document.getElementById('goalVal'); if (v) v.value = n;
      }
      /* Les styles à rotation se terminent d'eux-mêmes quand tous les DJ sont passés :
         leur fin de partie doit être « Libre », sinon ils héritaient en silence de
         l'objectif d'un style cliqué juste avant. */
      function libre() { choose('suGoal', 'data-goal', 'none'); }
      function syncDjUI(avecRotation) {
        var box = document.getElementById('suDjBox'), tit = document.getElementById('suDjTitle');
        var off = document.querySelector('.suDj[data-dj="0"]');
        if (box) box.style.display = avecRotation ? '' : 'none';
        if (tit) { tit.style.display = avecRotation ? '' : 'none'; tit.textContent = '🎧 Titres par DJ avant de passer la main'; }
        if (off) off.style.display = avecRotation ? 'none' : '';
        if (box) box.className = 'grid grid-cols-3 gap-2 mb-2';
        var note = document.getElementById('suDjNote');
        if (note) note.style.display = avecRotation ? '' : 'none';
        var fin = document.getElementById('suFinalBox');
        if (fin) fin.style.display = avecRotation ? '' : 'none';
      }
      /* Un style masque les options qui le contredisent — les afficher, c'était
         promettre un réglage qui ne s'applique pas :
         · Tournoi / Surprise : « Partie à l'aveugle » (le style inverse existe) ;
           en Surprise, le « mode de départ » aussi (la roue l'écrase à chaque manche).
         · Tous à l'aveugle / Duel : l'app choisit, joue et corrige → la source du
           son, le mode de départ, la roue, la finale, la fin de partie (le nombre
           de manches est déjà dans le bloc aveugle) et le temps de vote (personne
           ne vote, l'app corrige) n'ont plus de prise. Duel : pas d'équipes à deux.
         · Animateur unique : « Je joue aussi » (le style EST « l'hôte ne joue
           pas »), la partie à l'aveugle (contradiction : personne n'anime) et la
           finale à l'aveugle (elle suppose une rotation de DJ). */
      var CACHE_PAR_STYLE = {
        tournoi:  ['secBlind'],
        surprise: ['secBlind', 'secMode'],
        // suBlind (l'interrupteur seul) : dans ces deux styles, l'aveugle EST le
        // style — on garde la config (playlists, manches) mais pas le bouton qui
        // permettrait de l'éteindre en le contredisant.
        aveugle:  ['suBlind', 'secAudio', 'secMode', 'voteSecsBox'],
        duel:     ['suBlind', 'secAudio', 'secMode', 'voteSecsBox', 'secTeams'],
        anim:     ['suHostPlays', 'secBlind'],
        // Dingo : comme l'aveugle, plus les équipes (le handicap est individuel).
        dingo:    ['suBlind', 'secAudio', 'secMode', 'voteSecsBox', 'secTeams']
      };
      var TOUTES_SECTIONS = ['suHostPlays', 'secBlind', 'suBlind', 'secAudio', 'secMode', 'secWheel',
                             'secBonus', 'secDingo', 'secGoal', 'secAns', 'voteSecsBox', 'secTeams'];
      function syncSections(style) {
        var cache = CACHE_PAR_STYLE[style] || [];
        TOUTES_SECTIONS.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.style.display = cache.indexOf(id) >= 0 ? 'none' : '';
        });
      }
      function applyStyle(b, silencieux) {
        Array.prototype.forEach.call(document.querySelectorAll('.suStyle'), function (x) {
          x.className = x.className.replace('bg-gradient-to-r from-neon-pink to-neon-violet text-white', 'bg-black/30 text-white/70');
        });
        b.className = b.className.replace('bg-black/30 text-white/70', 'bg-gradient-to-r from-neon-pink to-neon-violet text-white');
        var style = b.getAttribute('data-style');
        var f = STYLES[style]; if (f) f();
        syncSections(style);
        // APRÈS syncSections : celui-ci réaffiche tout ce qu'il ne masque pas et
        // annulerait sinon le masquage des réglages de vote inertes.
        syncPointsUI();
        if (!silencieux) toast('Réglages appliqués ✓', 'ok');
      }
      Array.prototype.forEach.call(document.querySelectorAll('.suStyle'), function (b) {
        b.onclick = function () { applyStyle(b, false); };
      });
      // Un style est actif d'emblée : on peut lancer sans rien régler.
      var def = document.querySelector('.suStyle[data-style="tournoi"]');
      if (def) applyStyle(def, true);
    })();

    $('#create').onclick = function () {
      // Tout est protégé : une erreur ici laissait le bouton sans effet apparent.
      try {
        var val = function (sel, def) { var e = $(sel); var n = e ? parseInt(e.value, 10) : NaN; return isNaN(n) ? def : n; };
        var txt = function (sel) { var e = $(sel); return e && e.value ? e.value.trim() : ''; };
        var hostName = txt('#hostName') || 'Hôte';
        var partyName = txt('#partyName') || 'Blind Test';
        store.set('hostName', hostName);
        var cfg = {
          pointsBuzz: val('#pBuzz', 5),
          pointsVote: val('#pVote', 2),
          pointsWrong: val('#pWrong', -2),
          pointsVoteWrong: val('#pVoteWrong', -1),
          voteSecs: Math.max(0, val('#voteSecs', 10))
        };
        var st = initialState(genCode(), hostName, partyName, cfg);
        st.mode = setupMode; st.teams = setupTeams; st.answerMode = setupAns;
        // setupDj : 0 = pas de rotation · -1 = aléatoire (1 à 5) · n = tous les n titres
        st.djRotate = setupDj !== 0 ? 1 : 0; st.djEvery = setupDj || 5;
        st.turboSecs = Math.min(120, Math.max(10, val('#turboSecs', 30)));
        st.combos = setupCombos; st.jokers = setupJokers; st.wheel = setupWheel; st.audioMode = setupAudio;
        st.contreMode = setupContre;   // 'ice' (écran gelé) ou 'block' (barré sec)
        st.dingo = setupDingo;   // interrupteur, combinable avec tous les styles
        /* Toujours 0 : l'interrupteur qui le pilotait a été retiré (il était inerte).
           Le champ reste pour les parties enregistrées avant `finalN`, où il sert
           encore de valeur de repli dans launchRound. */
        st.blindFinal = setupBlindFinal;
        st.hostPlays = setupHostPlays;
        /* Manches à l'aveugle « en fin de tour » : sans rotation de DJ, il n'y a pas
           de fin de tour. On enregistre 0 plutôt que de laisser un réglage qui
           contredit le style choisi — même s'il est inerte aujourd'hui. */
        st.finalN = st.djRotate ? setupFinalN : 0;
        st.goal = setupGoal;
        st.goalVal = Math.max(1, val('#goalVal', setupGoal === 'score' ? 50 : 20));
        st.fredEvery = Math.max(1, val('#fredEvery', 10));

        /* Partie à l'aveugle : l'app fait tout. On force les réglages cohérents
           pour que personne ne puisse connaître la réponse à l'avance. */
        if (setupBlind) {
          st.blind = 1;
          st.mode = (setupBlindPlay === 'turbo') ? 'turbo' : 'classic'; // buzz par défaut
          st.djRotate = 0;          // aucun DJ
          st.audioMode = 'device';  // c'est l'app qui joue
          store.set('autoPlaylist', setupBlindPls); // playlist(s) choisie(s) pour la partie
        }
        store.set('hostGame', st);

        // IMPORTANT : si le hash vaut déjà "host" (cas d'un retour au setup après
        // une partie supprimée), l'affecter ne déclenche AUCUN hashchange, donc
        // route() ne serait jamais rappelé et le clic semblerait sans effet.
        if (location.hash.replace('#', '') === 'host') route();
        else location.hash = 'host';
      } catch (e) {
        toast('Erreur au lancement : ' + (e && e.message ? e.message : e), 'err');
      }
    };
  }

  /* --------------------------------------------------------------------------
     4 bis. MODE SOLO — entraînement
     Aucun canal temps réel, aucun joueur, aucun hôte : l'app tire un morceau,
     le joue, corrige et compte. Sert à s'échauffer avant une soirée ou à jouer
     seul dans le train. La mémoire musicale est PARTAGÉE avec les parties :
     s'entraîner l'après-midi ne fera pas ressortir les mêmes titres le soir.
     -------------------------------------------------------------------------- */
  function startSolo() {
    var SOLO_MAX = 12;                 // points d'une bonne réponse immédiate
    var ANS_SOLO = [['either', '🎲 Titre ou artiste'], ['title', '💿 Titre'],
                    ['artist', '🎤 Artiste'], ['both', '🎵 Les deux']];
    var st = {
      phase: 'setup',                  // setup · play · reveal · done
      pls: [], ans: store.get('soloAns', 'either'), total: store.get('soloTotal', 10),
      round: 0, score: 0, streak: 0, best: 0, good: 0,
      track: null, verdict: null, gain: 0, said: '', at: 0,
      record: false, recVal: 0, hist: []
    };
    (function () {
      // On repart des playlists de la dernière fois (solo, sinon celles des parties).
      var v = store.get('soloPls', null) || store.get('autoPlaylist', null);
      var arr = (Object.prototype.toString.call(v) === '[object Array]') ? v : (v ? [v] : []);
      st.pls = arr.filter(function (id) { return !!playlistById(id); });
      if (!st.pls.length) st.pls = ['p80'];
    })();
    /* Sur un thème « à œuvre » (film / série), la question du morceau l'emporte sur
       le réglage : demander l'artiste d'une bande originale n'a pas de réponse. */
    function soloAns() { return (st.track && st.track.oeuvre) ? 'oeuvre' : st.ans; }
    var loading = false, tick = null;
    /* Le solo joue TOUJOURS le son lui-même. Sans ces deux lignes, un réglage
       « source à part » laissé par une soirée précédente rendait l'entraînement
       muet — dzPlay refuse de jouer quand l'app n'est pas censée produire le son. */
    var audioAvant = appAudioMode, blindAvant = blindAudio;
    appAudioMode = 'device'; blindAudio = true;
    keepAwake();
    var played = mem().tracks;

    function artistes() {
      var seen = {}, out = [];
      st.pls.forEach(function (id) {
        var p = playlistById(id); if (!p) return;
        plSources(p).forEach(function (a) { if (!seen[a]) { seen[a] = 1; out.push(a); } });
      });
      return out;
    }
    function pioche() {
      if (loading) return;
      var arts = artistes();
      if (!arts.length) { toast('Choisis au moins une playlist', 'err'); st.phase = 'setup'; render(); return; }
      loading = true; render();
      autoPick({ artists: arts }, played, function (t) {
        loading = false;
        if (!t) { toast('Aucun morceau trouvé, réessaie', 'err'); st.phase = 'setup'; render(); return; }
        played.push(t.id);
        if (played.length > MEM_TRACKS) played.shift();
        memSave();
        st.track = { title: t.title, artist: t.artist ? t.artist.name : '', cover: (t.album && t.album.cover_medium) || '', preview: t.preview, oeuvre: t._oeuvre || null, oeuLabel: t._oeuLabel || null };
        st.said = ''; st.verdict = null; st.gain = 0;
        st.at = Date.now(); st.phase = 'play';
        render();
        dzPlay(st.track.preview);
      });
    }
    function suivant() {
      if (st.round >= st.total) { fin(); return; }
      st.round++;
      pioche();
    }
    function fin() {
      dzPause(); if (tick) { clearInterval(tick); tick = null; }
      var rec = store.get('soloBest', 0);
      st.record = st.score > rec;
      if (st.record) store.set('soloBest', st.score);
      st.recVal = Math.max(rec, st.score);
      st.phase = 'done';
      confetti(200); beep(880, 0.3, 'sine');
      render();
    }
    function repondre(txt) {
      if (st.phase !== 'play' || !st.track) return;
      var sec = Math.max(0, (Date.now() - st.at) / 1000);
      // Même règle qu'en partie : sur une musique de film, on demande le film.
      var v = txt ? fuzzyHit(txt, st.track, soloAns()) : 'ko';
      // Vite = plus de points, mais une bonne réponse rapporte toujours au moins 3.
      var base = Math.max(3, SOLO_MAX - Math.floor(sec / 2.5));
      st.said = txt || '';
      st.verdict = v || 'ko';
      st.gain = (v === 'ok') ? base : (v === 'half' ? Math.ceil(base / 2) : 0);
      st.score += st.gain;
      if (v === 'ok' || v === 'half') { st.streak++; if (st.streak > st.best) st.best = st.streak; if (v === 'ok') st.good++; }
      else st.streak = 0;
      st.hist.push({ t: st.track.title, a: st.track.artist, v: st.verdict, g: st.gain, s: st.said });
      dzPause(); if (tick) { clearInterval(tick); tick = null; }
      st.phase = 'reveal';
      beep(st.gain ? 880 : 160, 0.22, st.gain ? 'sine' : 'sawtooth');
      if (v === 'ok') confetti(90);
      render();
    }

    function render() {
      var corps = '';
      /* La recherche passe AVANT tout le reste : la première pioche part depuis
         l'écran de réglages, et sans ça on restait plusieurs secondes sur cet
         écran après avoir cliqué « Commencer », comme si le bouton était mort. */
      if (loading) {
        corps = '<div class="flex-1 flex flex-col items-center justify-center py-16 text-center"><div class="text-6xl mb-3 animate-pulse">💿</div><p class="text-white/60">Recherche d\'un morceau…</p></div>';
      } else if (st.phase === 'setup') {
        corps = [
          '<h2 class="text-3xl font-extrabold mb-1">Entraînement 🎯</h2>',
          '<p class="text-white/50 mb-6">Tout seul, sans code ni joueurs : l\'app envoie un extrait, tu écris ce que tu reconnais, elle corrige.</p>',
          '<p class="text-sm text-white/60 mb-2 font-bold uppercase">Playlists</p>',
          '<div class="flex flex-wrap gap-2 mb-1">' + PLAYLISTS.map(function (p) {
            var on = st.pls.indexOf(p.id) >= 0;
            return '<button type="button" class="soPl px-3 py-1.5 rounded-full text-sm font-bold ' + (on ? 'bg-neon-violet text-white' : 'bg-black/30 text-white/75') + '" data-pl="' + p.id + '">' + p.icon + ' ' + esc(p.name) + '</button>';
          }).join('') + '</div>',
          '<p class="text-white/35 text-xs mb-5">Tu peux en cocher plusieurs.</p>',
          '<p class="text-sm text-white/60 mb-2 font-bold uppercase">Ce qu\'il faut trouver</p>',
          '<div class="grid grid-cols-2 gap-2 mb-5">' + ANS_SOLO.map(function (a) {
            return '<button type="button" class="soAns py-2.5 rounded-xl text-sm font-bold ' + (st.ans === a[0] ? 'bg-neon-cyan text-black' : 'bg-black/30 text-white/70') + '" data-ans="' + a[0] + '">' + a[1] + '</button>';
          }).join('') + '</div>',
          '<div class="flex items-center gap-2 mb-6 text-sm text-white/60"><span>🏁 Nombre de titres :</span><input id="soTotal" type="number" min="3" max="50" value="' + st.total + '" class="w-16 bg-black/40 rounded-lg py-1 text-center font-bold outline-none" /></div>',
          (store.get('soloBest', 0) ? '<p class="text-center text-neon-gold font-bold mb-4">🏅 Ton record : ' + store.get('soloBest', 0) + ' pts</p>' : ''),
          '<button id="soStart" class="btn-glow w-full py-5 rounded-2xl text-xl font-extrabold bg-gradient-to-r from-neon-pink to-neon-violet active:animate-pop">▶️ Commencer</button>'
        ].join('');
      } else if (st.phase === 'play') {
        corps = [
          '<div class="text-center mb-3"><span class="text-white/45 text-sm">Titre ' + st.round + '/' + st.total + '</span> · <span class="text-neon-gold font-extrabold">' + st.score + ' pts</span>'
            + (st.streak >= 2 ? ' · <span class="text-neon-lime font-bold">🔥 ' + st.streak + '</span>' : '') + '</div>',
          '<div class="glass rounded-2xl p-6 text-center mb-4">',
          '  <div class="text-6xl mb-2 animate-pulse">🎧</div>',
          '  <p class="text-4xl font-extrabold text-neon-cyan"><span id="soChrono">0</span><span class="text-lg">s</span></p>',
          '  <button id="soReplay" class="mt-3 px-4 py-2 rounded-xl glass font-bold text-sm">⏯️ Réécouter depuis le début</button>',
          '</div>',
          (soloAns() === 'oeuvre' ? '<div class="text-center mb-2"><span class="inline-block px-3 py-1 rounded-full bg-neon-gold/25 ring-1 ring-neon-gold text-sm font-bold">' + ansUI('oeuvre', st.track.oeuLabel).badge + '</span></div>' : ''),
          '<input id="soAnsw" maxlength="120" autocomplete="off" placeholder="' + (soloAns() === 'oeuvre' ? ansUI('oeuvre', st.track.oeuLabel).ph : st.ans === 'artist' ? '🎤 Artiste…' : st.ans === 'title' ? '💿 Titre…' : st.ans === 'both' ? '💿 Titre + 🎤 artiste…' : '🎲 Titre ou artiste…') + '" class="w-full bg-black/40 rounded-xl px-4 py-4 text-lg text-center outline-none focus:ring-2 ring-neon-pink mb-3" />',
          '<button id="soSend" class="w-full py-4 rounded-2xl text-lg font-extrabold bg-gradient-to-r from-neon-pink to-neon-violet active:animate-pop mb-2">Valider</button>',
          '<button id="soSkip" class="w-full py-3 rounded-xl glass text-white/70 font-bold text-sm">🤷 Je passe · montre-moi la réponse</button>'
        ].join('');
      } else if (st.phase === 'reveal') {
        var ico = st.verdict === 'ok' ? '✅' : st.verdict === 'half' ? '➗' : '❌';
        var lbl = st.verdict === 'ok' ? 'Trouvé !' : st.verdict === 'half' ? 'À moitié' : (st.said ? 'Raté' : 'Passé');
        var col = st.verdict === 'ok' ? 'text-neon-lime' : st.verdict === 'half' ? 'text-neon-gold' : 'text-rose-400';
        corps = [
          '<div class="text-center mb-3"><span class="text-white/45 text-sm">Titre ' + st.round + '/' + st.total + '</span> · <span class="text-neon-gold font-extrabold">' + st.score + ' pts</span></div>',
          '<div class="text-center animate-slidein">',
          '  <div class="text-6xl mb-1">' + ico + '</div>',
          '  <p class="text-2xl font-extrabold ' + col + '">' + lbl + (st.gain ? ' +' + st.gain : '') + '</p>',
          (st.said ? '  <p class="text-white/45 text-sm mt-1">Tu as écrit : « ' + esc(st.said) + ' »</p>' : ''),
          (st.track.oeuvre ? '  <div class="mt-3"><span class="inline-block px-4 py-1.5 rounded-2xl bg-neon-gold/25 ring-1 ring-neon-gold font-extrabold">🎬 ' + esc(oeuvreNom(st.track.oeuvre)) + '</span></div>' : ''),
          '  <div class="glass rounded-2xl p-4 mt-4 flex items-center gap-3 text-left">',
          (st.track.cover ? '    <img src="' + esc(st.track.cover) + '" alt="" class="w-16 h-16 rounded-lg" />' : ''),
          '    <div class="min-w-0"><div class="font-extrabold truncate">' + esc(st.track.title) + '</div><div class="text-white/55 text-sm truncate">' + esc(st.track.artist) + '</div></div>',
          '  </div>',
          '</div>',
          '<button id="soNext" class="mt-5 w-full py-4 rounded-2xl text-lg font-extrabold bg-gradient-to-r from-neon-cyan to-neon-lime text-black active:animate-pop">'
            + (st.round >= st.total ? '🏁 Voir mon résultat' : 'Titre suivant ▶') + '</button>'
        ].join('');
      } else {
        corps = [
          '<div class="text-center animate-slidein">',
          '  <div class="text-6xl mb-1">🏁</div>',
          '  <p class="bt-title text-2xl font-extrabold glow-cyan">TERMINÉ</p>',
          '  <p class="text-5xl font-extrabold text-neon-gold my-3">' + st.score + ' <span class="text-xl">pts</span></p>',
          '  <p class="text-white/60">' + st.good + ' titre' + (st.good > 1 ? 's' : '') + ' trouvé' + (st.good > 1 ? 's' : '') + ' sur ' + st.total + ' · meilleure série : ' + st.best + '</p>',
          (st.record ? '  <p class="text-neon-lime font-extrabold mt-2">🏅 Nouveau record !</p>'
                     : '  <p class="text-white/40 text-sm mt-2">Ton record : ' + st.recVal + ' pts</p>'),
          '</div>',
          '<div class="glass rounded-2xl p-4 mt-5">' + st.hist.map(function (h) {
            return '<div class="flex items-center gap-2 py-1 border-b border-white/5 last:border-0">'
              + '<span>' + (h.v === 'ok' ? '✅' : h.v === 'half' ? '➗' : '❌') + '</span>'
              + '<span class="flex-1 min-w-0 truncate text-sm">' + esc(h.t) + ' <span class="text-white/40">— ' + esc(h.a) + '</span></span>'
              + '<span class="text-white/50 text-xs">' + (h.g ? '+' + h.g : '·') + '</span></div>';
          }).join('') + '</div>',
          '<button id="soAgain" class="mt-5 w-full py-4 rounded-2xl text-lg font-extrabold bg-gradient-to-r from-neon-pink to-neon-violet active:animate-pop">🔁 Rejouer</button>'
        ].join('');
      }

      app.innerHTML = '<div class="bt-setup flex-1 flex flex-col px-5 py-6 max-w-md mx-auto w-full">'
        + '<div class="flex items-center justify-between mb-4">'
        + '<button id="soBack" class="text-white/50 text-sm">← Retour</button>'
        + '<span class="text-sm font-bold text-white/70">🎯 Entraînement</span></div>'
        + corps + '</div>';

      /* Le chrono met à jour UNIQUEMENT son propre élément : redessiner l'écran
         effacerait la réponse en cours de saisie (la règle d'or du projet). */
      if (tick) { clearInterval(tick); tick = null; }
      if (st.phase === 'play' && !loading) {
        tick = setInterval(function () {
          var e = document.getElementById('soChrono');
          if (!e) { clearInterval(tick); tick = null; return; }
          e.textContent = Math.floor((Date.now() - st.at) / 1000);
        }, 250);
      }

      bind('#soBack', function () { location.hash = ''; });
      Array.prototype.forEach.call(document.querySelectorAll('.soPl'), function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-pl'), i = st.pls.indexOf(id);
          if (i >= 0) { if (st.pls.length > 1) st.pls.splice(i, 1); }   // jamais zéro
          else st.pls.push(id);
          store.set('soloPls', st.pls); render();
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('.soAns'), function (b) {
        b.onclick = function () { st.ans = b.getAttribute('data-ans'); store.set('soloAns', st.ans); render(); };
      });
      bind('#soStart', function () {
        var e = document.getElementById('soTotal');
        var n = e ? parseInt(e.value, 10) : NaN;
        st.total = isNaN(n) ? 10 : Math.min(50, Math.max(3, n));
        store.set('soloTotal', st.total);
        st.round = 0; st.score = 0; st.streak = 0; st.best = 0; st.good = 0; st.hist = [];
        suivant();
      });
      bind('#soReplay', function () { if (st.track) dzPlay(st.track.preview); });
      bind('#soSend', function () { var e = document.getElementById('soAnsw'); repondre(e ? e.value.trim() : ''); });
      bind('#soSkip', function () { repondre(''); });
      bind('#soNext', suivant);
      bind('#soAgain', function () { st.phase = 'setup'; render(); });
      var inp = document.getElementById('soAnsw');
      if (inp) { inp.onkeydown = function (e) { if (e.key === 'Enter') repondre(inp.value.trim()); }; inp.focus(); }
    }

    current = { destroy: function () {
      dzPause(); if (tick) clearInterval(tick);
      appAudioMode = audioAvant; blindAudio = blindAvant;   // on rend l'audio comme on l'a trouvé
    } };
    render();
  }

  function initialState(code, hostName, partyName, cfg) {
    return {
      code: code, hostName: hostName, partyName: partyName, config: cfg,
      round: 0, phase: 'lobby', theme: '', mode: 'classic', teams: 0, answerMode: 'both',
      /* Question de la manche en cours, imposée par le thème (film / série) :
         null = on s'en tient à answerMode. Recalculée par syncAsk(). */
      ask: null, askLabel: null,
      source: null, _srcIdx: -1, fredEvery: 10, fredCount: 0, year: null, guesses: {},
      reveal: null, suggest: null,
      buzzer: null, answer: null, votes: {}, result: null, buzzAt: 0,
      buzzOpenAt: 0, buzzMs: null, voteAt: 0, tried: [],
      answers: {}, grades: {}, turboSecs: 30, turboScores: null,
      djRotate: 0, djEvery: 5, djCount: 0, _djIdx: -1, _djLeft: 0, _djSpan: 0, dj: null,
      goal: 'none', goalVal: 0, combos: 1, jokers: 1, jok: {}, contreMode: 'ice',
      // 🤪 Dingo : handicap permanent + ⚡ tac o tac obligatoire en fin de partie.
      dingo: 0, tac: 0, tacLeft: 0, tacTotal: 0,
      wheel: 0, challenge: null, mult: 1, audioMode: 'device', blind: 0,
      blindFinal: 0, blindRound: 0, hostPlays: 1,
      players: {},   // id -> { id, name, score, team }
      history: []
    };
  }

  /* --------------------------------------------------------------------------
     5. CONTRÔLEUR HÔTE (autorité de la partie)
     -------------------------------------------------------------------------- */
  function startHost(state) {
    var code = state.code;
    store.set('hostGame', state);
    keepAwake();
    appAudioMode = state.audioMode || 'device'; // qui produit le son sur cette partie
    blindAudio = !!(state.blind || state.blindRound);
    var roundTrack = null; // morceau Deezer choisi pour la manche (local hôte, jamais diffusé)
    /* Playlists automatiques actives. On peut en cocher PLUSIEURS (Années 80 + Rock…) :
       on joue alors l'union de leurs artistes. L'ancien format enregistré était un
       identifiant seul — on le relit sans casser les parties déjà configurées. */
    var autoPls = (function () {
      var v = store.get('autoPlaylist', null);
      if (!v) return [];
      return (Object.prototype.toString.call(v) === '[object Array]') ? v.slice() : [v];
    })();
    function plActive() { return autoPls.length > 0; }
    function savePls() { if (autoPls.length) store.set('autoPlaylist', autoPls); else store.del('autoPlaylist'); }
    function plNames() {
      return autoPls.map(function (id) { var p = playlistById(id); return p ? p.icon + ' ' + p.name : null; })
        .filter(Boolean).join(' + ');
    }
    var autoF = store.get('autoFilters', { d: [], g: [], l: [] }); // filtres combinés (décennie/genre/langue)
    function fActive() { return (autoF.d.length + autoF.g.length + autoF.l.length) > 0; }
    /* Liste d'artistes à utiliser : les filtres priment sur la playlist. */
    function currentArtists() {
      if (fActive()) return filterArtists(autoF.d, autoF.g, autoF.l);
      // Union des playlists cochées, sans doublon (Queen est dans 80s ET dans Rock).
      var seen = {}, out = [];
      autoPls.forEach(function (id) {
        var p = playlistById(id); if (!p) return;
        plSources(p).forEach(function (a) { if (!seen[a]) { seen[a] = 1; out.push(a); } });
      });
      return out.length ? out : null;
    }
    function fSummary() {
      var p = [];
      if (autoF.d.length) p.push(autoF.d.map(function (d) { return d + 's'; }).join('/'));
      if (autoF.g.length) p.push(autoF.g.map(function (g) { var x = GENRES.filter(function (o) { return o.v === g; })[0]; return x ? x.t.replace(/^\S+\s/, '') : g; }).join('/'));
      if (autoF.l.length) p.push(autoF.l.map(function (l) { return l === 'fr' ? 'Français' : 'International'; }).join('/'));
      return p.join(' · ');
    }
    /* Morceaux déjà passés : la liste est PARTAGÉE avec les parties précédentes
       (mémoire persistante), sinon on rejouait les mêmes titres d'une soirée à
       l'autre. Le compteur affiché, lui, ne compte que la partie en cours. */
    var playedIds = mem().tracks;
    var playedNow = 0;
    var autoLoading = false;

    /* Précharge le morceau suivant de la playlist pour qu'il soit prêt
       dès que l'hôte lance la manche (la recherche Deezer est asynchrone). */
    function prefetchAuto() {
      if (roundTrack || autoLoading) return;
      /* SOURCE EXTERNE : l'app ne choisit RIEN. Elle continuait à tirer un morceau
         au hasard (une playlist restait enregistrée d'une partie précédente), et ce
         morceau finissait affiché comme « la réponse » sur tous les téléphones —
         alors que la chanson venait de l'enceinte et n'avait aucun rapport. Il
         faussait aussi la correction automatique. Seule exception : les manches à
         l'aveugle, où l'app DOIT fournir le son (canPlayInApp en tient compte). */
      if (!canPlayInApp()) return;
      var arts = currentArtists();
      if (!arts || !arts.length) return;
      var pl = { artists: arts };
      autoLoading = true;
      autoPick(pl, playedIds, function (t) {
        autoLoading = false;
        if (!t) {
          /* Recherche bredouille alors qu'une manche l'attend. Si des filtres sont
             actifs, ce sont eux le problème neuf fois sur dix — et à l'aveugle l'hôte
             n'a aucun écran pour les corriger : il cliquerait « Lancer » indéfiniment
             sans que rien ne se passe. On les abandonne et on repart sur une playlist
             sûre. Une seule reprise : au second échec (réseau coupé), on rend la main. */
          if (attenteMorceau && fActive()) {
            autoF = { d: [], g: [], l: [] }; store.set('autoFilters', autoF);
            autoPls = ['p80']; savePls();
            toast('Ces filtres ne donnent rien — retour aux Années 80', 'info');
            prefetchAuto();
            return;
          }
          // On lâche l'attente : sinon le lancement restait suspendu sans fin.
          attenteMorceau = false;
          toast('Aucun morceau trouvé — vérifie ta connexion, puis relance', 'err');
          renderHost(); return;
        }
        playedIds.push(t.id); playedNow++;
        if (playedIds.length > MEM_TRACKS) playedIds.shift();
        memSave();
        // oeuvre : porté par le morceau lui-même, car c'est LUI qui décide de la
        // question posée sur cette manche (voir modeReponse / ansUI).
        roundTrack = { title: t.title, artist: t.artist ? t.artist.name : '', cover: (t.album && t.album.cover_medium) || '', preview: t.preview, year: null, auto: true, oeuvre: t._oeuvre || null, oeuLabel: t._oeuLabel || null };
        fillYear(t, roundTrack, renderHost);
        /* Le morceau arrive après coup : si la manche est déjà lancée, on le joue.
           Et comme c'est LUI qui porte la question (film / série), il faut la
           recalculer et la diffuser — sinon les joueurs voient « Titre + Artiste »
           sur une bande originale dont personne ne connaît l'interprète. */
        var enCours = state.phase === 'buzzing' || state.phase === 'racing' || state.phase === 'year_guess';
        if (enCours) dzPlay(roundTrack.preview);
        var avant = state.ask; syncAsk();
        if (enCours && state.ask !== avant) publish(); else renderHost();
        if (attenteMorceau) { attenteMorceau = false; launchRound(); }  // la manche attendait ce morceau
      });
    }

    function persist() { store.set('hostGame', state); }
    /* Le mode « l'app joue » s'impose dès qu'on entre sur une manche à l'aveugle. */
    function syncBlindAudio() { blindAudio = !!(state.blind || state.blindRound); }
    function publish() { syncBlindAudio(); persist(); if (chan) chan.sendState(state); renderHost(); }

    function assignTeam(pl) {
      if (!state.teams) { pl.team = null; return; }
      var counts = []; for (var i = 0; i < state.teams; i++) counts[i] = 0;
